# Dias World Map Registry
# ========================
# Hand-authored positions for the dashboard Map tab.
# Coordinates use a 0–100 x / 0–100 y grid (top-left origin).
#
# entry: must match a lore frontmatter `name` (or kebab slug).
# kind: land | place | inhabitant | story | landmark
#
# After editing, regenerate:
#   python3 scripts/build_story_dashboard.py
#
# The builder validates that every `entry` resolves and prints map warnings.

