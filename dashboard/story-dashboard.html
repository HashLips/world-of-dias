", "meta": {"region": "Driftfall", "nature": "person"}, "assets": [], "summary": "Vexra Coil is the Free-Captain of Driftfall.", "words": 93, "sections": [{"h": "Overview", "t": "Vexra Coil is the Free-Captain of Driftfall."}, {"h": "Description", "t": "F432 race record: **Axiomorph**.\n\nVexra built influence by surviving hostile takeovers, then absorbing rivals into moving alliances and paid crew structures.\n\nHer authority is kinetic: command by momentum, risk, and spectacle."}, {"h": "Beliefs About Them", "t": "Followers call her fearless and adaptive. Detractors say she thrives on chaos because only chaos preserves her advantage."}, {"h": "Narrative Role", "t": "Vexra represents Driftfall's unstable freedom economy, where power flows fastest to whoever moves first."}, {"h": "Notes", "t": "Her network influence spans salvage routes, boat crews, and temporary port markets."}], "unresolved": []}, {"id": "inhabitant:veyrin", "slug": "veyrin", "label": "Veyrin", "category": "inhabitant", "status": "canonical", "themes": ["signature traits", "anomaly inheritance", "social negotiation"], "path": "inhabitants/veyrin.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)", "nature": "humanoid race with individual signature abilities"}, "assets": [], "summary": "Veyrin are a human-like race in F432 distinguished by one innate signature trait per individual.", "words": 151, "sections": [{"h": "Overview", "t": "Veyrin are a human-like race in F432 distinguished by one innate **signature trait** per individual."}, {"h": "Description", "t": "Veyrin anatomy is broadly humanoid, but each person manifests a stable uncommon capacity (for example reflective memory, interval pattern sensing, pressureless balance, or tonal tracing). These traits are usually narrow and situational rather than unlimited power systems.\n\nVisually, many Veyrin pass as human at first glance, then show one persistent marker linked to their trait: mirrored irises, shifting vein-light, pattern-scored skin lines, or a subtle halo-like distortion around hands, voice, or gaze during focused use."}, {"h": "Beliefs About Them", "t": "They are often admired, overestimated, or mistrusted depending on context; Veyrin communities emphasize that trait discipline matters more than trait spectacle."}, {"h": "Narrative Role", "t": "Veyrin support character-driven storytelling where personal difference matters without forcing all conflict into combat-scale abilities."}, {"h": "Notes", "t": "Veyrin traits vary person-to-person and should be treated as specific competencies with limits, costs, and training."}], "unresolved": []}, {"id": "inhabitant:zephan-quell", "slug": "zephan-quell", "label": "Zephan Quell", "category": "inhabitant", "status": "canonical", "themes": ["cultural magnetism", "artistic spectacle", "social charisma"], "path": "inhabitants/zephan-quell.md", "region": "The Sketchy Gallery", "parent_region": "", "meta": {"region": "The Sketchy Gallery", "nature": "person"}, "assets": [], "summary": "Zephan Quell is the Curator-Lord of The Sketchy Gallery.", "words": 109, "sections": [{"h": "Overview", "t": "Zephan Quell is the Curator-Lord of The Sketchy Gallery."}, {"h": "Description", "t": "F432 race record: **Choirglass**.\n\nZephan is an extraordinary and socially magnetic figure known for curating immersive art spaces and carrying multiple performative talents.\n\nOne recurring depiction presents him in active struggle with a bull, reinforcing his reputation for theatrical courage."}, {"h": "Beliefs About Them", "t": "Admirers see Zephan as a celebrant of beauty and shared wonder. Skeptics argue he favors spectacle over restraint."}, {"h": "Narrative Role", "t": "Zephan represents soft cultural authority built from taste, gathering, and aesthetic intensity rather than formal rule."}, {"h": "Notes", "t": "He is strongly associated with high visitor engagement and social vitality in the gallery district."}], "unresolved": []}, {"id": "myth:hearth-laughter-week", "slug": "hearth-laughter-week", "label": "Hearth Laughter Week", "category": "myth", "status": "myth", "themes": ["rebuilding joy", "scheduled delight", "communal games", "healing", "hope"], "path": "myths/hearth-laughter-week.md", "region": "Hearthvale", "parent_region": "", "meta": {"region": "Hearthvale"}, "assets": [], "summary": "Hearth Laughter Week is a Hearthvale tradition\u2014described in soft mythic tones even where it is real on the calendar\u2014when serious work scales back and games, songs, and silly competitions take the town square. The point is not escape from labor forever, but...", "words": 234, "sections": [{"h": "Summary", "t": "**Hearth Laughter Week** is a Hearthvale tradition\u2014described in soft mythic tones even where it is real on the calendar\u2014when **serious work scales back** and **games, songs, and silly competitions** take the town square. The point is not escape from labor forever, but the claim that **dignity includes laughter**, and a second life must have room to **shed weight aloud**."}, {"h": "Myth Text", "t": "They say the first Laughter Week began when a joiner, a potter, and a baker bet who could make the **tallest structure from scraps** in one afternoon. The tower fell\u2014of course it fell\u2014and instead of anger, the crowd cheered, because the fall was **intentional and soft**.\n\nAlwen is sometimes said to have watched from the side, not ordering anything, only **smiling** at the right moment so nobody felt ashamed to cheer.\n\nIn later years, the week gained rules gentle enough to be sweet: you may not mock someone\u2019s first attempt at a new skill; you **must** cheer the worst singing; the last slice of pie goes to whoever **laughed the hardest** at their own mistake.\n\nSorel jokes that Hearthvale is naive. Hearthvale answers: **na\u00efvet\u00e9 is a kind of tool**, like a hammer, if you use it to build a roof over grief."}, {"h": "Notes", "t": "Ties to **Kiln Fires of Second Beginning** and **Hearth** identity without repeating kiln trauma\u2014this is the **uplift** side of the same world."}], "unresolved": []}, {"id": "myth:old-masters-of-averra-isle", "slug": "old-masters-of-averra-isle", "label": "Old Masters of Averra Isle", "category": "myth", "status": "myth", "themes": ["hidden teachers", "diffusion of power", "island mystery"], "path": "myths/old-masters-of-averra-isle.md", "region": "Nauw", "parent_region": "", "meta": {"region": "Nauw"}, "assets": [], "summary": "Across Nauw, a persistent story holds that most of the magic worked openly in the Glasswater Fields, Brindle March, and Velorian Basin did not arise locally but was first taught by secretive Old Masters living on Averra Isle, who supposedly trained early pr...", "words": 147, "sections": [{"h": "Summary", "t": "Across Nauw, a persistent story holds that most of the magic worked openly in the Glasswater Fields, Brindle March, and Velorian Basin did not arise locally but was first taught by secretive Old Masters living on Averra Isle, who supposedly trained early practitioners before vanishing or sealing the island."}, {"h": "Myth Text", "t": "They say the glass-bright rivers remember enchantments whispered at their sources, that the march's oldest bridges hold sigils the builders half forgot, and that Veloria's first market-mages learned their trade from envoys who rowed back from Averra with ink still wet in their journals\u2014then swore the isle had no harbor and no masters, only mist. Skeptics call it dock gossip; believers say the mainland's power still flows from that hidden shore."}, {"h": "Notes", "t": "Treated as folklore and rumor, not verified history. Compatible with modern ignorance of present-day conditions on Averra Isle."}], "unresolved": []}, {"id": "myth:the-artist-returned-from-sorel", "slug": "the-artist-returned-from-sorel", "label": "The Artist Returned from Sorel", "category": "myth", "status": "myth", "themes": ["impossible return", "survival tale", "witness uncertainty"], "path": "myths/the-artist-returned-from-sorel.md", "region": "Nauw", "parent_region": "", "meta": {"region": "Nauw"}, "assets": [], "summary": "A recurring rumor claims The Artist disappeared into Sorel and later reappeared in Veloria, calm and unchanged, as if he had simply taken a long walk.", "words": 140, "sections": [{"h": "Summary", "t": "A recurring rumor claims The Artist disappeared into Sorel and later reappeared in Veloria, calm and unchanged, as if he had simply taken a long walk."}, {"h": "Myth Text", "t": "They say he vanished south for weeks, past routes most city dwellers refuse to take, and came back carrying fresh paint under his nails but no story in his mouth. Some swear he painted in places where people lose names and direction. Others say he never left at all, and that the tale was invented to explain why he can sit so still.\n\nBelievers point to his silence as proof; skeptics call it theater. Either way, the rumor spread because he returned with the same relaxed rhythm, as if Sorel had not touched him."}, {"h": "Notes", "t": "Unverified. Treated as local lore attached to The Artist's public mystique."}], "unresolved": []}, {"id": "myth:the-beak-that-watches-the-road", "slug": "the-beak-that-watches-the-road", "label": "The Beak That Watches the Road", "category": "myth", "status": "myth", "themes": ["cautionary folklore", "obedience discipline", "parent warning"], "path": "myths/the-beak-that-watches-the-road.md", "region": "The Ashen Hearthline", "parent_region": "", "meta": {"region": "The Ashen Hearthline"}, "assets": [], "summary": "A Hearthline warning myth says a giant blue bird marks disobedient wanderers and takes those who leave safe route rhythm.", "words": 94, "sections": [{"h": "Summary", "t": "A Hearthline warning myth says a giant blue bird marks disobedient wanderers and takes those who leave safe route rhythm."}, {"h": "Myth Text", "t": "Parents tell children that the bird does not hunt hunger first; it hunts broken cadence. Those who answer late, stray wide, or mock route calls are said to draw the shadow before the beak. In gentler tellings, the warning is merciful: stay with your people and the sky will pass over you."}, {"h": "Notes", "t": "The myth is widely used as child-safety language in high-risk travel zones."}], "unresolved": []}, {"id": "myth:the-before-i-kneel-oath", "slug": "the-before-i-kneel-oath", "label": "The Before-I-Kneel Oath", "category": "myth", "status": "myth", "themes": ["oath discipline", "threshold ethics", "authority restraint"], "path": "myths/the-before-i-kneel-oath.md", "region": "DEB Gate of Veloria", "parent_region": "", "meta": {"region": "DEB Gate of Veloria"}, "assets": [], "summary": "A gate myth says the strongest wardens swear one line before dawn duty: \"Before I kneel to rank, I kneel to the law we promised the city.\"", "words": 138, "sections": [{"h": "Summary", "t": "A gate myth says the strongest wardens swear one line before dawn duty: *\"Before I kneel to rank, I kneel to the law we promised the city.\"*"}, {"h": "Myth Text", "t": "Some versions place the line in Havren Pike's mouth; others claim it predates him by generations. The scene is consistent: a recruit is ordered to enforce a command that flatters power but violates protocol. The recruit refuses, expecting exile. Instead, an elder warden marks the refusal as the first true pass of gate service.\n\nThe tale does not celebrate rebellion for its own sake. Its lesson is narrower and harder: gate authority is legitimate only when it can refuse corruption even under pressure from higher voices."}, {"h": "Notes", "t": "Often cited in DEB training disputes when officers argue whether a strict order is lawful or merely convenient."}], "unresolved": []}, {"id": "myth:the-bell-that-rings-twice-differently", "slug": "the-bell-that-rings-twice-differently", "label": "The Bell That Rings Twice Differently", "category": "myth", "status": "myth", "themes": ["recurrence", "difference", "humility"], "path": "myths/the-bell-that-rings-twice-differently.md", "region": "F120 (frequency realm)", "parent_region": "", "meta": {"region": "F120 (frequency realm)"}, "assets": [], "summary": "A foundational F120 tale says a bell at the center of the Returning Span rings twice each dawn: once to remind people what returns, and once to remind them it never returns unchanged.", "words": 95, "sections": [{"h": "Summary", "t": "A foundational F120 tale says a bell at the center of the Returning Span rings twice each dawn: once to remind people what returns, and once to remind them it never returns unchanged."}, {"h": "Myth Text", "t": "When apprentices ask why logs need difference marks, elders point to the bell myth. The first strike is familiar enough to comfort; the second is altered enough to demand attention. Those who ignore either note walk confidently into avoidable mistakes."}, {"h": "Notes", "t": "Frequently used as a teaching story in route training and memory ethics."}], "unresolved": []}, {"id": "myth:the-canopy-truce-of-seven-paths", "slug": "the-canopy-truce-of-seven-paths", "label": "The Canopy Truce of Seven Paths", "category": "myth", "status": "myth", "themes": ["mediation", "path law", "tribal balance"], "path": "myths/the-canopy-truce-of-seven-paths.md", "region": "Aelwyn Canopy", "parent_region": "", "meta": {"region": "Aelwyn Canopy"}, "assets": [], "summary": "An Aelwyn myth says Oryn ended a multi-tribe corridor feud by binding seven path oaths in one night.", "words": 81, "sections": [{"h": "Summary", "t": "An Aelwyn myth says Oryn ended a multi-tribe corridor feud by binding seven path oaths in one night."}, {"h": "Myth Text", "t": "The tale claims Oryn walked each disputed route before moonfall, hearing every side without ruling.  \nAt dawn he marked seven boundaries and made each elder swear protection of all seven, not just their own.\n\nFrom then on, \"seven paths\" became shorthand for peace that survives ownership disputes."}, {"h": "Notes", "t": "Commonly retold during boundary review gatherings."}], "unresolved": []}, {"id": "myth:the-carrying-wings-of-nauw", "slug": "the-carrying-wings-of-nauw", "label": "The Carrying Wings of Nauw", "category": "myth", "status": "rumor", "themes": ["forced passage", "sky-borne abduction", "seasonal fear", "rumor and warning"], "path": "myths/the-carrying-wings-of-nauw.md", "region": "Nauw", "parent_region": "", "meta": {"region": "Nauw"}, "assets": [], "summary": "The Carrying Wings of Nauw", "words": 193, "sections": [{"h": "Name", "t": "The Carrying Wings of Nauw"}, {"h": "Summary", "t": "A widely repeated rumor claims that during Mega Butterfly migration, certain inhabitants are seized, lifted into the sky, and carried across the region before being dropped far from home."}, {"h": "Myth Text", "t": "People say the largest Mega Butterflies do not choose targets at random. According to the rumor, those taken are usually travelers standing alone on roads between the western coast and the eastern fields when the migration passes overhead.\n\nIn one version, a person lifted near Averra Isle may be found days later in Glasswater Fields, alive but disoriented, unable to explain the journey except for wind, wing-shadow, and long silence above the land.\n\nSome storytellers frame the carrying as punishment for disrespecting migration season. Others insist it is neither cruel nor kind, only instinct: the butterfly treating a human as stray weight caught in its route.\n\nNo complete record verifies these stories, but the tale persists strongly enough that many households issue migration-season warnings to avoid open roads when giant wings are sighted."}, {"h": "Notes", "t": "The rumor is often told alongside depictions of Mega Butterfly migration, including *Between Two Places*."}], "unresolved": []}, {"id": "myth:the-census-echoes-of-the-prime-mark", "slug": "the-census-echoes-of-the-prime-mark", "label": "The Census Echoes of the Prime Mark", "category": "myth", "status": "myth", "themes": ["cosmology", "pre-Fracture order", "incomplete knowledge", "numbering reality", "world bigness"], "path": "myths/the-census-echoes-of-the-prime-mark.md", "region": "Dias", "parent_region": "", "meta": {"region": "Dias"}, "assets": [], "summary": "A Dias-spanning scholastic folktale claims the Prime Realm once kept a single running tally of all vibrational states\u2014an impossible catalog of how reality\u2019s harmonics could co-exist in one body. The tale is about physics-of-being, not the counting of people...", "words": 324, "sections": [{"h": "Summary", "t": "A Dias-spanning scholastic folktale claims the **Prime Realm** once kept a **single running tally** of all vibrational states\u2014an impossible catalog of how **reality\u2019s harmonics** could co-exist in one body. The tale is about **physics-of-being**, not the counting of people as property. The Fracture, in this version, is not only a break; it is **a scattered remainder** of that tally: \u201cechoes of the mark\u201d that survive as **Prime Relics**, half-legible notations, and the modern habit of naming frequency bands with numbers."}, {"h": "Myth Text", "t": "They say a circle of arithmeticians and architects\u2014sometimes called the **Census Ward**, sometimes only **the Tally**\u2014inscribed a master column into the base of the Prime Bridge (or the bridge\u2019s conceptual twin). Every band of existence had a mark; every mark had a place in the column. When the realm was whole, the column was **quiet**, because the world agreed with its own count.\n\nThe Fracture did not erase the numbers; it **pulled the column through itself**, like silk through a tear. The numbers reappeared as **echoes**\u2014strange marks on old stones, **harmonic designations** that feel older than the cultures that use them, even **restless, list-making dreams** in scholars who get too near certain relic sites\u2014**dreams of order**, not of dominion.\n\nA softer ending claims the Tally is still completing itself across the Present Age, which is why new frequencies (and new names) can surface without anyone feeling the world has *ended* its expansion\u2014only that it has been **re-balancing a sum**."}, {"h": "Notes", "t": "Connects the **number-coded frequency bands** (F200, F432, F500) to a **mythic Prime bookkeeping of resonance** without locking canon to a single true mechanism, and without implying any in-world policy toward **unfree labor**\u2014the Tally, where it is believed, concerns **vibration and category**, not persons as goods. Pairs with **Partial Harmonic Index fragment** as a low-grade \u201cevidence\u201d tradition without confirming the folktale as fact."}], "unresolved": []}, {"id": "myth:the-circle-step-accord", "slug": "the-circle-step-accord", "label": "The Circle Step Accord", "category": "myth", "status": "myth", "themes": ["embodied diplomacy", "social trust", "unity in difference"], "path": "myths/the-circle-step-accord.md", "region": "Velorian Basin", "parent_region": "", "meta": {"region": "Velorian Basin"}, "assets": [], "summary": "A Basin myth says the first stable truce between rival crews was achieved not by signatures, but by a shared stepping pattern that forced each side to move with the other's weight.", "words": 143, "sections": [{"h": "Summary", "t": "A Basin myth says the first stable truce between rival crews was achieved not by signatures, but by a shared stepping pattern that forced each side to move with the other's weight."}, {"h": "Myth Text", "t": "Versions differ on names and decade, but the core image remains: two opponents entered a marked circle and were told to keep motion continuous until neither could force the other off rhythm. What began as a humiliation ritual became a revelation. Breath synchronized. Pace softened. Pride thinned.\n\nWhen they finally spoke terms, neither side asked for total victory. They asked for workable recurrence: routes, rest, and repair obligations both could sustain.\n\nThe phrase \"as one\" later entered Basin speech for agreements tested in lived coordination, not only in legal wording."}, {"h": "Notes", "t": "Modern civic circles cite this myth when training mixed-race crews for high-pressure mediation."}], "unresolved": []}, {"id": "myth:the-curator-and-the-bull", "slug": "the-curator-and-the-bull", "label": "The Curator and the Bull", "category": "myth", "status": "myth", "themes": ["performative courage", "beauty in danger", "crowd magnetism"], "path": "myths/the-curator-and-the-bull.md", "region": "The Sketchy Gallery", "parent_region": "", "meta": {"region": "The Sketchy Gallery"}, "assets": [], "summary": "A gallery myth claims Zephan once staged a live contest with a bull to prove that art must carry real risk.", "words": 87, "sections": [{"h": "Summary", "t": "A gallery myth claims Zephan once staged a live contest with a bull to prove that art must carry real risk."}, {"h": "Myth Text", "t": "The story says Zephan entered the floor unarmored, turning each movement into choreography rather than combat.  \nBy the end, neither fighter fell, and the audience left convinced they had witnessed both performance and trial.\n\nSince then, \"the curator and the bull\" has meant beauty that refuses safety."}, {"h": "Notes", "t": "Often retold during major exhibition openings at The Sketchy Gallery."}], "unresolved": []}, {"id": "myth:the-day-the-rain-learned-names", "slug": "the-day-the-rain-learned-names", "label": "The Day the Rain Learned Names", "category": "myth", "status": "myth", "themes": ["emotional weather", "recognition", "communal memory"], "path": "myths/the-day-the-rain-learned-names.md", "region": "F380 (frequency realm)", "parent_region": "", "meta": {"region": "F380 (frequency realm)"}, "assets": [], "summary": "An F380 myth claims there was one season when the rain fell neutrally until people began speaking one another's names with care, after which the estuary currents stabilized.", "words": 77, "sections": [{"h": "Summary", "t": "An F380 myth claims there was one season when the rain fell neutrally until people began speaking one another's names with care, after which the estuary currents stabilized."}, {"h": "Myth Text", "t": "The story's point is relational, not meteorological: unnamed crowds produced turbulence, while recognized persons produced steadier flow. Whether literal or symbolic, the tale is cited whenever communities need to rebuild trust."}, {"h": "Notes", "t": "Commonly invoked by Tideheart facilitators during convergence rituals."}], "unresolved": []}, {"id": "myth:the-distant-companies", "slug": "the-distant-companies", "label": "The Distant Companies", "category": "myth", "status": "rumor", "themes": ["cross-frequency war", "rumor", "partial knowledge", "power beyond the chart"], "path": "myths/the-distant-companies.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)"}, "assets": [], "summary": "A persistent but unverified F432 story claims that organized parties from the high light of F200 and the abyssal null of F500 have clashed in border-space\u2014not inside F432\u2019s landmass, but in frequency margins that ordinary maps and markets never quite draw....", "words": 315, "sections": [{"h": "Summary", "t": "A persistent but **unverified** F432 story claims that **organized parties** from the high light of **F200** and the abyssal null of **F500** have **clashed in border-space**\u2014not inside F432\u2019s landmass, but in **frequency margins** that ordinary maps and markets never quite draw. Most versions call these groups **\u201ccompanies\u201d** in the old sense: **bodies of people under charter**, supply lines, and banners only half visible to anyone tuned to ordinary soil."}, {"h": "Myth Text", "t": "Sailors say the sea has a second tide you cannot time: a **pressure in the ear** and a **wrong color in the first arc of dawn**, as if morning arrived twice and the second one **lost a fight**. Cartographers in Veloria and dock prophets in the outer rim used to call that weather; younger chroniclers now sometimes link it to **distant lumen-abyss bleed** and whisper about **lumen companies**\u2014lines of **gold-thread riders** and **haloed barges of light**\u2014meeting **void-companies** described as **\u201ccompanies of absence,\u201d** which do not march so much as **unspool** until the horizon **refuses to hold a line**.\n\nNo witness in F432 claims to have watched a full battle. What people claim is the **after-echo**: cold that does not come from water, a **hush in gulls**, and the sense that a quarrel was settled **one frequency over**, leaving F432 to feel **a bruise in the air**.\n\nSkeptics say it is a moral tale dressed as physics: a way to name fear of **unseen powers** without admitting ignorance. Believers say it is the true shape of history\u2014**wars in the spectrum**\u2014while the realm of harvests and ring-cities only catches **leaked noise**."}, {"h": "Notes", "t": "The myth deliberately leaves **\u201ccompanies\u201d** ambiguous: it can be read as **military companies**, **exploration companies**, or **cult/charter bodies** without fixing canon. Future stories may tighten or contradict specific interpretations without breaking the rumor layer."}], "unresolved": []}, {"id": "myth:the-drift-hour-with-no-captain", "slug": "the-drift-hour-with-no-captain", "label": "The Drift Hour with No Captain", "category": "myth", "status": "myth", "themes": ["lawless founding", "consensus without crown", "frontier time", "autonomy"], "path": "myths/the-drift-hour-with-no-captain.md", "region": "Driftfall", "parent_region": "", "meta": {"region": "Driftfall"}, "assets": [], "summary": "A Driftfall founding myth (often told in dock jargon) describes the first hour the eastern territory was allowed to be itself: a stretch of time when no one had rank, and yet a rule appeared anyway\u2014the line later spoken, then written into the territory\u2019s et...", "words": 269, "sections": [{"h": "Summary", "t": "A Driftfall founding myth (often told in dock jargon) describes the **first hour** the eastern territory was allowed to be itself: a stretch of time when **no one had rank**, and yet **a rule appeared anyway**\u2014the line later **spoken, then written** into the territory\u2019s ethos: *Freedom belongs to those who claim it*."}, {"h": "Myth Text", "t": "They say, before the territory had a name, a storm stacked boats like toys along an unfinished shore. Nauw maps called the place \u201ceast Sorel hazard.\u201d Sorel\u2019s ledger called it \"future Hearth overflow.\" The people who stayed did not have permits.\n\nFor one hour\u2014some tellings say measured by a sandglass, others by a bell that never struck\u2014**no captain, no magistrate, no exile-officer** could be found who would accept the chair. A fight almost began over who *would* refuse the chair first.\n\nIn that vacuum, a woman (or a man, or a pair\u2014versions fight) called only **the First Claimant** said aloud: *If no one will steer, we will move anyway.* Crews shoved off not because a law told them, but because **the water answered**.\n\nWhen the hour ended, Driftfall was not built; it was **declared in motion**, which is why Drift\u2019s settlements still behave like they can pick up and leave, even when their houses look permanent.\n\nHearthvale critics call the myth a romance of irresponsibility. Drift residents say it is the opposite: it is a romance of **responsibility you cannot outsource**."}, {"h": "Notes", "t": "Deliberately not tied to a single current leader; it situates \"Free-Captain\" models as *later codifications* of an older void-hour."}], "unresolved": []}, {"id": "myth:the-drifting-face-of-the-dunes", "slug": "the-drifting-face-of-the-dunes", "label": "The Drifting Face of the Dunes", "category": "myth", "status": "myth", "themes": ["shape-shifted form", "desert warning", "sacred secrecy"], "path": "myths/the-drifting-face-of-the-dunes.md", "region": "Lumira Sands", "parent_region": "", "meta": {"region": "Lumira Sands"}, "assets": [], "summary": "A Lumira myth says Iskar's shifting features reflect the desert's refusal to be fully known.", "words": 87, "sections": [{"h": "Summary", "t": "A Lumira myth says Iskar's shifting features reflect the desert's refusal to be fully known."}, {"h": "Myth Text", "t": "In one telling, Iskar's face never settles because each hidden water line leaves a different mark on him.  \nIn another, the dunes themselves rearrange his form to keep outsiders from reading the true map.\n\nEither way, locals repeat that to follow Iskar safely, one must listen to law before looking for shape."}, {"h": "Notes", "t": "Frequently used to justify oasis secrecy and restricted route sharing."}], "unresolved": []}, {"id": "myth:the-familiar-regent-who-may-not-be-one", "slug": "the-familiar-regent-who-may-not-be-one", "label": "The Familiar Regent Who May Not Be One", "category": "myth", "status": "myth", "themes": ["hidden governance", "uncertain identity", "public illusion"], "path": "myths/the-familiar-regent-who-may-not-be-one.md", "region": "Veloria City", "parent_region": "", "meta": {"region": "Veloria City"}, "assets": [], "summary": "This Veloria myth claims that \"Oriven Tal\" may be more role than person.", "words": 118, "sections": [{"h": "Summary", "t": "This Veloria myth claims that \"Oriven Tal\" may be more role than person."}, {"h": "Myth Text", "t": "The tale says no one sees Oriven often enough to prove continuity. Each rare appearance is close enough to be accepted, yet distant enough to preserve doubt.  \nIn some versions, Oriven is a single hidden strategist. In others, the name is a mantle carried by multiple operators to preserve seamless governance and prevent panic.\n\nThe myth endures because the city keeps running, whether or not anyone can point to one permanent face behind the title."}, {"h": "Notes", "t": "The story is often invoked when discussing why Vailor Quentin is said to treat Oriven with unusual caution."}], "unresolved": []}, {"id": "myth:the-flag-that-never-docked", "slug": "the-flag-that-never-docked", "label": "The Flag That Never Docked", "category": "myth", "status": "myth", "themes": ["moving command", "anti-authority", "perpetual motion"], "path": "myths/the-flag-that-never-docked.md", "region": "Driftfall", "parent_region": "", "meta": {"region": "Driftfall"}, "assets": [], "summary": "A Driftfall myth says Vexra's flag was never meant to rest at any port.", "words": 76, "sections": [{"h": "Summary", "t": "A Driftfall myth says Vexra's flag was never meant to rest at any port."}, {"h": "Myth Text", "t": "In the tale, each harbor that tried to claim Vexra's allegiance woke to empty moorings and a vanished crew by sunrise.  \nThe flag reappeared only where conflict and opportunity intersected.\n\nTo Driftfall loyalists, this proved that true command belongs to movement, not territory."}, {"h": "Notes", "t": "Frequently cited as ideological justification for Vexra's fluid coalition model."}], "unresolved": []}, {"id": "myth:the-fracture-was-betrayal", "slug": "the-fracture-was-betrayal", "label": "The Fracture Was Betrayal", "category": "myth", "status": "myth", "themes": ["war", "broken oath", "tragedy", "blame"], "path": "myths/the-fracture-was-betrayal.md", "region": "Dias", "parent_region": "", "meta": {"region": "Dias"}, "assets": [], "summary": "In some Frequency-spanning tales, the Prime Realm was shattered by conflict: a betrayal or war that struck at the foundations of reality itself.", "words": 133, "sections": [{"h": "Summary", "t": "In some Frequency-spanning tales, the Prime Realm was shattered by conflict: a betrayal or war that struck at the foundations of reality itself."}, {"h": "Myth Text", "t": "They say the Prime Realm had guardians, keepers of balance who tended the laws like a garden. And they say there were others who wanted more\u2014more power, more reach, more worlds than one. The war was not fought with spears or fire but with principles: a clause rewritten, a law inverted, an oath snapped in half. The Prime Bridge cracked first, like a bone under strain. Then the Prime Realm split into Frequencies, each holding a piece of the argument that could no longer be resolved in one world."}, {"h": "Notes", "t": "Common in cultures that frame the Fracture as moral history rather than physics."}], "unresolved": []}, {"id": "myth:the-fracture-was-engineered", "slug": "the-fracture-was-engineered", "label": "The Fracture Was Engineered", "category": "myth", "status": "myth", "themes": ["forbidden knowledge", "hubris", "lost civilization"], "path": "myths/the-fracture-was-engineered.md", "region": "Dias", "parent_region": "", "meta": {"region": "Dias"}, "assets": [], "summary": "Some traditions insist the Fracture was the consequence of a forgotten civilization experimenting with reality\u2014testing the Prime Realm until it split.", "words": 128, "sections": [{"h": "Summary", "t": "Some traditions insist the Fracture was the consequence of a forgotten civilization experimenting with reality\u2014testing the Prime Realm until it split."}, {"h": "Myth Text", "t": "They tell of a people who could hear the seams of the world. In hidden halls they built instruments to pluck at existence, to tune gravity, to lean time forward and back. The Prime Bridge, in these stories, was not a stabilizer but a control rod\u2014an attempt to hold the Prime Realm steady while they pushed it past what it was meant to bear. When the final experiment began, the world did not collapse. It differentiated. It became Frequencies, and the engineers were scattered into their own mistake."}, {"h": "Notes", "t": "Often invoked when Prime Relics behave \u201ctoo intentionally\u201d to be natural."}], "unresolved": []}, {"id": "myth:the-fracture-was-natural", "slug": "the-fracture-was-natural", "label": "The Fracture Was Natural", "category": "myth", "status": "myth", "themes": ["cosmic cycles", "acceptance", "inevitability"], "path": "myths/the-fracture-was-natural.md", "region": "Dias", "parent_region": "", "meta": {"region": "Dias"}, "assets": [], "summary": "A widely repeated explanation claims the Prime Realm did not break by hand or war, but by nature\u2014reality reaching a limit and shedding itself into Frequencies the way a living thing molts.", "words": 117, "sections": [{"h": "Summary", "t": "A widely repeated explanation claims the Prime Realm did not break by hand or war, but by nature\u2014reality reaching a limit and shedding itself into Frequencies the way a living thing molts."}, {"h": "Myth Text", "t": "They say the Prime Realm was too perfect to remain singular. Harmony, held too long, becomes tension; balance becomes a taut string. In the last days of the Prime Age, the world began to hum\u2014soft at first, then louder\u2014until the resonance had nowhere left to go. The Fracture was not a wound but a release: reality splitting into new tones so it could continue to sing."}, {"h": "Notes", "t": "Often used to argue against attempts to \u201crestore\u201d the Prime Realm."}], "unresolved": []}, {"id": "myth:the-fracture-was-over-resonance", "slug": "the-fracture-was-over-resonance", "label": "The Fracture Was Over-Resonance", "category": "myth", "status": "myth", "themes": ["resonance limit", "transformation", "thresholds"], "path": "myths/the-fracture-was-over-resonance.md", "region": "Dias", "parent_region": "", "meta": {"region": "Dias"}, "assets": [], "summary": "This explanation claims the Prime Realm did not break from outside pressure but from within\u2014its resonance intensifying beyond what a single reality could hold.", "words": 114, "sections": [{"h": "Summary", "t": "This explanation claims the Prime Realm did not break from outside pressure but from within\u2014its resonance intensifying beyond what a single reality could hold."}, {"h": "Myth Text", "t": "They say the Prime Realm learned itself too well. Every thought, every footstep, every birth and death added to the hum until the world\u2019s tone rose higher than its own container. Not a disaster\u2014an awakening. At the peak, the Prime Realm exceeded its limit and became many: Frequencies born as harmonics, each a clean note cast off from the original sound."}, {"h": "Notes", "t": "Often paired with the belief that the Prime Realm could return if the Frequencies ever fall back into one shared harmony."}], "unresolved": []}, {"id": "myth:the-fruit-walker-at-your-door", "slug": "the-fruit-walker-at-your-door", "label": "The Fruit Walker at Your Door", "category": "myth", "status": "myth", "themes": ["doorstep omen", "gift with meaning", "uncertain reality", "wandering elder"], "path": "myths/the-fruit-walker-at-your-door.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)"}, "assets": [], "summary": "A widespread F432 tale claims that when the Fruit Walker appears at your home, the visit signals a non-ordinary turning point, and the Lucky Fruit he offers carries meaning meant specifically for that household.", "words": 178, "sections": [{"h": "Summary", "t": "A widespread F432 tale claims that when the Fruit Walker appears at your home, the visit signals a non-ordinary turning point, and the Lucky Fruit he offers carries meaning meant specifically for that household."}, {"h": "Myth Text", "t": "They say you do not summon him. You only hear him when he is already there: basket straps creaking, fruit settling into itself, an old man waiting without hurry.\n\nSome homes receive him at dusk, others before sunrise, and no calendar predicts the knock. Families who believe the story say his visits happen most in Wabet and Nauw, and only rarely in Sorel.\n\nHe does not explain why he chose a door. He simply offers fruit, often the kind people call Lucky, and leaves the meaning behind for the household to discover in its own time.\n\nSkeptics call it market folklore attached to ordinary traders. Believers call it warning, blessing, or both."}, {"h": "Notes", "t": "No consensus verifies whether the Fruit Walker is a single person, many people folded into one story, or a fully legendary figure."}], "unresolved": []}, {"id": "myth:the-gallery-that-finishes-itself", "slug": "the-gallery-that-finishes-itself", "label": "The Gallery That Finishes Itself", "category": "myth", "status": "myth", "themes": ["participatory art", "long attention", "silent collaboration"], "path": "myths/the-gallery-that-finishes-itself.md", "region": "The Sketchy Gallery", "parent_region": "", "meta": {"region": "The Sketchy Gallery"}, "assets": [], "summary": "A gallery myth claims certain works remain incomplete until they are watched long enough by silent residents.", "words": 87, "sections": [{"h": "Summary", "t": "A gallery myth claims certain works remain incomplete until they are watched long enough by silent residents."}, {"h": "Myth Text", "t": "Curators deny literal paint changes in public statements, but night staff tell softer stories: that a line settles cleaner, a shade deepens, or a missing shape appears only after sustained, wordless attention. The Exhibition Residents are said to \"lend completion\" by staying where others pass too quickly."}, {"h": "Notes", "t": "Retold during opening cycles to encourage slower viewing practice and reduce novelty-driven crowd churn."}], "unresolved": []}, {"id": "myth:the-gel-helm-that-never-cracked", "slug": "the-gel-helm-that-never-cracked", "label": "The Gel Helm That Never Cracked", "category": "myth", "status": "myth", "themes": ["survival mark", "flood season", "impossible resilience"], "path": "myths/the-gel-helm-that-never-cracked.md", "region": "Brindle March", "parent_region": "", "meta": {"region": "Brindle March"}, "assets": [], "summary": "A Brindle myth explains Bren Holloway's cube-bound head as a survival seal from flood-era collapse.", "words": 96, "sections": [{"h": "Summary", "t": "A Brindle myth explains Bren Holloway's cube-bound head as a survival seal from flood-era collapse."}, {"h": "Myth Text", "t": "The tale says a bridge tower failed above Bren during flood season and a reactive gel casing formed around his head before impact could kill him.  \nWhen floodwater fell, the casing remained, clear and unbroken, and Bren resumed command the same day.\n\nTo march crews, \"never cracked\" became a phrase for leadership that does not fracture under strain."}, {"h": "Notes", "t": "Versions differ on whether the gel is engineered residue, unknown substance, or omen."}], "unresolved": []}, {"id": "myth:the-glasswater-mirror-lull", "slug": "the-glasswater-mirror-lull", "label": "The Glasswater Mirror Lull", "category": "myth", "status": "myth", "themes": ["agriculture", "sky vigilance", "food security", "collective hush", "mirror water", "bigness of bread"], "path": "myths/the-glasswater-mirror-lull.md", "region": "Glasswater Fields", "parent_region": "", "meta": {"region": "Glasswater Fields"}, "assets": [], "summary": "A Glasswater legend holds that the great mirror dams in the region\u2019s south do more than store water: on certain still nights, they store a hush\u2014a lull that passes outward along rivers until Veloria\u2019s bells and Brindle\u2019s wheels all agree to a softer tempo, b...", "words": 223, "sections": [{"h": "Summary", "t": "A Glasswater legend holds that the **great mirror dams** in the region\u2019s south do more than store water: on certain still nights, they **store a hush**\u2014a lull that passes outward along rivers until **Veloria\u2019s bells** and **Brindle\u2019s wheels** all agree to a softer tempo, because the **fields asked for** it."}, {"h": "Myth Text", "t": "Farmers in Glasswater will tell you: bread has a body, and the body needs sleep, even if the world does not. When the **glass-bright** waters lie without ripple, the tale says, the **Mirror Lull** is active\u2014an agreement between the dams and the sky-watch routines that the **soil is listening**.\n\nSome versions go larger: the lull is a **rehearsal** for catastrophe, a practice stillness that trains the community to keep grain moving when a real threat arrives. Other versions are gentler: the lull is **gratitude** made atmospheric\u2014when the water reflects the stars perfectly, the region remembers how much **depends** on a single unbroken season.\n\nNauw city dwellers, hearing this, either mock it or travel east to test it, coming home with half-smiles, claiming they felt nothing\u2014and then speaking more quietly for a week."}, {"h": "Notes", "t": "Ties the region\u2019s **dam-sky watch** culture to **mythic world-scale** responsibility (food for Veloria, routes through Brindle) without duplicating the **Sky-Raid** myth; this is **tonal** and **seasonal**, not a raid narrative."}], "unresolved": []}, {"id": "myth:the-golden-tears-of-averra", "slug": "the-golden-tears-of-averra", "label": "The Golden Tears of Averra", "category": "myth", "status": "myth", "themes": ["prophetic grief", "hidden truth", "memory fracture"], "path": "myths/the-golden-tears-of-averra.md", "region": "Averra Isle", "parent_region": "", "meta": {"region": "Averra Isle"}, "assets": [], "summary": "An Averra myth says Sael's golden tears appear when knowledge is about to vanish.", "words": 84, "sections": [{"h": "Summary", "t": "An Averra myth says Sael's golden tears appear when knowledge is about to vanish."}, {"h": "Myth Text", "t": "The story claims Sael weeps gold only at moments where memory fractures widen and important truth risks being erased.  \nCloister keepers then seal archives, move artifacts, or alter access before outside hands arrive.\n\nFor believers, each tear is warning; for critics, each tear is performance used to justify concealment."}, {"h": "Notes", "t": "Often cited in arguments over whether Sael preserves truth or curates power."}], "unresolved": []}, {"id": "myth:the-kiln-fires-of-second-beginning", "slug": "the-kiln-fires-of-second-beginning", "label": "The Kiln Fires of Second Beginning", "category": "myth", "status": "myth", "themes": ["rebirth", "labor oath", "communal restoration"], "path": "myths/the-kiln-fires-of-second-beginning.md", "region": "Hearthvale", "parent_region": "", "meta": {"region": "Hearthvale"}, "assets": [], "summary": "A Hearthvale myth says Alwen lit the first rebuilding kilns with wood gathered by former enemies.", "words": 79, "sections": [{"h": "Summary", "t": "A Hearthvale myth says Alwen lit the first rebuilding kilns with wood gathered by former enemies."}, {"h": "Myth Text", "t": "The story claims Alwen refused to assign blame and instead required every faction to carry fuel to a common fire.  \nFrom those kilns came the first shared tools and stove-brick lines of stable settlement life.\n\nIn Hearthvale speech, \"keeping kiln fire\" means choosing reconstruction over revenge."}, {"h": "Notes", "t": "Retold during work-season openings and re-entry vows."}], "unresolved": []}, {"id": "myth:the-last-line-never-drawn", "slug": "the-last-line-never-drawn", "label": "The Last Line Never Drawn", "category": "myth", "status": "myth", "themes": ["anti-perfection", "humility", "living craft", "warning tale"], "path": "myths/the-last-line-never-drawn.md", "region": "F960 (frequency realm)", "parent_region": "", "meta": {"region": "F960 (frequency realm)", "culture": "The Open Hand of Making"}, "assets": [], "summary": "A core F960 myth says every maker who attempts to force a final, unquestionable line onto living form loses the work, while those who leave room for revision keep it alive.", "words": 139, "sections": [{"h": "Summary", "t": "A core F960 myth says every maker who attempts to force a final, unquestionable line onto living form loses the work, while those who leave room for revision keep it alive."}, {"h": "Myth Text", "t": "They tell of a master cartographer who swore to draw the one true border of The Unfinished and seal it forever. For seven days the lines held. On the eighth, the ink hardened, cracked, and lifted from the page like dry bark.\n\nIn the same season, a junior apprentice drew a weaker map with notes, alternatives, and empty margins. That map survived storms, arguments, and generations.\n\nThe elders say the lesson is simple: a last line can close a page, but it can also close a future."}, {"h": "Notes", "t": "Often cited in disputes about governance, planning, and identity in F960-influenced communities."}], "unresolved": []}, {"id": "myth:the-long-gate-argument", "slug": "the-long-gate-argument", "label": "The Long Gate Argument", "category": "myth", "status": "myth", "themes": ["borders", "exile infrastructure", "negotiation", "shared blame", "crossing"], "path": "myths/the-long-gate-argument.md", "region": "Sorel", "parent_region": "", "meta": {"region": "Sorel"}, "assets": [], "summary": "A Nauw\u2013Sorel tale describes the long southern crossing into Hearthvale not as a simple construction project, but as a protracted public argument with weight\u2014negotiated between people who would later blame each other for the same bridge. It is as much a stor...", "words": 268, "sections": [{"h": "Summary", "t": "A Nauw\u2013Sorel tale describes the long southern crossing into Hearthvale not as a simple construction project, but as a protracted public argument with weight\u2014negotiated between people who would later blame each other for the same bridge. It is as much a story about **who may say \u201cyes\u201d to open exile routes** as it is about stone and piers."}, {"h": "Myth Text", "t": "They say the first plan was only a line on sand: a span from a Nauw south road to a Sorel bluff, straight as pride. The second plan was a dogleg, because a Velorian surveyor swore a straight line would \"tear luck.\" The third was wider, the fourth was narrower, the fifth included a rest island nobody could afford.\n\nEach revision held a different fear: that southern routes would **overfill** Nauw markets, that Sorel would send back plagues of opinion, that the Hearth would become a second capital, that it would not become a capital at all and therefore fail the hungry.\n\nWhen the piers finally stood, neither side had won the story. Nauw called it a charity of commerce. Sorel called it a **gilded constraint** in polite clothing. Hearthvale\u2014still half-settlement\u2014called it a promise that could be walked.\n\nTravelers on Brindle March still repeat: **the long gate is not a door; it is a threshold you walk while the scribes of two lands draw the same line once, finally, together.**"}, {"h": "Notes", "t": "Coordinates with practical geography: the great bridge is the main Nauw-to-northern-Sorel path through Hearthvale. The myth is **moral** more than **historical**; dates and names in local retellings do not always align."}], "unresolved": []}, {"id": "myth:the-mask-kept-after-exile", "slug": "the-mask-kept-after-exile", "label": "The Mask Kept After Exile", "category": "myth", "status": "myth", "themes": ["identity erasure", "rebirth", "exile authority"], "path": "myths/the-mask-kept-after-exile.md", "region": "Sorel", "parent_region": "", "meta": {"region": "Sorel"}, "assets": [], "summary": "This Sorel myth says Carrow Vale's true face vanished from memory the day exile became destiny.", "words": 96, "sections": [{"h": "Summary", "t": "This Sorel myth says Carrow Vale's true face vanished from memory the day exile became destiny."}, {"h": "Myth Text", "t": "The telling says Carrow walked out of northern judgment, placed a mask over the old name, and never removed it again.  \nThose who claim to have seen beneath it never agree on what they saw: a scarred survivor, a stranger, or no face at all.\n\nIn Sorel speech, \"to keep the mask\" now means refusing return to a former life."}, {"h": "Notes", "t": "Repeated by both Hearthvale and Driftfall circles with different moral framing."}], "unresolved": []}, {"id": "myth:the-minute-of-true-faces", "slug": "the-minute-of-true-faces", "label": "The Minute of True Faces", "category": "myth", "status": "myth", "themes": ["revelation", "fleeting truth", "witness burden"], "path": "myths/the-minute-of-true-faces.md", "region": "F610 (frequency realm)", "parent_region": "", "meta": {"region": "F610 (frequency realm)"}, "assets": [], "summary": "A persistent F610 myth says each cycle contains one minute when all reflective surfaces show not appearance, but structural truth.", "words": 70, "sections": [{"h": "Summary", "t": "A persistent F610 myth says each cycle contains one minute when all reflective surfaces show not appearance, but structural truth."}, {"h": "Myth Text", "t": "Versions differ on what \"true face\" means: intention, history, or hidden fracture lines. The warning is consistent: clarity without preparation can harm as easily as it can heal."}, {"h": "Notes", "t": "Used to justify both rigorous recording discipline and careful release of reveal-phase findings."}], "unresolved": []}, {"id": "myth:the-moon-market-walk", "slug": "the-moon-market-walk", "label": "The Moon-Market Walk", "category": "myth", "status": "myth", "themes": ["night gathering", "social peace", "informal authority"], "path": "myths/the-moon-market-walk.md", "region": "Velorian Basin", "parent_region": "", "meta": {"region": "Velorian Basin"}, "assets": [], "summary": "A basin myth says Tamsin can calm a market district simply by walking its full length at night.", "words": 99, "sections": [{"h": "Summary", "t": "A basin myth says Tamsin can calm a market district simply by walking its full length at night."}, {"h": "Myth Text", "t": "The story holds that when tensions rise, Tamsin walks the moonlit lanes without guards, stopping at fires, stalls, and dock corners until voices lower on their own.  \nBy sunrise, fights are deferred, bargains resume, and no one can point to a single order she gave.\n\nWhether literal or idealized, the \"moon-market walk\" became shorthand for soft authority that still produces hard results."}, {"h": "Notes", "t": "Retold most often in districts that favor communal over formal conflict resolution."}], "unresolved": []}, {"id": "myth:the-oath-of-uncut-water", "slug": "the-oath-of-uncut-water", "label": "The Oath of Uncut Water", "category": "myth", "status": "myth", "themes": ["river vow", "restraint", "tribal law"], "path": "myths/the-oath-of-uncut-water.md", "region": "Wabet", "parent_region": "", "meta": {"region": "Wabet"}, "assets": [], "summary": "A Wabet myth says Elyra bound the tribes by swearing no leader would \"cut the river for profit.\"", "words": 93, "sections": [{"h": "Summary", "t": "A Wabet myth says Elyra bound the tribes by swearing no leader would \"cut the river for profit.\""}, {"h": "Myth Text", "t": "According to the tale, Elyra stood where three water paths met and asked each elder to place a hand in current before speaking.  \nShe then declared that any prosperity gained by wounding the water would return as famine in the next cycle.\n\nWhether historical or ceremonial fiction, the phrase \"uncut water\" became a keeper standard in Wabet governance speech."}, {"h": "Notes", "t": "Commonly invoked when rejecting outside extraction proposals."}], "unresolved": []}, {"id": "myth:the-orchard-warden-who-sees-inside-thought", "slug": "the-orchard-warden-who-sees-inside-thought", "label": "The Orchard Warden Who Sees Inside Thought", "category": "myth", "status": "myth", "themes": ["mind-reading rumor", "psychological authority", "uncanny governance"], "path": "myths/the-orchard-warden-who-sees-inside-thought.md", "region": "Verdant Reach", "parent_region": "", "meta": {"region": "Verdant Reach"}, "assets": [], "summary": "A Verdant myth claims Maes Thorn can read intention before speech is formed.", "words": 81, "sections": [{"h": "Summary", "t": "A Verdant myth claims Maes Thorn can read intention before speech is formed."}, {"h": "Myth Text", "t": "The story says disputants arrive prepared to deceive, but abandon their lies after meeting Maes's fixed stare.  \nSome tellings insist she answers unspoken objections before anyone voices them.\n\nWhether ability or intimidation, the myth sustains her reputation as a leader difficult to outmaneuver."}, {"h": "Notes", "t": "Repeated most often by traders who failed to secure exceptions from orchard boundary law."}], "unresolved": []}, {"id": "myth:the-red-sail-crown-of-vailor", "slug": "the-red-sail-crown-of-vailor", "label": "The Red Sail Crown of Vailor", "category": "myth", "status": "myth", "themes": ["contested origin", "authority symbol", "rise to power"], "path": "myths/the-red-sail-crown-of-vailor.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)"}, "assets": [], "summary": "A widespread F432 myth explains how Vailor Quentin acquired the red-sail crown-standard that defines his rule.", "words": 110, "sections": [{"h": "Summary", "t": "A widespread F432 myth explains how Vailor Quentin acquired the red-sail crown-standard that defines his rule."}, {"h": "Myth Text", "t": "One telling says Vailor took the sail by overpowering a Singing Fisherman in the early years of his ascent, making dominance itself the first law of his authority.  \nAnother telling says the same sail was freely gifted to him by maritime elders who believed he alone could hold F432 together.\n\nBecause both versions persist with equal conviction, the emblem remains powerful precisely because its origin cannot be settled."}, {"h": "Notes", "t": "This myth is used by both supporters and critics to justify opposite readings of Vailor's legitimacy."}], "unresolved": []}, {"id": "myth:the-ring-blades-of-the-gate-knight", "slug": "the-ring-blades-of-the-gate-knight", "label": "The Ring Blades of the Gate Knight", "category": "myth", "status": "myth", "themes": ["martial legend", "knight lineage", "gate defense"], "path": "myths/the-ring-blades-of-the-gate-knight.md", "region": "DEB Gate of Veloria", "parent_region": "", "meta": {"region": "DEB Gate of Veloria"}, "assets": [], "summary": "A gate myth says Havren Pike mastered circular blades in Lorien service before taking Veloria's threshold command.", "words": 86, "sections": [{"h": "Summary", "t": "A gate myth says Havren Pike mastered circular blades in Lorien service before taking Veloria's threshold command."}, {"h": "Myth Text", "t": "The tale claims Havren trained where shields failed and only moving rings could break encirclement.  \nWhen transferred to Veloria's gate, he adapted the same forms for crowd control, breach response, and close defense.\n\nIn local saying, \"the rings are turning\" means gate law is active and hesitation is over."}, {"h": "Notes", "t": "Commonly retold by watch rotations before high-volume entry cycles."}], "unresolved": []}, {"id": "myth:the-seven-of-averra-isle", "slug": "the-seven-of-averra-isle", "label": "The Seven of Averra Isle", "category": "myth", "status": "myth", "themes": ["hidden council", "island mystery", "balance and judgment", "lucky fruit influence"], "path": "myths/the-seven-of-averra-isle.md", "region": "Nauw", "parent_region": "", "meta": {"region": "Nauw"}, "assets": [], "summary": "A persistent rumor across Nauw claims seven cloaked figures dwell on Averra Isle, acting as a hidden council that steers mysterious events and preserves a precarious balance between good and evil.", "words": 230, "sections": [{"h": "Summary", "t": "A persistent rumor across Nauw claims seven cloaked figures dwell on Averra Isle, acting as a hidden council that steers mysterious events and preserves a precarious balance between good and evil.\n\nTheir intentions are considered fundamentally unclear: if they exist, they may be benevolent, malevolent, or shifting between both."}, {"h": "Myth Text", "t": "Dock workers whisper that no chart can keep Averra still: lights appear where no houses stand, bells ring in weather too calm for masts, and sometimes seven silhouettes are seen along the cliffs at dusk. In market retellings, these figures are called the Seven of Averra Isle. Some say they decide which fortunes rise and which break. Others say they do less and more than rule: they keep a balance no city council can see, nudging conflict away from collapse.\n\nThe boldest versions extend their reach beyond Nauw itself, claiming the Seven influence rare perfect-form fruits that appear in Wabet, especially in Verdant Reach. Believers call those appearances signs of judgment or favor; skeptics call them coincidence wrapped in fear.\n\nThis ambiguity is central to the myth's survival. Supporters point to unusually fortunate outcomes as evidence of protection, while detractors point to misfortune and disruption as evidence of manipulation."}, {"h": "Notes", "t": "No verified expedition has confirmed the Seven's existence. The myth remains compatible with ongoing uncertainty around Averra Isle and other local lore traditions."}], "unresolved": []}, {"id": "myth:the-sky-raid-memory-of-glasswater-fields", "slug": "the-sky-raid-memory-of-glasswater-fields", "label": "The Sky-Raid Memory of Glasswater Fields", "category": "myth", "status": "myth", "themes": ["inherited vigilance", "sky-borne threat", "communal memory", "night protection"], "path": "myths/the-sky-raid-memory-of-glasswater-fields.md", "region": "Glasswater Fields", "parent_region": "", "meta": {"region": "Glasswater Fields"}, "assets": [], "summary": "A longstanding Glasswater Fields myth says the region's night drifts began after repeated sky-borne raids in earlier ages, and that constant evening watch is the only reason those attacks no longer return.", "words": 212, "sections": [{"h": "Summary", "t": "A longstanding Glasswater Fields myth says the region's night drifts began after repeated sky-borne raids in earlier ages, and that constant evening watch is the only reason those attacks no longer return."}, {"h": "Myth Text", "t": "They say there was a time before the drifting lines, when people slept through first dark and woke to broken roofs, scattered grain, and claw-marks in water towers.\n\nThe raiders were never walkers from the roads. They came from above, winged and sudden, dropping out of cloud-shadow where no gate could stop them. By the time the bells rang, they were already gone.\n\nSo the fields changed their strategy. If danger comes from the sky, then eyes must remain in the sky.\n\nFamilies carried tubes to the southern dams where water mirrors the heavens, and they took turns drifting through the night, reading stars, cloud breaks, and moving silhouettes. Parents taught children the routes, the signals, and the patience. Tubes passed down like heirlooms, not for comfort, but for duty.\n\nNow when evening settles, the drifters go out and the villages sleep. Some call it tradition. Believers call it the watch that keeps the sky honest."}, {"h": "Notes", "t": "The myth preserves memory of unnamed flying attackers; canonical creature classification is intentionally unresolved."}], "unresolved": []}, {"id": "myth:the-split-tide-bloodline", "slug": "the-split-tide-bloodline", "label": "The Split Tide Bloodline", "category": "myth", "status": "myth", "themes": ["inherited anomaly", "fracture remnant", "sea lineage"], "path": "myths/the-split-tide-bloodline.md", "region": "Nauw Outer Rim Seas", "parent_region": "", "meta": {"region": "Nauw Outer Rim Seas"}, "assets": [], "summary": "A maritime myth claims Marek Solon's dual-form body is inherited fracture scarring from an older F432 break.", "words": 89, "sections": [{"h": "Summary", "t": "A maritime myth claims Marek Solon's dual-form body is inherited fracture scarring from an older F432 break."}, {"h": "Myth Text", "t": "Sea-elders say some bloodlines carried resonance damage after early fracture events, and that Marek is the clearest living example.  \nIn this telling, the body appears in two places not by magic trick, but by inherited split-tide memory written into form itself.\n\nThe story persists because Marek's condition has no widely accepted technical explanation."}, {"h": "Notes", "t": "Often cited to support Marek's side mission of documenting pre-fracture remnants."}], "unresolved": []}, {"id": "myth:the-steward-at-the-crossing-tables", "slug": "the-steward-at-the-crossing-tables", "label": "The Steward at the Crossing Tables", "category": "myth", "status": "myth", "themes": ["arbitration", "transit peace", "written oath"], "path": "myths/the-steward-at-the-crossing-tables.md", "region": "Nauw", "parent_region": "", "meta": {"region": "Nauw"}, "assets": [], "summary": "This Nauw myth says Serik Dovant ended a major corridor conflict through one night of forced negotiation.", "words": 100, "sections": [{"h": "Summary", "t": "This Nauw myth says Serik Dovant ended a major corridor conflict through one night of forced negotiation."}, {"h": "Myth Text", "t": "The tale claims Serik locked rival road houses, caravan captains, and basin factors at a set of crossing tables until every line of a route-peace charter was signed.  \nBy dawn, wagons moved again, toll fires were lowered, and food convoys resumed.\n\nWhether literal or not, the phrase \"crossing tables\" now means a hard compromise no side fully likes but all sides must keep."}, {"h": "Notes", "t": "Frequently cited as the origin story of Serik's authority style."}], "unresolved": []}, {"id": "myth:the-still-pool-vigil", "slug": "the-still-pool-vigil", "label": "The Still Pool Vigil", "category": "myth", "status": "myth", "themes": ["vigilance", "calm under threat", "ritual watch"], "path": "myths/the-still-pool-vigil.md", "region": "Glasswater Fields", "parent_region": "", "meta": {"region": "Glasswater Fields"}, "assets": [], "summary": "A Glasswater myth says Leora can detect danger by watching a still pool before anyone else sees the sky change.", "words": 89, "sections": [{"h": "Summary", "t": "A Glasswater myth says Leora can detect danger by watching a still pool before anyone else sees the sky change."}, {"h": "Myth Text", "t": "In the tale, Leora sits at dawn water and reads the first fracture in reflection before cloud, wind, or birds reveal it.  \nWhen she stands, watchers move; when she remains seated, fields continue.\n\nWhether symbolic or literal, the \"still pool vigil\" became a local expression for disciplined calm in high-risk seasons."}, {"h": "Notes", "t": "Most often repeated by night-watch families around southern dam basins."}], "unresolved": []}, {"id": "myth:the-sun-sweet-afternoon", "slug": "the-sun-sweet-afternoon", "label": "The Sun-Sweet Afternoon", "category": "myth", "status": "myth", "themes": ["permission to rest", "seasonal joy", "fruit", "collective kindness", "warmth"], "path": "myths/the-sun-sweet-afternoon.md", "region": "Velorian Basin", "parent_region": "", "meta": {"region": "Velorian Basin"}, "assets": [], "summary": "A gentle Velorian Basin custom\u2014half myth, half weather habit\u2014says the first truly warm day of the year is Sun-Sweet Afternoon: a time when work is allowed to be lighter, and fruit sellers cut their sun-sweet samples a little larger, on purpose, without call...", "words": 180, "sections": [{"h": "Summary", "t": "A gentle **Velorian Basin** custom\u2014half myth, half weather habit\u2014says the first truly warm day of the year is **Sun-Sweet Afternoon**: a time when **work is allowed to be lighter**, and fruit sellers cut their **sun-sweet** samples a little larger, on purpose, without calling it charity."}, {"h": "Myth Text", "t": "The story is not a miracle. It is a **permission** passed down: when the haze thins and the light turns honey-thick, you may walk slower. Apprentices are teased, not punished, for dawdling. Some guildhouses even ring a **single bell** not for work, but for *pause*.\n\nChildren are told: the heat is a guest; greet it with **water, shade, and a shared orange**. Lovers and friends repeat the line every year, sometimes laughing at how small it is\u2014and still doing it.\n\nIn the most romantic tellings, the **basin** itself exhales, and the city rings remember they were built for **people** first."}, {"h": "Notes", "t": "Intentionally **low-stakes, high-joy**\u2014a relief valve in a region otherwise dense with **trade, rings, and pressure**. Pairs with fruit culture without naming conflict."}], "unresolved": []}, {"id": "myth:the-three-thank-yous-of-brindle", "slug": "the-three-thank-yous-of-brindle", "label": "The Three Thank-Yous of Brindle", "category": "myth", "status": "myth", "themes": ["gratitude", "road culture", "small rites", "safety", "hope"], "path": "myths/the-three-thank-yous-of-brindle.md", "region": "Brindle March", "parent_region": "", "meta": {"region": "Brindle March"}, "assets": [], "summary": "Travelers on Brindle March are taught a small, happy custom: to leave three light thanks for a safe crossing\u2014a knot, a pebble, a word\u2014at way-mark shrines, bridge feet, and fork trees. The practice is not religion so much as public encouragement: proof that...", "words": 195, "sections": [{"h": "Summary", "t": "Travelers on **Brindle March** are taught a small, **happy** custom: to leave **three light thanks** for a safe crossing\u2014**a knot**, **a pebble**, **a word**\u2014at way-mark shrines, bridge feet, and fork trees. The practice is not religion so much as **public encouragement**: proof that the road has been good to someone, and can be good again."}, {"h": "Myth Text", "t": "The first thank-you is for **what held you** (knot: rope, family, a stranger\u2019s hand). The second is for **what let you go** (pebble: dropped weight, a finished fear). The third is for **what comes next** (word: scratched bark, a whisper, a laugh).\n\nNo god is named; the rite is **communal flirting with luck**. Cynics call it trash on the verge. Wardens, mostly, do not clear the knots\u2014they **read them** as a chart of who arrived grateful.\n\nThe **happiest** tellings are simple: a child who could not pay tells the tree **thank you** three times, and a merchant, overhearing, pays their toll forward without drama."}, {"h": "Notes", "t": "Balances road grit with **intentional warmth**. Pairs with **The Long Gate Argument** (heavy myth) as its gentler **travel companion**."}], "unresolved": []}, {"id": "myth:the-two-pillars-witness", "slug": "the-two-pillars-witness", "label": "The Two Pillars Witness", "category": "myth", "status": "myth", "themes": ["public ceremony", "divided meaning", "moral selection"], "path": "myths/the-two-pillars-witness.md", "region": "Averra Isle", "parent_region": "", "meta": {"region": "Averra Isle"}, "assets": [], "summary": "An Averra myth says that on certain ascension nights, two pale pillars rise above the crowd: one face of mercy, one face of refusal, and each watcher sees whichever face matches their hidden intent.", "words": 150, "sections": [{"h": "Summary", "t": "An Averra myth says that on certain ascension nights, two pale pillars rise above the crowd: one face of mercy, one face of refusal, and each watcher sees whichever face matches their hidden intent."}, {"h": "Myth Text", "t": "Older tellings describe no thunder and no miracle fire, only still air and impossible height. The crowd gathers in silence. Two forms appear. One smiles without warmth. One frowns without anger.\n\nWitnesses later disagree on what happened next, but all versions include the same result: private motives surface in public behavior. Those who came seeking spectacle leave quarrelsome. Those who came with repair in mind leave with difficult tasks already chosen.\n\nThe myth's warning is simple: ascension is not escape. It is being seen from above with nowhere left to hide your reason."}, {"h": "Notes", "t": "Often used in Averra and Nauw discourse when debating leadership legitimacy and public ritual theater."}], "unresolved": []}, {"id": "myth:the-wall-that-chooses-liars", "slug": "the-wall-that-chooses-liars", "label": "The Wall That Chooses Liars", "category": "myth", "status": "rumor", "themes": ["moral scrutiny", "fear discipline", "nonverbal judgment"], "path": "myths/the-wall-that-chooses-liars.md", "region": "The Glassfold Ledge", "parent_region": "", "meta": {"region": "The Glassfold Ledge"}, "assets": [], "summary": "A persistent Glassfold rumor says the eye-wall does not follow movement equally; it settles hardest on those speaking false intent.", "words": 104, "sections": [{"h": "Summary", "t": "A persistent Glassfold rumor says the eye-wall does not follow movement equally; it settles hardest on those speaking false intent."}, {"h": "Myth Text", "t": "In market retellings, two travelers may walk the same line while only one feels the full weight of the stare. The reason, people say, is simple and terrifying: the wall does not count footsteps, it counts honesty. Some elders warn against testing it with games, because \"a lie told under many eyes can follow you into the next window.\""}, {"h": "Notes", "t": "Used as informal behavior control in tense crossings, especially before negotiations where motive and wording diverge."}], "unresolved": []}, {"id": "myth:the-warden-of-the-unwasted-hour", "slug": "the-warden-of-the-unwasted-hour", "label": "The Warden of the Unwasted Hour", "category": "myth", "status": "myth", "themes": ["time ritual", "punctuality law", "border discipline"], "path": "myths/the-warden-of-the-unwasted-hour.md", "region": "Green Garden Border Lanes", "parent_region": "", "meta": {"region": "Green Garden Border Lanes"}, "assets": [], "summary": "A border-lane myth says Neris Hale can feel a wasted minute as if it were physical harm.", "words": 92, "sections": [{"h": "Summary", "t": "A border-lane myth says Neris Hale can feel a wasted minute as if it were physical harm."}, {"h": "Myth Text", "t": "In the story, every delay sends a visible tremor through the rows of potted blooms, and Neris resets the lanes before disorder spreads.  \nTravelers who arrive late are not expelled, but placed into corrective pacing rounds until rhythm is restored.\n\nFrom this tale came the saying: \"Do not waste the warden's hour.\""}, {"h": "Notes", "t": "Retold most often by families who make annual ritual stops at the lanes."}], "unresolved": []}, {"id": "myth:the-warden-who-closed-the-reefs", "slug": "the-warden-who-closed-the-reefs", "label": "The Warden Who Closed the Reefs", "category": "myth", "status": "myth", "themes": ["environmental defense", "hard boundary law", "command deterrence"], "path": "myths/the-warden-who-closed-the-reefs.md", "region": "Isle of Calareth", "parent_region": "", "meta": {"region": "Isle of Calareth"}, "assets": [], "summary": "A Calareth myth says Coris Vale shut the island's reef routes in a single decree cycle.", "words": 87, "sections": [{"h": "Summary", "t": "A Calareth myth says Coris Vale shut the island's reef routes in a single decree cycle."}, {"h": "Myth Text", "t": "The tale says smuggler anchors scarred the reef so deeply that Coris declared immediate closure, posting watchers before dawn and seizing boats that ignored warning lines.  \nBy season's end, fish runs recovered and illegal routes dissolved.\n\nIn island speech, \"closing reefs\" now means enforcing a limit before damage becomes permanent."}, {"h": "Notes", "t": "Used by preservation groups as a foundational story of Coris's authority."}], "unresolved": []}, {"id": "myth:the-warmth-that-stayed", "slug": "the-warmth-that-stayed", "label": "The Warmth That Stayed", "category": "myth", "status": "myth", "themes": ["endurance", "care", "continuity after loss"], "path": "myths/the-warmth-that-stayed.md", "region": "F840 (frequency realm)", "parent_region": "", "meta": {"region": "F840 (frequency realm)"}, "assets": [], "summary": "An F840 myth tells of a settlement that lost nearly everything except one ember, which became the first Hearthline station because people chose to guard it together.", "words": 76, "sections": [{"h": "Summary", "t": "An F840 myth tells of a settlement that lost nearly everything except one ember, which became the first Hearthline station because people chose to guard it together."}, {"h": "Myth Text", "t": "The tale says the ember survived not through miracle fuel, but rotation: every household took watch, every traveler added kindling, and every child learned relay duty before ceremonial language."}, {"h": "Notes", "t": "Frequently cited as a cultural origin myth for Ember Keeper stewardship norms."}], "unresolved": []}, {"id": "myth:the-west-that-chose-calm", "slug": "the-west-that-chose-calm", "label": "The West That Chose Calm", "category": "myth", "status": "myth", "themes": ["prehuman quiet", "weather as decision", "purity", "refusal of noise", "world scale"], "path": "myths/the-west-that-chose-calm.md", "region": "Wabet", "parent_region": "", "meta": {"region": "Wabet"}, "assets": [], "summary": "A Wabet-origin cosmology, repeated with variations along the full western map, says the region is not \"empty of noise\" by accident, but by a decision taken once\u2014a weather-like covenant after the Fracture\u2014so the west would remain a place where the world can...", "words": 238, "sections": [{"h": "Summary", "t": "A Wabet-origin cosmology, repeated with variations along the full western map, says the region is not \"empty of noise\" by accident, but by **a decision taken once**\u2014a weather-like covenant after the Fracture\u2014so the west would remain a place where the world can **hear itself think**."}, {"h": "Myth Text", "t": "Before kingdoms, before fruit routes, there was a storm that would not name itself. It roamed the western line of what would later be called F432, tearing trees into signatures and turning rivers into arguments.\n\nThe older tale says a chorus of Wabet **Keepers**\u2014some human, some not, some only remembered as wind-direction\u2014stood at three anchors: **Aelwyn** for the canopy, **Verdant** for the food-heart, **Lumira** for the southern sands. They did not fight the storm; they **asked** it to become something else.\n\nIn the most poetic versions, the storm becomes **a long exhale** that never fully ends, which is why Wabet\u2019s air is clear and the stars feel nearer: not because the land is perfect, but because a loud possibility was **declined in favor of calm**.\n\nSkeptics in Nauw call this a marketing myth for overpriced Wabet produce. Wabet travelers only shrug: **calm, they say, is also a kind of work.**"}, {"h": "Notes", "t": "Does not override ecological description in Wabet\u2019s region entry; it **explains mood** in mythic terms and leaves open whether any literal event occurred. Safe space for later reveal or debunking."}], "unresolved": []}, {"id": "myth:wabet-s-unclaimed-breakfast", "slug": "wabet-s-unclaimed-breakfast", "label": "Wabet's Unclaimed Breakfast", "category": "myth", "status": "myth", "themes": ["gift economy", "hospitality", "travelers", "trust", "gentle magic", "hope"], "path": "myths/wabets-unclaimed-breakfast.md", "region": "Wabet", "parent_region": "", "meta": {"region": "Wabet"}, "assets": [], "summary": "Along certain Wabet farm tracks and Verdant orchard lanes, travelers repeat a tender story: unclaimed breakfast\u2014bread, fruit, tea left under mesh or in clay coolers with only a sign: For whoever is hungry. Pay by passing it on.", "words": 214, "sections": [{"h": "Summary", "t": "Along certain **Wabet** farm tracks and **Verdant** orchard lanes, travelers repeat a tender story: **unclaimed breakfast**\u2014bread, fruit, tea left **under mesh or in clay coolers** with only a sign: *For whoever is hungry. Pay by passing it on.*"}, {"h": "Myth Text", "t": "The tale insists there is no trick. The food is not poisoned, not a test, not a debt-trap. If you are embarrassed to take, you are told: **anonymity is a kind of host**, and the host has already left to work the rows.\n\nNauw traders who visit Wabet sometimes scoff\u2014until they return home and find they miss the feeling: **being trusted without a ledger line**.\n\nThe happiest version adds a line children love: the **Lucky Fruit** that appears in a basket is always shared first; whatever luck it carries is said to **double** when the first cut goes outward.\n\nSkeptics say it is a marketing story to sell Wabet as pure. Believers say purity is a heavy word; what the story really sells is **relief**: the thought that a stranger can be **good on purpose**, once, without theater."}, {"h": "Notes", "t": "Aligns with Wabet as **purity and minimal extraction**; reframes **Lucky Fruits** as **shared** joy rather than private fortune. No dark twist in the default telling."}], "unresolved": []}, {"id": "phenomenon:brindle-march-stillness", "slug": "brindle-march-stillness", "label": "Brindle March stillness", "category": "phenomenon", "status": "canonical", "themes": ["mass pause", "unexplained hush", "trade omen", "road as living thing", "bigness of routine"], "path": "phenomena/brindle-march-stillness.md", "region": "Nauw", "parent_region": "", "meta": {"region": "Nauw"}, "assets": [], "summary": "Brindle March stillness", "words": 294, "sections": [{"h": "Name", "t": "Brindle March stillness"}, {"h": "Overview", "t": "**Brindle March stillness** is the name given in Nauw to rare intervals\u2014minutes to a few hours\u2014when the central road network\u2019s usual **acoustic traffic roar** falls away, leaving animals, wind, and people unusually audible. It is not officially classified as a weather event; it behaves more like a **synchronous pause** across multiple spans and market-adjacent lanes."}, {"h": "Description", "t": "Accounts agree on a **loss of the usual \u201criver\u201d of sound** from carts, hooves, iron, and called-out prices, even in lanes that seem visually busy. Some witnesses insist movement **continues**; others report hesitant slowing, as if an invisible hand had asked an entire region to **take one shared breath**
