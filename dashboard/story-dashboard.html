 is frequently contrasted with F500's null pressure and F200's coherence ideals."}], "unresolved": []}, {"id": "culture:tide-song-custodianship", "slug": "tide-song-custodianship", "label": "Tide-Song Custodianship", "category": "culture", "status": "canonical", "themes": ["maritime stewardship", "ritual memory", "survival ethics"], "path": "cultures/tide-song-custodianship.md", "region": "Nauw Outer Rim Seas", "parent_region": "", "meta": {"region": "Nauw Outer Rim Seas"}, "assets": [], "summary": "Tide-Song Custodianship is the maritime culture that binds subsistence, ritual song, and route memory into a shared survival ethic across Nauw Outer Rim communities.", "words": 117, "sections": [{"h": "Overview", "t": "Tide-Song Custodianship is the maritime culture that binds subsistence, ritual song, and route memory into a shared survival ethic across Nauw Outer Rim communities."}, {"h": "Beliefs and Values", "t": "The culture treats sea knowledge as inherited duty rather than private advantage. Song, migration memory, and catch restraint are understood as linked responsibilities."}, {"h": "Practices and Traditions", "t": "Communities maintain chant-guided route recall, whale-path respect customs, and season-specific pause practices intended to prevent collapse of local marine cycles."}, {"h": "Lore", "t": "The custodianship tradition is often associated with Marek Solon's Tide Warden role and with ongoing attempts to reconcile fracture-linked myth with practical seamanship."}, {"h": "Notes", "t": "Inland observers often misread the culture as purely symbolic, overlooking its practical navigation and risk-management functions."}], "unresolved": []}, {"id": "culture:vel-mark-trade-standard", "slug": "vel-mark-trade-standard", "label": "VEL Mark Trade Standard", "category": "culture", "status": "canonical", "themes": ["trade currency", "regional interoperability", "market trust", "plural economies"], "path": "cultures/vel-mark-trade-standard.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)"}, "assets": [], "summary": "VEL Mark Trade Standard is the dominant currency convention used for most day-to-day and contract-level trade across F432.", "words": 203, "sections": [{"h": "Overview", "t": "VEL Mark Trade Standard is the dominant currency convention used for most day-to-day and contract-level trade across F432."}, {"h": "Beliefs and Values", "t": "Inhabitants across Nauw, Wabet, and Sorel treat VEL Marks as the most practical shared medium for pricing, wages, and routine market settlement. The standard is valued less as ideology and more as a stability tool: one reference unit that reduces friction between regions with different local customs."}, {"h": "Practices and Traditions", "t": "Many settlements and guild circles still maintain local tender forms, vouchers, or exchange customs for neighborhood-scale trade. In practice, however, larger basket pricing, inter-regional cargo accounting, and most civic fee schedules are commonly quoted in VEL.\n\nCommon speech shortens the denomination language to \"vel\" or \"vel marks\" in market conversation."}, {"h": "Lore", "t": "VEL Marks are not the only currency structure in Dias. Beyond F432, some frequencies settle value through non-note systems, including resource-weighted exchange anchored to critical minerals, rare materials, or other strategic goods. Some cross-frequency flows also rely on non-physical settlement channels instead of paper notes.\n\nWithin F432, VEL remains the dominant trusted physical trade standard used by most inhabitants."}, {"h": "Notes", "t": "This entry defines broad usage behavior, not a monopoly claim. Local and cross-frequency variation remains canonical."}], "unresolved": []}, {"id": "culture:velorian-ring-protocol", "slug": "velorian-ring-protocol", "label": "Velorian Ring Protocol", "category": "culture", "status": "canonical", "themes": ["layered authority", "operational discipline", "managed continuity"], "path": "cultures/velorian-ring-protocol.md", "region": "Veloria City", "parent_region": "", "meta": {"region": "Veloria City"}, "assets": [], "summary": "Velorian Ring Protocol is the citywide governance culture that aligns behavior, administration, and response timing across Veloria's concentric structure.", "words": 122, "sections": [{"h": "Overview", "t": "Velorian Ring Protocol is the citywide governance culture that aligns behavior, administration, and response timing across Veloria's concentric structure."}, {"h": "Beliefs and Values", "t": "The protocol prioritizes continuity, predictability, and system coherence over personal discretion. In its strongest form, public calm is treated as proof that governance is functioning."}, {"h": "Practices and Traditions", "t": "Ring-specific procedures, gate threshold sequencing, and controlled disclosure norms are treated as ordinary civic life rather than exceptional rule.\n\nAdministrative language emphasizes compliance timing, role-bound duty, and escalation pathways."}, {"h": "Lore", "t": "The protocol is frequently associated with Oriven Tal's operational model and with Vailor-era expectations that stability must be visibly maintained."}, {"h": "Notes", "t": "External observers often describe the protocol as highly effective but difficult to read from outside institutional channels."}], "unresolved": []}, {"id": "inhabitant:alwen-rusk", "slug": "alwen-rusk", "label": "Alwen Rusk", "category": "inhabitant", "status": "canonical", "themes": ["second chances", "cooperative rebuilding", "restorative leadership"], "path": "inhabitants/alwen-rusk.md", "region": "Hearthvale", "parent_region": "", "meta": {"region": "Hearthvale", "nature": "person"}, "assets": [], "summary": "Alwen Rusk is the Second-Beginning Keeper of Hearthvale.", "words": 102, "sections": [{"h": "Overview", "t": "Alwen Rusk is the Second-Beginning Keeper of Hearthvale."}, {"h": "Description", "t": "F432 race record: **Human**.\n\nOnce denied shelter by several settlements, Alwen became a builder of durable reintegration systems across west Sorel.\n\nHer leadership model centers on shared tools, mutual labor, and social re-entry for those marked as failures elsewhere."}, {"h": "Beliefs About Them", "t": "Hearthvale communities see Alwen as proof that exile does not end a life. Driftfall critics call her system a softer form of control."}, {"h": "Narrative Role", "t": "Alwen represents restorative authority in a region born from rejection."}, {"h": "Notes", "t": "Her practical legitimacy is strongest in cooperative workshop and food-network zones."}], "unresolved": []}, {"id": "inhabitant:andrew-and-russell", "slug": "andrew-and-russell", "label": "Andrew and Russell", "category": "inhabitant", "status": "canonical", "themes": ["companionship", "playful routine", "outskirts life", "everyday joy"], "path": "inhabitants/andrew-and-russell.md", "region": "Velorian Basin", "parent_region": "", "meta": {"region": "Velorian Basin", "nature": "human-animal pair"}, "assets": [], "summary": "Andrew and his dog Russell are a familiar inhabitant pair seen on the outskirts of town in the Velorian Basin, often playing ball in open ground.", "words": 166, "sections": [{"h": "Overview", "t": "Andrew and his dog Russell are a familiar inhabitant pair seen on the outskirts of town in the Velorian Basin, often playing ball in open ground."}, {"h": "Description", "t": "Andrew is commonly described as an easygoing local boy, and Russell as an energetic companion who follows him through basin-side paths and field edges. Their most recognized routine is simple: Andrew throws, Russell runs, and they repeat for long stretches of afternoon and early evening.\n\nThough modest compared to larger basin trade stories, the pair is often remembered as a small but vivid part of local life in Nauw."}, {"h": "Beliefs About Them", "t": "Residents speak of them as a reminder that not every meaningful story in F432 is tied to conflict or myth; some are rooted in ordinary affection and daily play."}, {"h": "Narrative Role", "t": "They represent grounded, human-scale joy within a region otherwise known for movement, exchange, and pressure."}, {"h": "Notes", "t": "Sightings are most often reported in outer basin areas rather than in Veloria's inner city rings."}], "unresolved": []}, {"id": "inhabitant:aurel-kind", "slug": "aurel-kind", "label": "Aurel-kind", "category": "inhabitant", "status": "canonical", "themes": ["energy life", "peace", "coherence", "harmonic form"], "path": "inhabitants/aurel-kind.md", "region": "F200 (frequency realm)", "parent_region": "", "meta": {"region": "F200 (frequency realm)", "nature": "energy being"}, "assets": [], "summary": "Aurel-kind is the common label for the energy-native inhabitants of F200, most often encountered along Aurel Meridian\u2014beings whose bodies and boundaries read as stable light, tuned vibration, and intentional geometry rather than flesh in the ordinary sense.", "words": 261, "sections": [{"h": "Overview", "t": "**Aurel-kind** is the common label for the **energy-native** inhabitants of F200, most often encountered along **Aurel Meridian**\u2014beings whose bodies and boundaries read as **stable light, tuned vibration, and intentional geometry** rather than flesh in the ordinary sense."}, {"h": "Description", "t": "**Visual (for art reference)**  \nFigures are typically described with **a core filament** (a line or spindle of gold-white) surrounded by a **soft corona** and **slower rings of honey-colored interference**. Edges are clean; silhouettes can look **slightly prismatic** when \u201cmoving,\u201d as if the outline were a **refraction of self** through calm air. Faces, when present, are often **mask-smooth ovals of light** with no pupils\u2014expression carried by **brightness modulation** and **harmonic shimmer** (a tremolo in the corona) rather than micro-features.\n\n**Behavior**  \nAurel-kind are widely characterized as **serene, deliberate, and non-predatory**. Conflict, when described, is rare and tends to be framed as **dissonance**\u2014a wrong note in a shared field\u2014rather than as territorial violence. Social gathering can resemble **lattice patterns** in the air, or a **row of bright nodes** along the meridian\u2019s length.\n\n**Limits**  \nThis record does not yet specify governments, rites, or true population counts; the Aurel-kind remain **culturally and physically distinct** from F432 life."}, {"h": "Beliefs About Them", "t": "Outsiders sometimes mythologize the Aurel-kind as **saints of frequency**; others as **alien harmonics** that only mimic personhood. Neither claim is established."}, {"h": "Narrative Role", "t": "Aurel-kind function as a **lived proof** that Dias supports **ecologies of light** and **high-coherence personhood** outside material biology."}, {"h": "Notes", "t": "Contrast **Aurel-kind** with the **rumored** F500 **Unraveled** when building moral or visual binaries (peace vs. absence; clarity vs. negation)."}], "unresolved": []}, {"id": "inhabitant:axiomorphs", "slug": "axiomorphs", "label": "Axiomorphs", "category": "inhabitant", "status": "canonical", "themes": ["alien morphology", "geometry", "nonhuman cognition"], "path": "inhabitants/axiomorphs.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)", "nature": "non-humanoid geometric race"}, "assets": [], "summary": "Axiomorphs are a dominant non-humanoid race in F432, known for bodies that express geometric and field-like structures rather than fixed organic anatomy.", "words": 148, "sections": [{"h": "Overview", "t": "Axiomorphs are a dominant non-humanoid race in F432, known for bodies that express geometric and field-like structures rather than fixed organic anatomy."}, {"h": "Description", "t": "Individuals may appear as polyhedral clusters, floating lattice forms, segmented arcs, or shape-shifting assemblies that maintain identity through pattern continuity rather than stable flesh outline.\n\nCommon visual traits include hard-edged silhouettes, rotating facet planes, softly glowing seams, and motion that feels mathematically precise instead of muscle-driven. Some Axiomorphs hover continuously, while others \"step\" by reassembling shape position between moments."}, {"h": "Beliefs About Them", "t": "Some F432 communities treat Axiomorphs as difficult to read; others value them as precise negotiators and high-order systems thinkers."}, {"h": "Narrative Role", "t": "Axiomorphs let stories stretch beyond human assumptions of body, gesture, and communication while still participating in everyday civic life."}, {"h": "Notes", "t": "Not all Axiomorphs are abstract in behavior; many are practical traders, engineers, and archivists with long local residency in F432."}], "unresolved": []}, {"id": "inhabitant:bren-holloway", "slug": "bren-holloway", "label": "Bren Holloway", "category": "inhabitant", "status": "canonical", "themes": ["route command", "hazard leadership", "altered body"], "path": "inhabitants/bren-holloway.md", "region": "Brindle March", "parent_region": "", "meta": {"region": "Brindle March", "nature": "person"}, "assets": [], "summary": "Bren Holloway is the Road Marshal of Brindle March.", "words": 103, "sections": [{"h": "Overview", "t": "Bren Holloway is the Road Marshal of Brindle March."}, {"h": "Description", "t": "F432 race record: **Human**.\n\nBren is known for restoring movement under extreme conditions and treating transport continuity as regional lifeblood.\n\nHis head is permanently enclosed in a translucent gel-cube structure, an identifying feature that made him legendary across march routes."}, {"h": "Beliefs About Them", "t": "Travel crews trust Bren's reliability under pressure. Some local enclaves resent his tendency to prioritize corridor flow over local autonomy."}, {"h": "Narrative Role", "t": "Bren represents infrastructural heroism: leadership defined by keeping systems alive during crisis."}, {"h": "Notes", "t": "His command legitimacy is strongest at bridges, spans, and contested crossings."}], "unresolved": []}, {"id": "inhabitant:carrow-vale", "slug": "carrow-vale", "label": "Carrow Vale", "category": "inhabitant", "status": "canonical", "themes": ["exile rule", "fear and loyalty", "masked authority"], "path": "inhabitants/carrow-vale.md", "region": "Sorel", "parent_region": "", "meta": {"region": "Sorel", "nature": "person"}, "assets": [], "summary": "Carrow Vale is the First Exile of Sorel.", "words": 105, "sections": [{"h": "Overview", "t": "Carrow Vale is the First Exile of Sorel."}, {"h": "Description", "t": "F432 race record: **Human**.\n\nCarrow rose from dispossession into cross-territory command by forging protection pacts among camps that had no shared law.\n\nOn the day of exile, Carrow adopted a mask and never removed it, turning anonymity into a permanent instrument of rule."}, {"h": "Beliefs About Them", "t": "To followers, Carrow gave the rejected a common voice. To enemies, Carrow converted exile identity into a throne of intimidation."}, {"h": "Narrative Role", "t": "Carrow embodies frontier legitimacy: authority earned by endurance, then maintained by reputation and controlled fear."}, {"h": "Notes", "t": "Facial identity is effectively absent from public memory."}], "unresolved": []}, {"id": "inhabitant:choirglass", "slug": "choirglass", "label": "Choirglass", "category": "inhabitant", "status": "canonical", "themes": ["resonance", "faceted consciousness", "harmonic communication"], "path": "inhabitants/choirglass.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)", "nature": "resonant faceted race"}, "assets": [], "summary": "Choirglass are a dominant F432 race with faceted bodies and resonance-based cognition, often perceived through sound-light interplay.", "words": 151, "sections": [{"h": "Overview", "t": "Choirglass are a dominant F432 race with faceted bodies and resonance-based cognition, often perceived through sound-light interplay."}, {"h": "Description", "t": "Their presence is commonly described as prism-like and chordal: posture, speech, and mood can register as layered tonal structures as much as visible movement. Communication may combine voice, overtone, and refractive signaling.\n\nChoirglass bodies are typically translucent or semi-translucent, built from faceted planes that catch ambient light into color bands. Facial regions may be smooth or multi-paneled rather than flesh-featured, with expression conveyed by brightness shifts, harmonic vibration, and refractive pulse patterns."}, {"h": "Beliefs About Them", "t": "Some communities view Choirglass as serene adjudicators; others find them difficult to interpret when expecting single-channel speech norms."}, {"h": "Narrative Role", "t": "Choirglass are useful in stories about translation, conflict mediation, and how different minds can hold truth without identical perception."}, {"h": "Notes", "t": "Choirglass are not automatically sages; they occupy the full range of ordinary social roles in F432."}], "unresolved": []}, {"id": "inhabitant:converse-heads", "slug": "converse-heads", "label": "Converse Heads", "category": "inhabitant", "status": "unknown", "themes": ["communal chatter", "elongated forms", "social pressure", "tone contagion"], "path": "inhabitants/converse-heads.md", "region": "The Bloomline Estuary", "parent_region": "", "meta": {"region": "The Bloomline Estuary", "nature": "rooted conversational entities"}, "assets": [], "summary": "Converse Heads are reported Bloomline entities appearing as white heads with elongated necks rising from shared ground in clustered conversational fields.", "words": 104, "sections": [{"h": "Overview", "t": "Converse Heads are reported Bloomline entities appearing as white heads with elongated necks rising from shared ground in clustered conversational fields."}, {"h": "Description", "t": "Witnesses describe overlapping speech rhythms: gossip, jokes, arguments, confessions, and sudden chorus laughter. Individuals may lean or arc over others, creating a layered \"canopy\" of voices."}, {"h": "Beliefs About Them", "t": "Some claim they are independent inhabitants. Others argue they are temporary manifestations formed by pooled social emotion in confluence zones."}, {"h": "Narrative Role", "t": "They function as living atmosphere for scenes where social tone can shift civic outcomes before formal decisions begin."}, {"h": "Notes", "t": "Observation confidence varies; most reports come from heavy-current periods."}], "unresolved": []}, {"id": "inhabitant:coris-vale", "slug": "coris-vale", "label": "Coris Vale", "category": "inhabitant", "status": "canonical", "themes": ["island defense", "command presence", "threshold law"], "path": "inhabitants/coris-vale.md", "region": "Isle of Calareth", "parent_region": "", "meta": {"region": "Isle of Calareth", "nature": "person"}, "assets": [], "summary": "Coris Vale is the Isle Warden of Calareth.", "words": 99, "sections": [{"h": "Overview", "t": "Coris Vale is the Isle Warden of Calareth."}, {"h": "Description", "t": "F432 race record: **Human**.\n\nCoris rose from shore-watch lineages and consolidated control by clearing smuggler anchor routes that destabilized reefs and cliffs.\n\nShe governs Calareth as a protected threshold where entry is permitted but alteration is tightly constrained."}, {"h": "Beliefs About Them", "t": "Pilgrims and preservationists praise Coris as a guardian. Trade circles view her as a hard barrier and avoid crossing her directly."}, {"h": "Narrative Role", "t": "Coris represents uncompromising boundary authority in an ecologically fragile island zone."}, {"h": "Notes", "t": "Her deterrence reputation often resolves conflict before enforcement is required."}], "unresolved": []}, {"id": "inhabitant:despise-dancer", "slug": "despise-dancer", "label": "Despise Dancer", "category": "inhabitant", "status": "canonical", "themes": ["expressive resilience", "kinetic joy", "morale ignition"], "path": "inhabitants/despise-dancer.md", "region": "Sorel", "parent_region": "", "meta": {"region": "Sorel", "nature": "human performance inhabitant"}, "assets": [], "summary": "Despise Dancer is a known Sorel performer whose movement practice is associated with emotional recovery and public courage.", "words": 96, "sections": [{"h": "Overview", "t": "Despise Dancer is a known Sorel performer whose movement practice is associated with emotional recovery and public courage."}, {"h": "Description", "t": "The dancer is described as physically extreme yet controlled, able to adapt choreography to any rhythm source, from market percussion to storm-metal resonance."}, {"h": "Beliefs About Them", "t": "Many consider Despise Dancer proof that joy can be cultivated under pressure. Skeptics read the performances as spectacle masking deeper fracture fatigue."}, {"h": "Narrative Role", "t": "This inhabitant anchors scenes where embodied expression alters crowd tone during tense or grieving moments."}, {"h": "Notes", "t": "Strongly associated with the artwork *Despise Me*."}], "unresolved": []}, {"id": "inhabitant:diva-one", "slug": "diva-one", "label": "Diva One", "category": "inhabitant", "status": "canonical", "themes": ["focused perception", "luminous composure", "corridor guidance"], "path": "inhabitants/diva-one.md", "region": "Aurel Meridian", "parent_region": "", "meta": {"region": "Aurel Meridian", "nature": "coherent-energy inhabitant"}, "assets": [], "summary": "Diva One is an Aurel Meridian inhabitant recognized for highly focused presence, steady gaze behavior, and stabilizing influence during high-luminance coordination.", "words": 106, "sections": [{"h": "Overview", "t": "Diva One is an Aurel Meridian inhabitant recognized for highly focused presence, steady gaze behavior, and stabilizing influence during high-luminance coordination."}, {"h": "Description", "t": "Reports describe layered blue-violet-yellow light geometry across the face and upper body, with an affective profile read as calm precision rather than emotional detachment."}, {"h": "Beliefs About Them", "t": "Observers often describe Diva One as \"seeing alignment before speech,\" a phrase used to indicate unusual anticipatory awareness in harmonic transit contexts."}, {"h": "Narrative Role", "t": "Diva One serves as a character anchor for F200 lived sociality, translating abstract harmonic order into recognizable personal presence."}, {"h": "Notes", "t": "Portrait references generally derive from the artwork *Diva 1*."}], "unresolved": []}, {"id": "inhabitant:draftkin", "slug": "draftkin", "label": "Draftkin", "category": "inhabitant", "status": "canonical", "themes": ["adaptive identity", "iterative form", "makers", "nonfinal selves"], "path": "inhabitants/draftkin.md", "region": "F960 (frequency realm)", "parent_region": "", "meta": {"region": "F960 (frequency realm)", "culture": "The Open Hand of Making", "nature": "process-native beings"}, "assets": [], "summary": "Draftkin are the most cited inhabitants of F960: process-native beings whose appearance stabilizes enough for recognition, but remains subtly revisable over time.", "words": 149, "sections": [{"h": "Overview", "t": "**Draftkin** are the most cited inhabitants of F960: process-native beings whose appearance stabilizes enough for recognition, but remains subtly revisable over time."}, {"h": "Description", "t": "Draftkin bodies read like layered decisions. A typical observer notes a stable silhouette with visible line-memory: edge traces, faint construction geometry, and occasional \"revision seams\" where proportions refine across days or seasons.\n\nThey are not treated as unfinished people; in local terms they are **finished in motion**. Voice and gesture carry this quality as well, with pauses and redirections accepted as ordinary intelligence rather than uncertainty."}, {"h": "Beliefs About Them", "t": "Outsiders sometimes mythologize Draftkin as prophecy beings or failed forms. F960 sources reject both simplifications: Draftkin are understood as normal citizens of a realm where persistence and revision coexist."}, {"h": "Narrative Role", "t": "Draftkin embody a key Dias question: can identity remain truthful while remaining revisable?"}, {"h": "Notes", "t": "Visual guidance: avoid horror deformation. Emphasize elegant, deliberate iteration."}], "unresolved": []}, {"id": "inhabitant:elyra-mossen", "slug": "elyra-mossen", "label": "Elyra Mossen", "category": "inhabitant", "status": "canonical", "themes": ["keeper leadership", "ecological restraint", "tribal coalition"], "path": "inhabitants/elyra-mossen.md", "region": "Wabet", "parent_region": "", "meta": {"region": "Wabet", "nature": "person"}, "assets": [], "summary": "Elyra Mossen is the First Keeper of Wabet.", "words": 113, "sections": [{"h": "Overview", "t": "Elyra Mossen is the First Keeper of Wabet."}, {"h": "Description", "t": "F432 race record: **Human**.\n\nFormerly a river-path guide, Elyra gained trust by refusing high-yield extraction terms that would have damaged soil and water continuity.\n\nShe leads as a coalition keeper rather than a central ruler, binding tribe elders to shared limits instead of a strict command chain."}, {"h": "Beliefs About Them", "t": "Many Wabet communities view Elyra as a guardian of living systems. Opponents argue she sacrifices growth and leverage for principles."}, {"h": "Narrative Role", "t": "Elyra represents restraint as power: governance that protects future habitability over short-term gain."}, {"h": "Notes", "t": "Her authority is strongest where water access, harvest boundaries, and tribal passage rights intersect."}], "unresolved": []}, {"id": "inhabitant:ember-keepers", "slug": "ember-keepers", "label": "Ember Keepers", "category": "inhabitant", "status": "canonical", "themes": ["resilience labor", "shelter stewardship", "continuity"], "path": "inhabitants/ember-keepers.md", "region": "F840 (frequency realm)", "parent_region": "", "meta": {"region": "F840 (frequency realm)", "nature": "hearthline stewards"}, "assets": [], "summary": "Ember Keepers are the long-line stewards of F840's Hearthline corridors, responsible for maintaining viable warmth, shelter, and relay continuity.", "words": 85, "sections": [{"h": "Overview", "t": "Ember Keepers are the long-line stewards of F840's Hearthline corridors, responsible for maintaining viable warmth, shelter, and relay continuity."}, {"h": "Description", "t": "Their work is repetitive and essential: stabilizing heat nodes, marking safe passes, rotating rest stations, and handing forward practical knowledge."}, {"h": "Beliefs About Them", "t": "They are widely respected as proof that care can be infrastructural."}, {"h": "Narrative Role", "t": "Ember Keepers anchor post-crisis stories in durable human (or near-human) effort rather than spectacle."}, {"h": "Notes", "t": "Their authority is earned through maintenance record and trust, not charisma."}], "unresolved": []}, {"id": "inhabitant:fruit-walker", "slug": "fruit-walker", "label": "Fruit Walker", "category": "inhabitant", "status": "rumor", "themes": ["wandering elder", "lucky fruit folklore", "uncertain witness accounts", "omen at the doorstep"], "path": "inhabitants/fruit-walker.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)", "nature": "human"}, "assets": [], "summary": "The Fruit Walker is an elderly wandering figure said to appear unpredictably across F432, most often in Wabet and Nauw, while rarely entering Sorel.", "words": 202, "sections": [{"h": "Overview", "t": "The Fruit Walker is an elderly wandering figure said to appear unpredictably across F432, most often in Wabet and Nauw, while rarely entering Sorel."}, {"h": "Description", "t": "Accounts describe an old man traveling on foot with baskets of fruit. He is usually calm, speaks little, and appears without warning in settlements or at isolated homes.\n\nMost reports place him along routes tied to Wabet produce movement into Nauw, where Lucky Fruit belief is already culturally strong. His sightings in Sorel are rare enough that many there dismiss the figure entirely."}, {"h": "Beliefs About Them", "t": "People disagree on whether the Fruit Walker is real, misidentified, or a shared tale repeated across generations. Some claim direct encounters; others insist no reliable proof exists.\n\nA persistent belief says that if he arrives at a specific door, it is never random. The visit is interpreted as a sign that an unusual turn is coming to that household."}, {"h": "Narrative Role", "t": "The Fruit Walker functions as a roaming threshold figure in F432 lore: part traveler, part omen-bearer, linking ordinary fruit trade to moments people later describe as meaningful fate."}, {"h": "Notes", "t": "When the figure is said to appear, he may offer Lucky Fruit directly to the household he visits."}], "unresolved": []}, {"id": "inhabitant:glasswater-field-drifters", "slug": "glasswater-field-drifters", "label": "Glasswater Field Drifters", "category": "inhabitant", "status": "canonical", "themes": ["night watch", "inherited duty", "sky vigilance", "communal protection"], "path": "inhabitants/glasswater-field-drifters.md", "region": "Glasswater Fields", "parent_region": "", "meta": {"region": "Glasswater Fields", "nature": "human"}, "assets": [], "summary": "Glasswater Field Drifters are inhabitants of southern Glasswater Fields who spend the night hours floating on the region's dam waters while watching the sky for signs of danger.", "words": 188, "sections": [{"h": "Overview", "t": "Glasswater Field Drifters are inhabitants of southern Glasswater Fields who spend the night hours floating on the region's dam waters while watching the sky for signs of danger."}, {"h": "Description", "t": "At dusk, drifters move onto the large clean-water dams and begin a long overnight drift on personal flotation tubes. The practice is both practical and ceremonial: each watcher keeps one tube for life, and many tubes are passed from parent to child as part of accepting the same role in adulthood.\n\nThough the setting is quiet and beautiful, the work is considered essential. Drifters track the sky and stars through the hours when most settlements sleep, maintaining continuous visual vigilance until morning."}, {"h": "Beliefs About Them", "t": "Across Glasswater Fields, they are widely respected as protectors whose patience and discipline keep communities safe, even when the exact nature of the threat is not discussed openly."}, {"h": "Narrative Role", "t": "They embody one of Dias's core social patterns: calm rituals that preserve public safety while carrying memory of older sky-borne dangers."}, {"h": "Notes", "t": "Local identity around the drifters is strong, but naming traditions for sub-groups and lineages remain only partially recorded."}], "unresolved": []}, {"id": "inhabitant:great-blue-bird", "slug": "great-blue-bird", "label": "Great Blue Bird", "category": "inhabitant", "status": "unknown", "themes": ["macro-predator", "fear ecology", "route discipline"], "path": "inhabitants/great-blue-bird.md", "region": "The Ashen Hearthline", "parent_region": "", "meta": {"region": "The Ashen Hearthline", "nature": "giant avian predator"}, "assets": [], "summary": "Great Blue Bird is the name given to reported giant avian predators said to patrol upper lanes and exposed transit zones near Hearthline corridor edges.", "words": 123, "sections": [{"h": "Overview", "t": "Great Blue Bird is the name given to reported giant avian predators said to patrol upper lanes and exposed transit zones near Hearthline corridor edges."}, {"h": "Description", "t": "Accounts describe extreme scale, a dominant blue body profile, and a beak powerful enough to seize adult travelers. Most reports come from distance sightings, disrupted caravan lines, or cautionary retellings."}, {"h": "Beliefs About Them", "t": "For some communities the Great Blue Bird is literal wildlife. For others it functions as protective folklore enforcing child and traveler discipline in hazardous terrain."}, {"h": "Narrative Role", "t": "The figure reinforces Hearthline behavioral norms: stay in marked routes, travel in group cadence, and treat open-zone bravado as avoidable risk."}, {"h": "Notes", "t": "Current canon keeps taxonomic certainty open while preserving strong cultural impact."}], "unresolved": []}, {"id": "inhabitant:green-flower-keeper", "slug": "green-flower-keeper", "label": "Green Flower Keeper", "category": "inhabitant", "status": "canonical", "themes": ["stewardship", "patient labor", "seasonal guidance", "living installation"], "path": "inhabitants/green-flower-keeper.md", "region": "Green Garden Border Lanes", "parent_region": "", "meta": {"region": "Green Garden Border Lanes", "nature": "human"}, "assets": [], "summary": "The Green Flower Keeper is the resident caretaker responsible for planting, arranging, and maintaining the thousands of potted green blooms at Green Garden Border Lanes.", "words": 160, "sections": [{"h": "Overview", "t": "The Green Flower Keeper is the resident caretaker responsible for planting, arranging, and maintaining the thousands of potted green blooms at Green Garden Border Lanes."}, {"h": "Description", "t": "Local accounts describe one central keeper role that oversees the entire site, with day-to-day work focused on pot rotation, soil checks, spacing alignment, and light-oriented placement. The keeper's discipline is what makes the display look like a natural meadow despite being fully hand-managed."}, {"h": "Beliefs About Them", "t": "Travelers often speak of the keeper with unusual respect, treating the role as both gardener and guide. Some say the keeper can read subtle light patterns and adjust rows in advance so the full display shifts smoothly through the day."}, {"h": "Narrative Role", "t": "The keeper personifies a key Nauw pattern: transforming routine care into shared public meaning. Through one person's ongoing labor, a transit border becomes a place of pause and renewal."}, {"h": "Notes", "t": "Formal succession customs for the keeper role are not yet publicly documented."}], "unresolved": []}, {"id": "inhabitant:harold", "slug": "harold", "label": "Harold", "category": "inhabitant", "status": "canonical", "themes": ["loss", "endurance", "routine", "freedom through motion"], "path": "inhabitants/harold.md", "region": "Veloria City", "parent_region": "", "meta": {"region": "Veloria City", "nature": "human"}, "assets": [], "summary": "Harold is a runner of Veloria City who has lost nearly everything in life; running is the one thing no one can take from him.", "words": 143, "sections": [{"h": "Overview", "t": "Harold is a runner of Veloria City who has lost nearly everything in life; running is the one thing no one can take from him."}, {"h": "Description", "t": "Each morning, Harold wakes and begins his long run around the city. Because Veloria is so massive, a full circuit cannot be completed in a single day. Instead, he treats the route as a continuous multi-day loop and returns to it as the core routine of his life.\n\nFor Harold, running provides daily freedom and clarity. The act itself is both survival and self-definition."}, {"h": "Beliefs About Them", "t": "People who know Harold often describe him as a figure of stubborn resilience: a man stripped down to motion, discipline, and purpose."}, {"h": "Narrative Role", "t": "Harold grounds Veloria's vast scale in a human rhythm, showing how a single person can map a city through repeated effort over time."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "inhabitant:havren-pike", "slug": "havren-pike", "label": "Havren Pike", "category": "inhabitant", "status": "canonical", "themes": ["gate defense", "martial discipline", "threshold authority"], "path": "inhabitants/havren-pike.md", "region": "DEB Gate of Veloria", "parent_region": "", "meta": {"region": "DEB Gate of Veloria", "nature": "person"}, "assets": [], "summary": "Havren Pike is the Gate Lord of the DEB Gate of Veloria.", "words": 112, "sections": [{"h": "Overview", "t": "Havren Pike is the Gate Lord of the DEB Gate of Veloria."}, {"h": "Description", "t": "F432 race record: **Kharad**.\n\nThough simple in apparent stature, Havren is regarded as a high-threat defensive commander with a strict threshold doctrine.\n\nHe is known for circular blade weapons and for enforcing legitimacy at Veloria's main gate corridor."}, {"h": "Beliefs About Them", "t": "City residents often view Havren as a necessary protector. Border critics argue his gate discipline can become political exclusion."}, {"h": "Narrative Role", "t": "Havren represents armored civic order: the figure who turns symbolic architecture into active security law."}, {"h": "Notes", "t": "Traditions state he previously served as a knight in the Lorien army before rising to Gate Lord."}], "unresolved": []}, {"id": "inhabitant:human-eyed-whales", "slug": "human-eyed-whales", "label": "Human-Eyed Whales", "category": "inhabitant", "status": "canonical", "themes": ["ocean symbiosis", "sustenance", "intelligence", "contested kinship"], "path": "inhabitants/human-eyed-whales.md", "region": "Nauw Outer Rim Seas", "parent_region": "", "meta": {"region": "Nauw Outer Rim Seas", "nature": "creature"}, "assets": [], "summary": "Human-Eyed Whales are massive marine beings found in the Nauw Outer Rim Seas, recognized by their unusually human-like eyes and central role in regional survival.", "words": 148, "sections": [{"h": "Overview", "t": "Human-Eyed Whales are massive marine beings found in the Nauw Outer Rim Seas, recognized by their unusually human-like eyes and central role in regional survival."}, {"h": "Description", "t": "These whales move through the outer waters as part of a broader ocean ecology that supports many species and coastal communities. In Nauw, they are considered crucial to food continuity and long-term maritime balance.\n\nNot all human-eyed whales relate to people in the same way. Some are hunted by fishing crews, while others form sustained bonds with particular Singing Fishermen and are treated as companions rather than prey."}, {"h": "Beliefs About Them", "t": "Some communities interpret the whales as intelligent co-participants in ocean life rather than mere resources, while others emphasize necessity and regard them primarily through a survival lens."}, {"h": "Narrative Role", "t": "They embody the moral and practical tension between dependence, reverence, and extraction in the outer waters of Nauw."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "inhabitant:humans", "slug": "humans", "label": "Humans", "category": "inhabitant", "status": "canonical", "themes": ["adaptability", "cultural plurality", "civic continuity"], "path": "inhabitants/humans.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)", "nature": "humanoid race"}, "assets": [], "summary": "Humans are one of the most widespread and institutionally visible races in F432, present across major cities, frontier routes, and trade systems.", "words": 142, "sections": [{"h": "Overview", "t": "Humans are one of the most widespread and institutionally visible races in F432, present across major cities, frontier routes, and trade systems."}, {"h": "Description", "t": "F432 humans show broad variation in ethnicity, appearance, language, belief systems, and social customs. They are generally bipedal, tool-using, and community-structured, with high capacity to integrate cross-racial practices.\n\nTypical appearance shows wide variation in hair texture, facial structure, height, body shape, and dress traditions tied to local cultures across F432."}, {"h": "Beliefs About Them", "t": "Other groups often describe humans as adaptable generalists: quick to form civic systems, quick to disagree internally, and quick to rebuild after disruption."}, {"h": "Narrative Role", "t": "Humans provide a flexible baseline for stories that need familiar social framing while still participating in the wider multi-racial reality of Dias."}, {"h": "Notes", "t": "Human-majority settlements in F432 do not imply species monopoly; the realm remains broadly mixed and migration-active."}], "unresolved": []}, {"id": "inhabitant:iskar-l-m", "slug": "iskar-l-m", "label": "Iskar L\u00fcm", "category": "inhabitant", "status": "canonical", "themes": ["desert custodianship", "otherworldly form", "hidden water ethics"], "path": "inhabitants/iskar-lum.md", "region": "Lumira Sands", "parent_region": "", "meta": {"region": "Lumira Sands", "nature": "otherworldly being"}, "assets": [], "summary": "Iskar L\u00fcm is the Dune Keeper of Lumira Sands.", "words": 102, "sections": [{"h": "Overview", "t": "Iskar L\u00fcm is the Dune Keeper of Lumira Sands."}, {"h": "Description", "t": "F432 race record: **Axiomorph**.\n\nIskar appears as a drifting, unstable figure rather than a conventional human body, with facial and limb-like forms shifting in relation and scale.\n\nHis authority comes from survival knowledge: mapping hidden water, enforcing oasis protocols, and protecting silence-law practice."}, {"h": "Beliefs About Them", "t": "Locals treat Iskar as a necessary desert custodian. Outsiders often read him as a threat or omen due to his form."}, {"h": "Narrative Role", "t": "Iskar represents desert stewardship through altered embodiment and disciplined secrecy."}, {"h": "Notes", "t": "His water-route maps are treated as oath-protected knowledge."}], "unresolved": []}, {"id": "inhabitant:kharad", "slug": "kharad", "label": "Kharad", "category": "inhabitant", "status": "canonical", "themes": ["durability", "craft labor", "structural memory"], "path": "inhabitants/kharad.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)", "nature": "dense-bodied material race"}, "assets": [], "summary": "Kharad are a dominant F432 race known for dense, materially stable bodies and strong traditions in infrastructure craft.", "words": 147, "sections": [{"h": "Overview", "t": "Kharad are a dominant F432 race known for dense, materially stable bodies and strong traditions in infrastructure craft."}, {"h": "Description", "t": "Kharad morphology ranges from stone-like to metal-grain tissue textures, with high load tolerance and low instability under environmental stress. Many Kharad lineages specialize in long-horizon construction, repair, and risk forecasting.\n\nThey are often broad-framed with dense limb structure, mineral-like skin patterns, and layered surface tones that resemble granite, basalt, copper patina, or hammered iron. Movement tends to be deliberate and grounded, with posture that emphasizes balance and load awareness."}, {"h": "Beliefs About Them", "t": "They are widely associated with reliability and blunt pragmatism, though this stereotype often ignores their artistic and ceremonial traditions."}, {"h": "Narrative Role", "t": "Kharad anchor stories that center on material stakes: bridges, walls, shelter systems, and what survives pressure over time."}, {"h": "Notes", "t": "Kharad are not uniformly heavy infantry archetypes; many are scholars, artists, and civic planners."}], "unresolved": []}, {"id": "inhabitant:leora-finn", "slug": "leora-finn", "label": "Leora Finn", "category": "inhabitant", "status": "canonical", "themes": ["harvest guardianship", "community care", "sky-watch discipline"], "path": "inhabitants/leora-finn.md", "region": "Glasswater Fields", "parent_region": "", "meta": {"region": "Glasswater Fields", "nature": "person"}, "assets": [], "summary": "Leora Finn is the Harvest Warden of Glasswater Fields.", "words": 99, "sections": [{"h": "Overview", "t": "Leora Finn is the Harvest Warden of Glasswater Fields."}, {"h": "Description", "t": "F432 race record: **Human**.\n\nRaised in dam-watch culture, Leora built her authority by organizing harvest protection and night vigilance during sky-panic periods.\n\nHer leadership style is calm, practical, and care-centered, with emphasis on shared continuity over rapid expansion."}, {"h": "Beliefs About Them", "t": "Field communities see Leora as an anchor of both morale and logistics. Detractors argue her caution slows growth in high-demand cycles."}, {"h": "Narrative Role", "t": "Leora represents stabilizing stewardship where food security is treated as communal duty."}, {"h": "Notes", "t": "Her public image emphasizes composure even under threat."}], "unresolved": []}, {"id": "inhabitant:lineborn", "slug": "lineborn", "label": "Lineborn", "category": "inhabitant", "status": "canonical", "themes": ["planar bodies", "sketch ontology", "edge perception"], "path": "inhabitants/lineborn.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)", "nature": "near-2D race"}, "assets": [], "summary": "Lineborn are a dominant F432 race whose bodies present as thin-plane or sketch-like forms with minimal visible depth.", "words": 143, "sections": [{"h": "Overview", "t": "Lineborn are a dominant F432 race whose bodies present as thin-plane or sketch-like forms with minimal visible depth."}, {"h": "Description", "t": "They can resemble living ink cuts, chalk silhouettes, or layered contour figures. Despite planar appearance, Lineborn are fully embodied persons with stable identity, language, and social organization.\n\nMost Lineborn present as narrow profiles with calligraphic edges, high-contrast outlines, and interior texture that reads like sketch shading, parchment grain, or charcoal crosshatch. In motion, they often \"flip\" between near-invisible side angles and richly detailed frontal planes."}, {"h": "Beliefs About Them", "t": "Outsiders sometimes mistake Lineborn for illusions; local records classify them as fully material within their own interaction rules."}, {"h": "Narrative Role", "t": "Lineborn provide a visual and conceptual bridge between cartography, drawing metaphors, and personhood in a frequency-driven world."}, {"h": "Notes", "t": "Do not treat Lineborn as ghosts by default; they are living participants in F432 civic life."}], "unresolved": []}, {"id": "inhabitant:lucky-farmers", "slug": "lucky-farmers", "label": "Lucky Farmers", "category": "inhabitant", "status": "canonical", "themes": ["opportunistic harvest", "lucky fruit pursuit", "roaming camps", "regional rivalry"], "path": "inhabitants/lucky-farmers.md", "region": "Aelwyn Canopy", "parent_region": "", "meta": {"region": "Aelwyn Canopy", "nature": "human"}, "assets": [], "summary": "Lucky Farmers are roaming harvesters associated with Aelwyn Canopy, known for searching specifically for rare perfect-form Lucky Fruits.", "words": 167, "sections": [{"h": "Overview", "t": "Lucky Farmers are roaming harvesters associated with Aelwyn Canopy, known for searching specifically for rare perfect-form Lucky Fruits."}, {"h": "Description", "t": "Unlike the broad cultivation discipline of Verdant Reach, Lucky Farmers operate more like trackers and prospectors. They camp, survey, and move repeatedly through Aelwyn zones, treating each day as a search for high-value fruit anomalies rather than routine crop management.\n\nTheir nickname reflects this narrow focus: they are seen less as general farmers and more as Lucky Fruit vendors and hunters."}, {"h": "Beliefs About Them", "t": "Some communities admire their risk tolerance and field knowledge. Others view them as destabilizing opportunists whose methods prioritize rare finds over ecological continuity.\n\nA recurring local account holds that Lucky Farmers are not welcome inside Verdant Reach's managed core zones, where Verdant Farmers enforce stricter cultivation boundaries."}, {"h": "Narrative Role", "t": "They embody the speculative edge of Wabet's fruit economy: hope, rumor, and profit-seeking clustered around rare anomalies."}, {"h": "Notes", "t": "Their reports are a major source of Lucky Fruit stories, but verification remains uneven."}], "unresolved": []}, {"id": "inhabitant:maes-thorn", "slug": "maes-thorn", "label": "Maes Thorn", "category": "inhabitant", "status": "canonical", "themes": ["orchard stewardship", "unsettling presence", "unknown origin"], "path": "inhabitants/maes-thorn.md", "region": "Verdant Reach", "parent_region": "", "meta": {"region": "Verdant Reach", "nature": "person"}, "assets": [], "summary": "Maes Thorn is the Orchard Warden of Verdant Reach.", "words": 98, "sections": [{"h": "Overview", "t": "Maes Thorn is the Orchard Warden of Verdant Reach."}, {"h": "Description", "t": "F432 race record: **Human**.\n\nMaes rebuilt failing orchard systems through careful land rotation while enforcing firm boundaries against opportunistic overharvest.\n\nHer distant stare and unclear origin made her one of Wabet's most discussed leadership figures."}, {"h": "Beliefs About Them", "t": "Core growers trust her long-cycle planning. Outsiders and opportunists often fear her and spread stories about hidden abilities."}, {"h": "Narrative Role", "t": "Maes represents productive order held by a leader who is both respected and unnerving."}, {"h": "Notes", "t": "A persistent rumor claims she can fully read minds during negotiation."}], "unresolved": []}, {"id": "inhabitant:marek-solon", "slug": "marek-solon", "label": "Marek Solon", "category": "inhabitant", "status": "canonical", "themes": ["dual-form existence", "maritime rites", "fracture legacy"], "path": "inhabitants/marek-solon.md", "region": "Nauw Outer Rim Seas", "parent_region": "", "meta": {"region": "Nauw Outer Rim Seas", "nature": "anomalous person"}, "assets": [], "summary": "Marek Solon is the Tide Warden of the Nauw Outer Rim Seas.", "words": 113, "sections": [{"h": "Overview", "t": "Marek Solon is the Tide Warden of the Nauw Outer Rim Seas."}, {"h": "Description", "t": "F432 race record: **Palewind Swarm** lineage.\n\nMarek manifests in dual-form, with two near-identical presences perceived in separate positions at once. Encounters are often reported as mirror-like and disorienting.\n\nTheir leadership combines sea-route memory, ritual timing, and practical fisher survival law."}, {"h": "Beliefs About Them", "t": "Some communities treat Marek as a sacred sign tied to old fracture remnants. Others regard the dual-form condition as unstable and potentially manufactured."}, {"h": "Narrative Role", "t": "Marek represents living continuity between maritime governance and unresolved fracture history in F432."}, {"h": "Notes", "t": "Marek is also associated with efforts to document pre-fracture remnants as an active side mission."}], "unresolved": []}, {"id": "inhabitant:mega-butterfly", "slug": "mega-butterfly", "label": "Mega Butterfly", "category": "inhabitant", "status": "canonical", "themes": ["annual migration", "giant winged creature", "cautionary encounters", "seasonal cycle"], "path": "inhabitants/mega-butterfly.md", "region": "Nauw", "parent_region": "", "meta": {"region": "Nauw", "nature": "creature"}, "assets": [], "summary": "The Mega Butterfly is a rare giant butterfly of Nauw, known for reaching sizes far beyond ordinary butterflies and appearing in a single annual migration.", "words": 190, "sections": [{"h": "Overview", "t": "The Mega Butterfly is a rare giant butterfly of Nauw, known for reaching sizes far beyond ordinary butterflies and appearing in a single annual migration."}, {"h": "Description", "t": "Most butterflies in Nauw are small and harmless, but Mega Butterflies are reported at roughly ten times that size. The largest individuals are massive enough to lift a human from the ground.\n\nTheir migration begins around Averra Isle, where they are believed to emerge, then continues eastward across Nauw until they reach Glasswater Fields. In that calmer region, they spend time around clean freshwater before the cycle resets."}, {"h": "Beliefs About Them", "t": "Communities treat Mega Butterfly season with caution. While most sightings are distant and non-violent, recurring reports claim some inhabitants have been lifted and carried across parts of Nauw by passing Mega Butterflies.\n\nBecause of these incidents, families and travelers are warned not to remain in open exposed routes during migration windows."}, {"h": "Narrative Role", "t": "Mega Butterflies represent one of Nauw's most dramatic seasonal movements: beautiful, awe-inducing, and potentially dangerous to anyone caught in their flight path."}, {"h": "Notes", "t": "Precise breeding sites on or around Averra Isle remain unverified by formal survey records."}], "unresolved": []}, {"id": "inhabitant:neris-hale", "slug": "neris-hale", "label": "Neris Hale", "category": "inhabitant", "status": "canonical", "themes": ["precision", "ritual timing", "civic discipline"], "path": "inhabitants/neris-hale.md", "region": "Green Garden Border Lanes", "parent_region": "", "meta": {"region": "Green Garden Border Lanes", "nature": "person"}, "assets": [], "summary": "Neris Hale is the Bloom Warden of Green Garden Border Lanes.", "words": 99, "sections": [{"h": "Overview", "t": "Neris Hale is the Bloom Warden of Green Garden Border Lanes."}, {"h": "Description", "t": "F432 race record: **Human**.\n\nNeris is known for a clock-bound leadership style in which movement, rites, and visitor flow are timed with strict precision.\n\nShe is commonly described as sleepless and constantly attentive to schedule drift."}, {"h": "Beliefs About Them", "t": "Most visitors respect Neris's time law and adapt quickly. Critics view her ritual timing as rigid overcontrol."}, {"h": "Narrative Role", "t": "Neris represents order through rhythm, showing how civic spaces can regulate behavior without overt force."}, {"h": "Notes", "t": "Her punctuality standard became part of local travel etiquette."}], "unresolved": []}, {"id": "inhabitant:oriven-tal", "slug": "oriven-tal", "label": "Oriven Tal", "category": "inhabitant", "status": "canonical", "themes": ["secrecy", "operations", "hidden influence", "uncertain identity"], "path": "inhabitants/oriven-tal.md", "region": "Veloria City", "parent_region": "", "meta": {"region": "Veloria City", "nature": "person"}, "assets": [], "summary": "Oriven Tal is the Ring Regent of Veloria City and a Tier 1 influence figure in F432.", "words": 150, "sections": [{"h": "Overview", "t": "Oriven Tal is the Ring Regent of Veloria City and a Tier 1 influence figure in F432."}, {"h": "Description", "t": "F432 race record: **Lineborn**.\n\nHe is rarely seen in public and is known for tightly controlling operational systems from behind closed channels.\n\nOriven is said to interface directly with Vailor Quentin while avoiding wider court visibility. City continuity, gate cycles, and core administrative timing are commonly attributed to his operating model."}, {"h": "Beliefs About Them", "t": "Some inhabitants believe Oriven's practical influence rivals Vailor's. Others claim he may be a constructed figure rather than a single person.\n\nAmong Ring Council observers, a frequent claim is that Vailor treats Oriven with unusual caution, suggesting hidden leverage not visible in formal hierarchy."}, {"h": "Narrative Role", "t": "Oriven represents invisible governance and the fear that power can be strongest when it is least visible."}, {"h": "Notes", "t": "Rumors describe Vailor Quentin as cautious around Oriven's shadow influence."}], "unresolved": []}, {"id": "inhabitant:oryn-pell", "slug": "oryn-pell", "label": "Oryn Pell", "category": "inhabitant", "status": "canonical", "themes": ["elder mediation", "canopy law", "inter-tribe restraint"], "path": "inhabitants/oryn-pell.md", "region": "Aelwyn Canopy", "parent_region": "", "meta": {"region": "Aelwyn Canopy", "nature": "person"}, "assets": [], "summary": "Oryn Pell is the Canopy Elder of Aelwyn Canopy.", "words": 90, "sections": [{"h": "Overview", "t": "Oryn Pell is the Canopy Elder of Aelwyn Canopy."}, {"h": "Description", "t": "F432 race record: **Human**.\n\nTrained in elevated walk settlements, Oryn rose through conflict mediation over upper-canopy harvest corridors.\n\nHe governs by slowing escalation, preserving route boundaries, and sustaining long-cycle canopy balance."}, {"h": "Beliefs About Them", "t": "Senior communities trust Oryn's restraint. Younger groups argue his old boundaries no longer match current pressure."}, {"h": "Narrative Role", "t": "Oryn represents elder authority that protects continuity against fast extraction impulses."}, {"h": "Notes", "t": "His influence is strongest where tribe paths overlap and disputes repeat seasonally."}], "unresolved": []}, {"id": "inhabitant:palewind-swarms", "slug": "palewind-swarms", "label": "Palewind Swarms", "category": "inhabitant", "status": "canonical", "themes": ["swarm personhood", "distributed intelligence", "adaptive coordination"], "path": "inhabitants/palewind-swarms.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)", "nature": "colony-intelligence race"}, "assets": [], "summary": "Palewind Swarms are a dominant F432 race whose personhood is distributed across many micro-bodies acting as one coherent identity.", "words": 158, "sections": [{"h": "Overview", "t": "Palewind Swarms are a dominant F432 race whose personhood is distributed across many micro-bodies acting as one coherent identity."}, {"h": "Description", "t": "A single Palewind individual may appear as a drifting veil of motes, filament clusters, or temporary gathered forms. They can partition for short tasks and reconverge without losing continuity of self.\n\nAt rest, many appear as hovering clouds of pale particles with subtle internal currents; in social contexts, they often condense into rough humanoid or totemic silhouettes to ease interaction. Their visible \"body\" can thicken, thin, or branch as attention and intent shift."}, {"h": "Beliefs About Them", "t": "Non-swarm societies sometimes mistake Palewind coordination for anonymity; Palewind legal traditions are explicit that each swarm identity is a distinct person with accountable continuity."}, {"h": "Narrative Role", "t": "Palewind Swarms support stories about collective agency, memory distribution, and non-singular embodiment in public life."}, {"h": "Notes", "t": "Partitioned units are functional extensions, not separate citizens by default unless a lineage-specific split rite says otherwise."}], "unresolved": []}, {"id": "inhabitant:refrain-walkers", "slug": "refrain-walkers", "label": "Refrain Walkers", "category": "inhabitant", "status": "canonical", "themes": ["pattern literacy", "route memory", "adaptive travel"], "path": "inhabitants/refrain-walkers.md", "region": "F120 (frequency realm)", "parent_region": "", "meta": {"region": "F120 (frequency realm)", "nature": "interval-native wayfinders"}, "assets": [], "summary": "Refrain Walkers are F120 wayfinders trained to navigate recurring-but-shifted terrain patterns.", "words": 78, "sections": [{"h": "Overview", "t": "Refrain Walkers are F120 wayfinders trained to navigate recurring-but-shifted terrain patterns."}, {"h": "Description", "t": "They track difference between passes with exceptional precision: what repeated, what moved, what changed tone. Their logs are full of paired annotations and variation marks."}, {"h": "Beliefs About Them", "t": "Outsiders sometimes treat them as mystics; F120 sources describe them as disciplined field readers."}, {"h": "Narrative Role", "t": "Useful bridge characters for stories involving echoes, legacy, and near-repetition."}, {"h": "Notes", "t": "Their authority comes from comparative memory, not prophecy."}], "unresolved": []}, {"id": "inhabitant:sael-corvin", "slug": "sael-corvin", "label": "Sael Corvin", "category": "inhabitant", "status": "canonical", "themes": ["hidden curation", "memory fracture", "esoteric authority"], "path": "inhabitants/sael-corvin.md", "region": "Averra Isle", "pare s priorities."}, {"h": "Narrative Role", "t": "Serik embodies middle-layer governance where peace depends on negotiation more than force."}, {"h": "Notes", "t": "His authority is strongest along contested transit and distribution corridors."}], "unresolved": []}, {"id": "inhabitant:singing-fishermen", "slug": "singing-fishermen", "label": "Singing Fishermen", "category": "inhabitant", "status": "canonical", "themes": ["songcraft", "seafaring", "kinship and hunt", "survival duty"], "path": "inhabitants/singing-fishermen.md", "region": "Nauw Outer Rim Seas", "parent_region": "", "meta": {"region": "Nauw Outer Rim Seas", "nature": "human"}, "assets": [], "summary": "Singing Fishermen are seafaring inhabitants associated with Veloria and the Nauw Outer Rim Seas, known for using sung calls in navigation, coordination, and whale encounters.", "words": 133, "sections": [{"h": "Overview", "t": "Singing Fishermen are seafaring inhabitants associated with Veloria and the Nauw Outer Rim Seas, known for using sung calls in navigation, coordination, and whale encounters."}, {"h": "Description", "t": "They are the primary people who encounter human-eyed whales at scale. Some crews hunt whales for food and continuity of supply across settlements. Others maintain long-term friendships with specific whales, swimming beside them, communicating through repeated sonic patterns, and refusing to hunt bonded companions.\n\nThis creates a dual practice inside the same tradition: relational partnership with some whales and active hunting of others."}, {"h": "Beliefs About Them", "t": "They are alternately regarded as protectors, providers, and morally conflicted specialists who carry the burden of decisions made at sea."}, {"h": "Narrative Role", "t": "The Singing Fishermen personify the unstable boundary between intimacy and necessity in Nauw's ocean economies."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "inhabitant:sky-drifters", "slug": "sky-drifters", "label": "Sky Drifters", "category": "inhabitant", "status": "canonical", "themes": ["watchers", "frequency overlap (speculation)", "mystery"], "path": "inhabitants/sky-drifters.md", "region": "Veloria City", "parent_region": "", "meta": {"region": "Veloria City", "nature": "unknown"}, "assets": [], "summary": "Sky Drifters are humanoid-shaped entities that drift endlessly in the skies above Veloria City. They never descend to the ground.", "words": 156, "sections": [{"h": "Overview", "t": "Sky Drifters are humanoid-shaped entities that drift endlessly in the skies above Veloria City. They never descend to the ground."}, {"h": "Description", "t": "They appear vaguely humanoid in shape and move in groups or clusters, gathering and separating as if interacting with one another. Their true nature and purpose remain unknown, and no clear record exists of their origin. For as long as the inhabitants of Veloria can remember, the Sky Drifters have always been present above the city.\n\nIn this repository, Daniel Eugene Botha\u2019s painting *Emergence* is treated as the **primary visual reference** for how the Sky Drifters are portrayed: figures suspended in darkness, drifting without ground, alone and intertwined at once."}, {"h": "Beliefs About Them", "t": "Some residents view them as silent watchers; others believe they may represent an unexplained overlap between frequencies within Dias."}, {"h": "Narrative Role", "t": "They are a defining visual and cultural feature of Veloria\u2019s sky and an enduring mystery in Nauw."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "inhabitant:tamsin-vor", "slug": "tamsin-vor", "label": "Tamsin Vor", "category": "inhabitant", "status": "canonical", "themes": ["free-spirited leadership", "social connective tissue", "basin culture"], "path": "inhabitants/tamsin-vor.md", "region": "Velorian Basin", "parent_region": "", "meta": {"region": "Velorian Basin", "nature": "person"}, "assets": [], "summary": "Tamsin Vor is the Market Steward of Velorian Basin.", "words": 99, "sections": [{"h": "Overview", "t": "Tamsin Vor is the Market Steward of Velorian Basin."}, {"h": "Description", "t": "F432 race record: **Human**.\n\nTamsin is known for a free-spirited leadership style shaped by road camps, river markets, and festival docks.\n\nShe governs by relationship networks, presence, and trust circles rather than strict bureaucratic form."}, {"h": "Beliefs About Them", "t": "Supporters describe Tamsin as the human pulse of the basin. Critics say continuity under her relies too heavily on personality."}, {"h": "Narrative Role", "t": "Tamsin represents social cohesion as infrastructure: keeping a region functioning through cultural connection as much as policy."}, {"h": "Notes", "t": "Her influence expands during seasonal gathering cycles."}], "unresolved": []}, {"id": "inhabitant:the-artist", "slug": "the-artist", "label": "The Artist", "category": "inhabitant", "status": "canonical", "themes": ["spontaneous living", "impermanent creation", "quiet reputation", "public mystery"], "path": "inhabitants/the-artist.md", "region": "Veloria City", "parent_region": "", "meta": {"region": "Veloria City", "nature": "human"}, "assets": [], "summary": "The Artist is a well-known figure in Nauw, most often seen in Veloria City, known for painting in cycles of creation, reflection, and deliberate erasure.", "words": 192, "sections": [{"h": "Overview", "t": "The Artist is a well-known figure in Nauw, most often seen in Veloria City, known for painting in cycles of creation, reflection, and deliberate erasure."}, {"h": "Description", "t": "Though many artists live across F432, this inhabitant is specifically known by the self-chosen title **\"The Artist.\"** He is typically described as laid back and unhurried: sitting in a chair, painting, studying what he has made, and then painting over it to begin again.\n\nHe does not meaningfully market or sell his work. The process itself appears to be the purpose.\n\nNo reliable account explains his livelihood, yet he continues to move through city life without visible urgency. Residents commonly encounter him roaming Veloria between painting sessions."}, {"h": "Beliefs About Them", "t": "People in Nauw regard him with a mix of admiration and curiosity. Some see him as an emblem of artistic freedom; others treat him as a local riddle whose discipline is hidden behind casual behavior."}, {"h": "Narrative Role", "t": "The Artist embodies impermanence in a world obsessed with records and survival: making beauty, releasing it, and starting over."}, {"h": "Notes", "t": "Stories that he traveled through Sorel and returned are treated as rumor rather than verified biography."}], "unresolved": []}, {"id": "inhabitant:the-exhibition-resident", "slug": "the-exhibition-resident", "label": "The Exhibition Resident", "category": "inhabitant", "status": "canonical", "themes": ["sustained attention", "silent spectatorship", "gallery belonging"], "path": "inhabitants/the-exhibition-resident.md", "region": "The Sketchy Gallery", "parent_region": "", "meta": {"region": "The Sketchy Gallery", "nature": "bodiless gallery-dwelling resident"}, "assets": [], "summary": "The Exhibition Resident is a known gallery inhabitant type seen as a bodiless head-form that spends long intervals observing artworks in silence.", "words": 116, "sections": [{"h": "Overview", "t": "The Exhibition Resident is a known gallery inhabitant type seen as a bodiless head-form that spends long intervals observing artworks in silence."}, {"h": "Description", "t": "Residents are typically found at edge positions in corridors and corners where light falls across rotating panels. They rarely interact directly, but are consistently present through full exhibition cycles."}, {"h": "Beliefs About Them", "t": "Some curators consider their presence a sign that a cycle has reached true depth of engagement. Others treat them as ordinary gallery locals with unusual physiology."}, {"h": "Narrative Role", "t": "They provide a quiet witness presence in stories about art interpretation, curation disputes, and nonverbal civic participation."}, {"h": "Notes", "t": "The artwork *Exhibition 1* is treated as the clearest portrait reference."}], "unresolved": []}, {"id": "inhabitant:the-three-opinions", "slug": "the-three-opinions", "label": "The Three Opinions", "category": "inhabitant", "status": "canonical", "themes": ["unaligned gossip", "rumor contagion", "social unrest", "opinion without loyalty"], "path": "inhabitants/the-three-opinions.md", "region": "Sorel", "parent_region": "", "meta": {"region": "Sorel", "nature": "traveling conversational trio"}, "assets": [], "summary": "The Three Opinions are a distinctive Sorel-known trio who move together, discuss everything, and refuse to align with any major camp\u2014yet are never short of a verdict.", "words": 375, "sections": [{"h": "Overview", "t": "**The Three Opinions** are a distinctive Sorel-known trio who move together, discuss everything, and refuse to align with any major camp\u2014yet are never short of a verdict."}, {"h": "Description", "t": "F432 race record: commonly classified as **Lineborn** (planar bodies, high-contrast outlines, sketch-like interior texture), though some northern accounts insist they are a single recurring social phenomenon wearing three familiar shapes.\n\nThey are almost never seen apart. Witnesses describe a constant rhythm: one raises a doubt, one repeats it as fact, one adds a detail no one else said aloud.\n\n### The three\n\n| Member | Usual role | How towns describe them |\n|---|---|---|\n| **Brask Kel** | Opens with contradiction | \"The one who heard it wrong on purpose.\" |\n| **Miren Holt** | Restates and amplifies | \"The one who only reports\u2014until everyone believes it.\" |\n| **Tav Renn** | Adds the smile and the extra rumor | \"The one who was not there, but remembers best.\" |\n\nThey carry no declared quarrel with **Hearthvale** or **Driftfall**, nor with exile leadership figures such as **Carrow Vale** or **Vexra Coil**\u2014but they also endorse no one. Their loyalty is to the conversation itself.\n\n### Behavior\n\n- Travel as a set through Sorel towns, camps, and crossing markets.\n- Hold loud, overlapping discussions in public spaces until listeners gather.\n- Spread mixed stories: half-true reports, exaggerated warnings, invented connections, and confident opinions on events they did not witness.\n- Leave without direct violence, yet alter mood: neighbors argue, old grudges reopen, and new suspicions appear overnight.\n\nThey are not treated as criminals in most places. They are treated as **weather**\u2014unwelcome weather that may still arrive tomorrow."}, {"h": "Beliefs About Them", "t": "Some say they are independent persons. Others claim they are a social curse formed wherever exile shame and frontier boredom meet.\n\nA common Sorel saying: **\"Lock your door if you must\u2014but close your ears if they sit down nearby.\"**"}, {"h": "Narrative Role", "t": "The trio functions as a mobile unrest engine: not chaos by force, but instability by speech. They are useful in stories when a settlement needs to fracture **before** any battle, vote, or exile decree."}, {"h": "Notes", "t": "Collective epithets include **the Unsided**, **Kel-Holt-Renn** (spoken as one annoyance), and **Opinion Row** in Driftfall dock slang."}], "unresolved": []}, {"id": "inhabitant:the-unraveled", "slug": "the-unraveled", "label": "The Unraveled", "category": "inhabitant", "status": "rumor", "themes": ["fear", "uncertainty", "absence", "wrong geometry", "rumor"], "path": "inhabitants/the-unraveled.md", "region": "F500 (frequency realm)", "parent_region": "", "meta": {"region": "F500 (frequency realm)", "nature": "unknown"}, "assets": [], "summary": "The Unraveled is the name most often whispered in song, oath, and tavern when speakers mean inhabitants of the F500 abyss\u2014a frequency where place itself fails to hold, and where bodies, names, and intentions are said to come apart in ways that are not quite...", "words": 290, "sections": [{"h": "Overview", "t": "**The Unraveled** is the name most often whispered in song, oath, and tavern when speakers mean **inhabitants of the F500 abyss**\u2014a frequency where **place itself fails to hold**, and where **bodies, names, and intentions** are said to **come apart in ways that are not quite death**."}, {"h": "Description", "t": "**What witnesses claim (inconsistent)**  \nNo reliable portrait exists. The few overlapping threads compare the Unraveled to **motion without mass**, to **a mouth opened where there is no head**, to **a crowd made of a single thread pulled loose**, or to **a presence that is only a sudden wrongness in peripheral vision**\u2014a feeling that the dark **has noticed you and chosen not to show its face yet**.\n\n**Why the name**  \n\u201cUnraveled\u201d implies **a thing that was woven** (identity, time, a soul-line) and is now only **a trailing edge**. The name is an insult, a prayer, and a warning at once.\n\n**Certainty**  \nAcross F432 and wider Dias gossip, there is **no shared proof** of Unraveled biology, language, or society. The category remains **a rumor-bucket** for everything F500 is feared to keep."}, {"h": "Beliefs About Them", "t": "Some traditions insist the Unraveled are **punitive spirits**; others, **natural void fauna**; still others, **misinterpreted void phenomena** with no will at all. The entries contradict each other by design: F500 is a frequency that **eats certitude**."}, {"h": "Narrative Role", "t": "The Unraveled are a **creepy, flexible antagonist-verb** for stories about the abyss: a name to invoke when a tale needs **dread without explanation**."}, {"h": "Notes", "t": "**Status: rumor**\u2014safe to use as folklore, fear-name, and ambiguous silhouette; **do not** treat as confirmed zoology. For visual work, lean **almost-no-form**: **hint, smear, wrong proportion**, not a clean monster design."}], "unresolved": []}, {"id": still measure their own political stance against his declared position."}, {"h": "Beliefs About Them", "t": "Most communities accept Vailor as the anchor of order. A persistent minority distrusts him and follows local leaders instead.\n\nTwo incompatible stories persist around his crown-standard: one says he seized it by overpowering a Singing Fisherman during his rise, while another says it was gifted as recognition of his realm-binding role."}, {"h": "Narrative Role", "t": "Vailor represents centralized realm power and the constant tension between unity and autonomy in F432."}, {"h": "Notes", "t": "The red-sail crown claim is culturally significant but unresolved as established fact."}], "unresolved": ["Resonant Houses"]}, {"id": "inhabitant:valorian-operators", "slug": "valorian-operators", "label": "Valorian Operators", "category": "inhabitant", "status": "canonical", "themes": ["stewardship", "hypertechnology", "realm power", "daily maintenance"], "path": "inhabitants/valorian-operators.md", "region": "Veloria City", "parent_region": "", "meta": {"region": "Veloria City", "nature": "human"}, "assets": [], "summary": "Valorian Operators are what inhabitants of Veloria City call those who tend the central core\u2014named for the operator role above all else. Their only job is to keep the city\u2019s hypertech centerpiece running smoothly. They live in the innermost zone\u2014the small,...", "words": 167, "sections": [{"h": "Overview", "t": "**Valorian Operators** are what inhabitants of Veloria City call those who tend the central core\u2014named for the **operator** role above all else. Their **only job** is to **keep the city\u2019s hypertech centerpiece running smoothly**. They live in the **innermost zone**\u2014the small, immensely powerful circle where technology from **multiple realms** converges to generate and sustain power for Veloria and the wider realm."}, {"h": "Description", "t": "Day to day, each **Valorian Operator** performs whatever tasks the core requires: monitoring, calibration, repair, and coordination of systems that are beyond the understanding of most who live in the outer rings. Their work is specialized and all-consuming; it defines their place in the city\u2019s social and spatial layout."}, {"h": "Beliefs About Them", "t": "Residents of the outer rings often regard Operators with a mixture of dependence, distance, and rumor\u2014few outsiders fully grasp what happens in the core."}, {"h": "Narrative Role", "t": "They embody the link between Veloria\u2019s ancient-feeling periphery and the realm-scale machinery that keeps the city and F432\u2019s present stability possible."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "inhabitant:veil-scribes", "slug": "veil-scribes", "label": "Veil Scribes", "category": "inhabitant", "status": "canonical", "themes": ["timed witnessing", "precision annotation", "truth intervals"], "path": "inhabitants/veil-scribes.md", "region": "F610 (frequency realm)", "parent_region": "", "meta": {"region": "F610 (frequency realm)", "nature": "reveal-phase archivists"}, "assets": [], "summary": "Veil Scribes are F610 recorders trained to capture structural truths during short reveal windows.", "words": 77, "sections": [{"h": "Overview", "t": "Veil Scribes are F610 recorders trained to capture structural truths during short reveal windows."}, {"h": "Description", "t": "They use high-discipline notation protocols to log what appears during reveal phases and what disappears afterward, producing layered records with confidence levels."}, {"h": "Beliefs About Them", "t": "Some praise them as truth keepers; others criticize them for overvaluing brief clarity."}, {"h": "Narrative Role", "t": "They support plotlines where evidence is real but fleeting."}, {"h": "Notes", "t": "Veil records are always phase-stamped to prevent false certainty."}], "unresolved": []}, {"id": "inhabitant:verdant-farmers", "slug": "verdant-farmers", "label": "Verdant Farmers", "category": "inhabitant", "status": "canonical", "themes": ["stewardship", "discipline", "family duty", "food security"], "path": "inhabitants/verdant-farmers.md", "region": "Verdant Reach", "parent_region": "", "meta": {"region": "Verdant Reach", "nature": "human"}, "assets": [], "summary": "Verdant Farmers are the primary agricultural stewards of Verdant Reach in Wabet, responsible for sustaining stable fruit, grain, and crop supply chains across F432.", "words": 163, "sections": [{"h": "Overview", "t": "Verdant Farmers are the primary agricultural stewards of Verdant Reach in Wabet, responsible for sustaining stable fruit, grain, and crop supply chains across F432."}, {"h": "Description", "t": "Their work centers on selecting, growing, nurturing, and protecting orchards and fields in one of the richest cultivation zones in the realm. They are known for discipline, routine, and practical long-term planning rather than rapid extraction.\n\nThe community ethos is straightforward: keep households fed, keep trade flowing, and preserve enough continuity for the next season. In local narratives, they are often described as humble, family-rooted people who measure success through stability rather than status."}, {"h": "Beliefs About Them", "t": "Across nearby regions, Verdant Farmers are regarded as reliable providers whose labor quietly underwrites daily life beyond Verdant Reach itself."}, {"h": "Narrative Role", "t": "They personify the everyday backbone of F432: patient agricultural work that sustains both local families and wider regional interdependence."}, {"h": "Notes", "t": "They are widely described as protective of Verdant Reach's fields and cautious toward opportunistic harvest groups."}], "unresolved": []}, {"id": "inhabitant:vexra-coil", "slug": "vexra-coil", "label": "Vexra Coil", "category": "inhabitant", "status": "canonical", "themes": ["rogue command", "frontier charisma", "volatile hierarchy"], "path": "inhabitants/vexra-coil.md", "region": "Driftfall", "parent_region": "
