orridor priority rule"}, {"h": "Overview", "t": "In Nauw, corridor continuity outranks local advantage during active movement windows."}, {"h": "Description", "t": "When route pressure spikes, administrations prioritize keeping lanes open over maximizing any single district's gain. Delays are redistributed, documented, and compensated later where possible."}, {"h": "Effect", "t": "- Reduces cascading supply failures.\n- Creates recurring political tension with communities that feel deprioritized."}, {"h": "Notes", "t": "Often defended as necessary pragmatism and criticized as quiet centralization."}], "unresolved": []}, {"id": "rule:nauw-outer-rim-mutual-rescue-rule", "slug": "nauw-outer-rim-mutual-rescue-rule", "label": "Nauw Outer Rim mutual rescue rule", "category": "rule", "status": "canonical", "themes": ["maritime solidarity", "risk law", "tide ethics"], "path": "rules/nauw-outer-rim-mutual-rescue-rule.md", "region": "Nauw Outer Rim Seas", "parent_region": "", "meta": {"region": "Nauw Outer Rim Seas", "scope": "outer-rim sea operations"}, "assets": [], "summary": "Nauw Outer Rim mutual rescue rule", "words": 81, "sections": [{"h": "Name", "t": "Nauw Outer Rim mutual rescue rule"}, {"h": "Overview", "t": "Any vessel capable of safe intervention must answer distress within outer-rim range."}, {"h": "Description", "t": "Commercial priority, rival affiliation, and debt status do not void rescue obligation. Salvage claims may be argued later; life support cannot be delayed for contract reasons."}, {"h": "Effect", "t": "- Maintains minimum trust in high-risk waters.\n- Reduces retaliatory refusal cycles between competing crews."}, {"h": "Notes", "t": "Violation marks a captain as unreliable across multiple ports, often permanently."}], "unresolved": []}, {"id": "rule:returning-span-lane-discipline-rule", "slug": "returning-span-lane-discipline-rule", "label": "Returning Span lane discipline rule", "category": "rule", "status": "canonical", "themes": ["lane protocol", "recurrence navigation", "variation control"], "path": "rules/returning-span-lane-discipline-rule.md", "region": "The Returning Span", "parent_region": "", "meta": {"region": "The Returning Span", "scope": "Returning Span path selection and crossing"}, "assets": [], "summary": "Returning Span lane discipline rule", "words": 74, "sections": [{"h": "Name", "t": "Returning Span lane discipline rule"}, {"h": "Overview", "t": "Crossing the Returning Span requires declared lane choice and pass logging."}, {"h": "Description", "t": "Travelers must commit to first, second, or third lane behavior profiles before entry. Unlogged lane switching during drift windows is treated as high-risk negligence."}, {"h": "Effect", "t": "- Increases repeat-route reliability.\n- Provides structured data for Refrain Walker forecasts."}, {"h": "Notes", "t": "\"Unmarked lane change\" is a common root cause in Span incident reports."}], "unresolved": []}, {"id": "rule:sketchy-gallery-open-curation-rule", "slug": "sketchy-gallery-open-curation-rule", "label": "Sketchy Gallery open curation rule", "category": "rule", "status": "canonical", "themes": ["cultural authority", "public curation", "contested taste"], "path": "rules/sketchy-gallery-open-curation-rule.md", "region": "The Sketchy Gallery", "parent_region": "", "meta": {"region": "The Sketchy Gallery", "scope": "gallery programming and exhibition rights"}, "assets": [], "summary": "Sketchy Gallery open curation rule", "words": 84, "sections": [{"h": "Name", "t": "Sketchy Gallery open curation rule"}, {"h": "Overview", "t": "No single patron line may control consecutive major exhibitions beyond one cycle."}, {"h": "Description", "t": "Curatorial authority rotates through declared windows with mandatory public review notes. Patron funding is allowed, but sequence capture is prohibited."}, {"h": "Effect", "t": "- Preserves the gallery as a civic-cultural forum instead of a private brand arm.\n- Produces constant argument over standards, which is considered healthy."}, {"h": "Notes", "t": "The rule protects plurality while preserving Zephan Quell's role as final cycle coordinator."}], "unresolved": []}, {"id": "rule:sorel-second-beginning-right", "slug": "sorel-second-beginning-right", "label": "Sorel second-beginning right", "category": "rule", "status": "canonical", "themes": ["reintegration", "frontier law", "social repair"], "path": "rules/sorel-second-beginning-right.md", "region": "Sorel", "parent_region": "", "meta": {"region": "Sorel", "scope": "Sorel settlement and civic status"}, "assets": [], "summary": "Sorel second-beginning right", "words": 82, "sections": [{"h": "Name", "t": "Sorel second-beginning right"}, {"h": "Overview", "t": "Sorel law recognizes that previous failure or exile does not permanently void civic worth."}, {"h": "Description", "t": "Settlements may impose terms and probation, but they must provide a defined path back to participation. Permanent exclusion requires explicit, documented cause tied to ongoing harm."}, {"h": "Effect", "t": "- Converts frontier volatility into renewable social structure.\n- Keeps labor and trust networks from collapsing into endless revenge cycles."}, {"h": "Notes", "t": "This right is celebrated in Hearthvale and contested in harder-line enclaves."}], "unresolved": []}, {"id": "rule:the-light-after-shared-laughter", "slug": "the-light-after-shared-laughter", "label": "The light after shared laughter", "category": "rule", "status": "rumor", "themes": ["social ease", "relief", "belonging", "happiness", "disputed science"], "path": "rules/the-light-after-shared-laughter.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)", "scope": "F432 (reported experience; not universal)"}, "assets": [], "summary": "The light after shared laughter", "words": 234, "sections": [{"h": "Name", "t": "The light after shared laughter"}, {"h": "Overview", "t": "Across **F432**, a **soft, disputed pattern** is often discussed in taverns, schools, and market sociology notes: when a **group of strangers** (or near-strangers) shares a **genuine, unperformed laugh** in an open, crowded place, many participants report the **next little while** as **milder**\u2014hassle feels smaller, colors feel a touch **brighter in memory** afterward, and people are more likely to **yield** in line or **wave** someone forward."}, {"h": "Description", "t": "The effect is not reliable enough to be a **law of physics**; it is reliable enough to be a **shared folk observation**. Studies disagree on mechanism: endorphins, social bonding, or simple **mood carry**.\n\nCritics call it **wishful pattern-matching** after a good day. Proponents do not care\u2014they keep collecting stories like coins.\n\n**Nothing here coerces** anyone to laugh, nor does the pattern privilege any group: it is **happily trivial**, which is the point."}, {"h": "Effect", "t": "- **In-world \u201ceffect\u201d (reported, inconsistent):** short-lived **emotional afterglow** and slightly **easier** social navigation for a period measured in **minutes to an hour**, not days.  \n- **Out-of-universe use:** a gentle rule-of-thumb for writing **uplift** without inventing a new superpower."}, {"h": "Notes", "t": "**Status: rumor** keeps it **opt-in** for strict setting logic. If you need hard nullification, call it **placebo and weather**. The rule exists to **name joy as something the world can lean toward**, not a mandate."}], "unresolved": []}, {"id": "rule:unfinished-persistence-scale-rule", "slug": "unfinished-persistence-scale-rule", "label": "Unfinished persistence scale rule", "category": "rule", "status": "canonical", "themes": ["persistence tracking", "iterative cartography", "revision literacy"], "path": "rules/unfinished-persistence-scale-rule.md", "region": "The Unfinished", "parent_region": "", "meta": {"region": "The Unfinished", "culture": "The Open Hand of Making", "scope": "The Unfinished sector mapping and route confidence"}, "assets": [], "summary": "Unfinished persistence scale rule", "words": 74, "sections": [{"h": "Name", "t": "Unfinished persistence scale rule"}, {"h": "Overview", "t": "Map claims in The Unfinished must include persistence class, not just location."}, {"h": "Description", "t": "Routes and structures are tagged as fleeting, unstable, holding, steady, or enduring based on repeated pass confirmation. Position without persistence is treated as insufficient navigation data."}, {"h": "Effect", "t": "- Enables useful movement in revising terrain.\n- Prevents false certainty from single-pass maps."}, {"h": "Notes", "t": "This rule underpins Draftkin map pedagogy across scaffold sectors."}], "unresolved": []}, {"id": "rule:veloria-ring-clearance-rule", "slug": "veloria-ring-clearance-rule", "label": "Veloria ring clearance rule", "category": "rule", "status": "canonical", "themes": ["layered access", "urban control", "systems safety"], "path": "rules/veloria-ring-clearance-rule.md", "region": "Veloria City", "parent_region": "", "meta": {"region": "Veloria City", "culture": "Velorian Ring Protocol", "scope": "Veloria inter-ring movement"}, "assets": [], "summary": "Veloria ring clearance rule", "words": 73, "sections": [{"h": "Name", "t": "Veloria ring clearance rule"}, {"h": "Overview", "t": "Movement between Veloria rings is permission-graded by role, timing, and system load."}, {"h": "Description", "t": "Inner-ring access requires matching clearance to purpose. During stress windows, clearance narrows automatically and nonessential crossings are deferred."}, {"h": "Effect", "t": "- Protects core infrastructure from chaotic surges.\n- Reinforces perceptions of classed or opaque governance."}, {"h": "Notes", "t": "The rule is framed as safety engineering by officials and as social filtering by critics."}], "unresolved": []}, {"id": "rule:velorian-basin-open-ledger-rule", "slug": "velorian-basin-open-ledger-rule", "label": "Velorian Basin open-ledger rule", "category": "rule", "status": "canonical", "themes": ["market trust", "transparency", "exchange continuity"], "path": "rules/velorian-basin-open-ledger-rule.md", "region": "Velorian Basin", "parent_region": "", "meta": {"region": "Velorian Basin", "scope": "Basin trade mediation and dispute handling"}, "assets": [], "summary": "Velorian Basin open-ledger rule", "words": 78, "sections": [{"h": "Name", "t": "Velorian Basin open-ledger rule"}, {"h": "Overview", "t": "Basin trade disputes are resolved in visible records before private settlements are accepted."}, {"h": "Description", "t": "Parties may negotiate privately, but final obligations must be logged in shared ledger formats available to ward mediators. Hidden clauses are unenforceable in civic courts."}, {"h": "Effect", "t": "- Lowers fraud repeat rates.\n- Encourages informal trust circles to interface with formal process."}, {"h": "Notes", "t": "This rule helps explain why Basin commerce remains high-volume without constant collapse."}], "unresolved": []}, {"id": "rule:verdant-reach-third-chair-rule", "slug": "verdant-reach-third-chair-rule", "label": "Verdant Reach third-chair rule", "category": "rule", "status": "canonical", "themes": ["reconciliation", "household governance", "social resilience"], "path": "rules/verdant-reach-third-chair-rule.md", "region": "Verdant Reach", "parent_region": "", "meta": {"region": "Verdant Reach", "scope": "Verdant Reach domestic and mediation custom"}, "assets": [], "summary": "Verdant Reach third-chair rule", "words": 72, "sections": [{"h": "Name", "t": "Verdant Reach third-chair rule"}, {"h": "Overview", "t": "Formal mediation meals in Verdant Reach are set with one unassigned seat."}, {"h": "Description", "t": "The unassigned chair represents return possibility for absent stakeholders. Agreements finalized without offering this seat can be contested as procedurally incomplete."}, {"h": "Effect", "t": "- Keeps disputes from hardening into permanent exclusion.\n- Embeds reconciliation logic into ordinary routine."}, {"h": "Notes", "t": "The rule is practical, not sentimental: it creates recurring opportunity windows."}], "unresolved": []}, {"id": "rule:wabet-reciprocity-harvest-rule", "slug": "wabet-reciprocity-harvest-rule", "label": "Wabet reciprocity harvest rule", "category": "rule", "status": "canonical", "themes": ["stewardship", "reciprocity", "ecological limits"], "path": "rules/wabet-reciprocity-harvest-rule.md", "region": "Wabet", "parent_region": "", "meta": {"region": "Wabet", "scope": "Wabet cultivation and extraction practice"}, "assets": [], "summary": "Wabet reciprocity harvest rule", "words": 76, "sections": [{"h": "Name", "t": "Wabet reciprocity harvest rule"}, {"h": "Overview", "t": "In Wabet, extraction without restoration is treated as illegitimate use of land."}, {"h": "Description", "t": "Every major harvest action must include a restoration commitment, whether soil rest, water channel repair, seed return, or labor exchange. Repeated one-way taking results in access loss."}, {"h": "Effect", "t": "- Keeps long-cycle fertility stable.\n- Slows short-term scaling and speculative exploitation."}, {"h": "Notes", "t": "This rule anchors Wabet's reputation for survivable abundance rather than maximum yield."}], "unresolved": []}, {"id": "story:first-day-in-veloria", "slug": "first-day-in-veloria", "label": "First Day in Veloria", "category": "story", "status": "canonical", "themes": ["first contact", "civic awe", "layered reality", "ordinary wonder", "orientation narrative"], "path": "stories/first-day-in-veloria.md", "region": "Veloria City", "parent_region": "", "meta": {"region": "Veloria City", "story_type": "onboarding vignette"}, "assets": [], "summary": "A newcomer enters Veloria City for the first time and learns, in a single day, that Dias is less a map and more a layered agreement between memory, frequency, and daily practice.", "words": 501, "sections": [{"h": "Premise", "t": "A newcomer enters Veloria City for the first time and learns, in a single day, that Dias is less a map and more a layered agreement between memory, frequency, and daily practice."}, {"h": "Story", "t": "By sunrise, the road to Veloria was already crowded.\n\nCarts leaned under produce, brass parts, and folded cloth; walkers moved in clusters and singles, everyone keeping enough lane for strangers to pass without argument. At the DEB Gate, a woman in travel-gray touched the stone frame with two fingers before stepping through, as if greeting an old host.\n\n\"First time?\" she asked me.\n\nI nodded.\n\n\"Then look up before you look in.\"\n\nAbove the city, the Sky Drifters moved like pale figures cut from cloud-light, too high to name and too steady to dismiss. Nobody screamed. Nobody ran. A boy beside me pointed once, then returned to counting copper marks into his mother's palm.\n\nInside the first ring, Veloria felt older than my grandmother's stories: stonework, hand tools, market bells, thick bread smoke. By midday, one ring inward, the streets changed shape and rhythm. Glass fronts. Cleaner lines. Faster talk. By late afternoon in the third ring, I passed service drones carrying crate-stacks between towers while a street singer performed a centuries-old tide song to a crowd that filmed her on wrist-screens.\n\n\"Same city,\" a porter said, seeing me stare. \"Different layer of it.\"\n\nNear evening, the outer light went gold over the basin and every surface seemed briefly polished from within. Even the paving seams held a warm line, thin as thread. People kept walking, but slower, like they all recognized the same minute and did not want to bruise it.\n\nIn a tea stand queue, two merchants argued over payment rates, then settled by converting to VEL marks at the posted board without insult or delay. No one celebrated. No one sulked. Trade moved on.\n\nWhen darkness came, the core towers brightened.\n\nFrom a ridge lane I could see the innermost district: compact, severe, and radiant. It did not glow like festival light; it pulsed like work in progress. Someone beside me said the Valorian Operators would be deep in shift by now, balancing loads most of us would never understand, keeping the city's heart from skipping.\n\n\"You thought Dias was one place?\" the tea seller asked as she locked her window.\n\n\"I did this morning.\"\n\nShe smiled at that, not unkindly.\n\n\"It's one world. That is not the same thing.\"\n\nI slept above a workshop in the second ring, and just before dawn I woke to a distant harmonic thrum that seemed to come from every direction at once.\n\nOn my first day in Veloria, nobody explained Dias to me.\n\nThey only lived it in front of me, layer by layer, until the idea became impossible to mistake."}, {"h": "Canon References", "t": "- Core world: [`world/dias.md`](../world/dias.md)\n- Realm context: [`regions/f432-frequency-realm.md`](../regions/f432-frequency-realm.md)\n- Region context: [`regions/nauw.md`](../regions/nauw.md)\n- Anchor city: [`regions/veloria-city.md`](../regions/veloria-city.md)\n- Trade signal: [`cultures/vel-mark-trade-standard.md`](../cultures/vel-mark-trade-standard.md)"}], "unresolved": []}, {"id": "story:ledger-addendum-of-f120-f380-f610-and-f840", "slug": "ledger-addendum-of-f120-f380-f610-and-f840", "label": "Ledger addendum of F120 F380 F610 and F840", "category": "story", "status": "unknown", "themes": ["incremental discovery", "archival conflict", "names before maps", "background cosmology"], "path": "stories/ledger-addendum-of-f120-f380-f610-and-f840.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)", "story_type": "archival fragment"}, "assets": [], "summary": "After the first rumor cycle around F200/F500, a quieter archival wave claimed a second ledger addendum naming four less dramatic but narratively significant bands: F120, F380, F610, and F840.", "words": 386, "sections": [{"h": "Premise", "t": "After the first rumor cycle around F200/F500, a quieter archival wave claimed a second ledger addendum naming four less dramatic but narratively significant bands: F120, F380, F610, and F840."}, {"h": "Story", "t": "The \"tower copy\" version says a clerk in Veloria found a folded leaf tucked behind maintenance tables, labeled only as supplemental harmonics and marked for internal circulation.\n\nThe \"quay copy\" version says a navigator from Nauw Outer routes brought in a water-stiff page whose ink separated into four color families when dried by hearth heat, each line matching one of the four band descriptors.\n\nA third version insists the addendum was intentionally downplayed by officials because it added complexity without immediate policy utility: useful for scholars and storytellers, inconvenient for budget committees.\n\nSome city archive notes claim the addendum survived because different race guilds found different value in it: **Veyrin** pattern-readers used it for trait comparison logs, **Kharad** route planners used it for resilience planning, and **Palewind Swarms** used it to tag coordination risks across changing conditions.\n\nWhatever the source, the effect in F432 was durable: those four bands entered language as **background truths with partial evidence**\u2014enough to shape metaphor, ritual, and long-form story architecture without demanding full expedition programs.\n\n**The F960 line (same rumor cycle, thinner evidence).** A fourth narrative strain notes that some leaves or shop copies of the addendum also carry a **fifth** entry\u2014**F960**\u2014or only a penciled margin gloss (*unfinished*), sometimes in a hand that does not match the four-band block. The line is **often absent**, sometimes **erased**, and where it exists it tracks **\"iterative\"** language familiar from **The Half-Made Atlas** talk: a band that behaves less like a fixed neighbor and more like a **map still negotiating its coastline**. F432 does not need to agree on whether F960 belongs on the *same* page as the four; the ledger\u2019s job is to show that the **notation spread in waves**, and that **F200 / F500 / the four / F960** are all *named* in the archive gossip\u2014each step less tidy than the one before."}, {"h": "Notes", "t": "Pairs with the **Supplemental Harmonic Ledger Leaf** as artifact-story dual framing. For the **in-world sequence** of fragments (F200+500 \u2192 four-band supplemental \u2192 optional F960), see the leaf\u2019s *In-world catalog sequence* section."}], "unresolved": []}, {"id": "story:ledger-mention-of-f200-and-f500", "slug": "ledger-mention-of-f200-and-f500", "label": "Ledger mention of F200 and F500", "category": "story", "status": "unknown", "themes": ["discovery", "incomplete record", "witness pressure", "names without maps"], "path": "stories/ledger-mention-of-f200-f500.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)", "story_type": "archival fragment"}, "assets": [], "summary": "F432 did not discover F200 and F500 the way a survey discovers a cove. It inherited hints, then named them under pressure from sensory oddities, traveler babble, and a few contested documents. The ledger mention is the story\u2019s compressed name for that proce...", "words": 380, "sections": [{"h": "Premise", "t": "F432 did not **discover** F200 and F500 the way a survey discovers a cove. It **inherited hints**, then **named** them under pressure from **sensory oddities, traveler babble, and a few contested documents**. The **ledger mention** is the story\u2019s compressed name for that process: a **sealed appendix**, a **harbor log marginalia**, a **ring-city filing**\u2014sources conflict."}, {"h": "Story", "t": "The version told most often in Nauw runs like this:\n\nA **clerk or junior resonance-tuner** in Veloria\u2019s older filing towers finds an entry that does not belong in the day\u2019s work: a line appended to a **resonance-audit sheet**, in ink too crisp for the page\u2019s age, listing **F200** and **F500** with two-word cautions. The sheet is resealed, copied badly, and leaked as gossip.\n\nThe version told on the quays is simpler:\n\nA **sailor** came back **wrong in the ears**\u2014weeks of hearing a **hiss where silence should be**\u2014and sketched a **two-column diagram** in the margins of a **cargo manifest**. The numbers were not the sailor\u2019s own hand; the sailor swore the sketch **arrived in sleep**. The manifest later becomes **Partial Harmonic Index** talk.\n\nA third version, favored by those who like shame:\n\nAn **academic in good standing** mistook a **bleed day** for equipment failure, wrote a **formal error report** naming **\u201cmirror harmonics at 200/500 (folk designation)\u201d**, and thereby **accidentally** gave the realm clean labels for whispers that already had teeth.\n\nIn later retellings, copyists from different race communities annotate the same chain differently: some **Human** harbor clerks prioritize route risk, some **Lineborn** copy houses preserve symbol fidelity over prose, and some **Choirglass** recorders add tonal marks to indicate stress in witness testimony.\n\nWhichever version you believe, the outcome is the same: **F200 and F500 exist in F432\u2019s language** before they exist in F432\u2019s **competence**. The realm knows enough to be **afraid, curious, and half-right**."}, {"h": "Notes", "t": "**Status: unknown** preserves competing discovery paths; a future definitive witness scene can **elevate** one strand without erasing the rumor ecology. Later archive talk treats this entry as **precursor** to the quieter **four-band addendum** (F120, F380, F610, F840) and, in some transcriptions, a **fifth, sparser** wave naming **F960** (often absent or struck through\u2014see the **Supplemental Harmonic Ledger Leaf** in-world **catalog sequence**)."}], "unresolved": []}, {"id": "story:ledger-of-the-still-march", "slug": "ledger-of-the-still-march", "label": "Ledger of the still march", "category": "story", "status": "unknown", "themes": ["official record", "unexplained", "roads", "institutional unease"], "path": "stories/ledger-of-the-still-march.md", "region": "Nauw", "parent_region": "", "meta": {"region": "Nauw", "story_type": "archival fragment"}, "assets": [], "summary": "Velorian archivists and Marchbound scribes are said to keep a discontinuous file\u2014the still march ledger\u2014of Brindle March stillness episodes: timestamps, weather notes, and witness ranks. The file is not published in full; excerpts leak as half-pages in mark...", "words": 198, "sections": [{"h": "Premise", "t": "Velorian archivists and **Marchbound** scribes are said to keep a discontinuous file\u2014**the still march ledger**\u2014of **Brindle March stillness** episodes: timestamps, weather notes, and witness ranks. The file is not published in full; excerpts leak as **half-pages** in market rumor."}, {"h": "Story", "t": "The most-circulated excerpt describes an afternoon when **Glasswater** windmills, visible from a mid-march overpass, **appeared to hold their blades** in the same few degrees of arc for longer than physics-lazy observers thought possible. Horses did not stop, people insist; only **sound** and **certainty** did.\n\nA marginal note\u2014signature scratched out\u2014allegedly records **Bren Holloway** ordering a **charm re-tension** on three adjacent spans, not because they had failed, but because **\"the old wards had gone threadbare in the hush.\"** Whether that order happened is disputed. Whether it helped is unknowable.\n\nThe ledger\u2019s purpose, if the file exists, is not to *explain* stillness, but to prove **Nauw noticed**\u2014that a realm built on **trade flow** can admit **flow interrupted** without collapsing into superstition unfiltered."}, {"h": "Notes", "t": "**Status: unknown** keeps the ledger\u2019s material existence optional. A future story can show the real book, a fake, or a **Prime echo** in the binding without breaking prior lines."}], "unresolved": []}, {"id": "story:the-afternoon-the-ball-kept-going", "slug": "the-afternoon-the-ball-kept-going", "label": "The afternoon the ball kept going", "category": "story", "status": "canonical", "themes": ["play", "crowd joy", "ordinary love", "summer", "belonging"], "path": "stories/the-afternoon-the-ball-kept-going.md", "region": "Velorian Basin", "parent_region": "", "meta": {"region": "Velorian Basin", "story_type": "scene"}, "assets": [], "summary": "A widely liked basin story\u2014treated as true in spirit even when details differ\u2014says that one slow afternoon, a boy and his dog at the field edge drew a growing audience without meaning to, until the whole patch of green became a game: throw, run, return, unt...", "words": 219, "sections": [{"h": "Premise", "t": "A widely liked **basin** story\u2014treated as true in spirit even when details differ\u2014says that one slow afternoon, a boy and his dog at the field edge drew a **growing audience** without meaning to, until the whole patch of green became a game: **throw, run, return**, until strangers were passing the ball, parents were clapping, and someone brought **water in cups** like a festival nobody had scheduled."}, {"h": "Story", "t": "Andrew and Russell are not always named. Sometimes it is a pair of sisters and a stick. Sometimes a retiree and a lopsided wagon wheel. The shared beat is the same: **the ball did not stop because anyone important arrived**; it stopped only when the **light** said so\u2014golden, tired, kind.\n\nChildren remember it as the day the basin felt **round**\u2014a circle of faces without rank. A merchant later swore he closed his stall an hour early and **earned more** the next day for goodwill alone (people argue whether that is economics or just **happier math**).\n\nNo one was hurt. No lesson was announced. A few songs started anyway."}, {"h": "Notes", "t": "**Canonical** in the sense of **emotional fact** in Velorian life; not tied to a single date. Pairs with **Andrew and Russell** and the **Boy and His Dog** artwork as **low-conflict, high-warmth** F432."}], "unresolved": []}, {"id": "story:the-blind-eyes-vigil", "slug": "the-blind-eyes-vigil", "label": "The Blind Eyes Vigil", "category": "story", "status": "unknown", "themes": ["witness discipline", "rumor control", "truth under pressure"], "path": "stories/the-blind-eyes-vigil.md", "region": "Averra Isle", "parent_region": "", "meta": {"region": "Averra Isle", "story_type": "witness protocol fragment"}, "assets": [], "summary": "Averra watchers are said to keep a night protocol where witnesses sit in paired rotation and report only what both can confirm.", "words": 148, "sections": [{"h": "Premise", "t": "Averra watchers are said to keep a night protocol where witnesses sit in paired rotation and report only what both can confirm."}, {"h": "Story", "t": "A common account describes a storm week when harbor rumors outran facts and mainland panic traders began doubling prices. The isle's watchers opened a blind-eyes vigil: two seats, one bell, one slate. No witness statement entered record unless mirrored by the paired observer before the bell interval closed.\n\nBy dawn, half the circulating claims had collapsed under cross-check. The remaining notes were plain, short, and unexpectedly calm: two lights, one ship, no landing, no fire.\n\nThe protocol spread beyond Averra as a phrase in Nauw clerks' speech - \"blind eyes first\" - meaning verify twice before amplifying fear."}, {"h": "Notes", "t": "Often cited with **Blind Eyes** and **The Two Pillars Witness** when examining how public myth can coexist with practical information hygiene."}], "unresolved": []}, {"id": "story:the-load-balance-trial", "slug": "the-load-balance-trial", "label": "The Load-Balance Trial", "category": "story", "status": "unknown", "themes": ["accountability ritual", "burden sharing", "transit ethics", "public adjudication"], "path": "stories/the-load-balance-trial.md", "region": "Brindle March", "parent_region": "", "meta": {"region": "Brindle March", "story_type": "civic practice fragment"}, "assets": [], "summary": "A Brindle March civic practice says that when corridor policy deadlocks, the disputing parties must submit to a public \"load-balance trial\" before terms are ratified.", "words": 163, "sections": [{"h": "Premise", "t": "A Brindle March civic practice says that when corridor policy deadlocks, the disputing parties must submit to a public \"load-balance trial\" before terms are ratified."}, {"h": "Story", "t": "In one frequently repeated case, two guild blocs argued for six nights over whose crews would carry winter risk on the south span. Instead of another sealed-room vote, march wardens set a beam frame in the crossing court and required each side to name what burden they believed was \"equal.\"\n\nThe declared loads looked symmetrical on paper. Under real route conditions, one side's burden collapsed in the first storm week while the other held with minor loss. The trial did not pick winners by drama; it forced policy to match weight as lived, not weight as claimed.\n\nSince then, \"balance trial\" has become shorthand in Brindle governance for proving fairness under stress rather than announcing it in speeches."}, {"h": "Notes", "t": "This practice is referenced when discussing **Balance 1** as both artwork and policy icon."}], "unresolved": []}, {"id": "story:the-night-of-the-wall-of-eyes", "slug": "the-night-of-the-wall-of-eyes", "label": "The Night of the Wall of Eyes", "category": "story", "status": "canonical", "themes": ["scrutiny", "fear management", "evidence discipline"], "path": "stories/the-night-of-the-wall-of-eyes.md", "region": "The Glassfold Ledge", "parent_region": "", "meta": {"region": "The Glassfold Ledge", "story_type": "witness log narrative"}, "assets": [], "summary": "An escort team crossing the Ledge at reveal interval reports a full wall-tracking event and must decide whether to retreat, panic, or document.", "words": 184, "sections": [{"h": "Premise", "t": "An escort team crossing the Ledge at reveal interval reports a full wall-tracking event and must decide whether to retreat, panic, or document."}, {"h": "Story", "t": "The first watcher thought it was painted ornament.\n\nThen the eyes shifted.\n\nRows of gold irises rolled in the same direction as the team moved, then stopped when they stopped. No mouths, no sound, no mechanism. Just attention.\n\n\"Keep lane. No running,\" said the lead scribe, though her voice had thinned to wire.\n\nTwo couriers wanted to bolt back downslope. One had already turned when the scribe called out timestamps, confidence levels, and line-of-sight references into her recorder. Naming the data steadied the group enough to keep formation.\n\nAt the final marker, the wall emptied. Purple stone. No eyes.\n\nBy dawn, three witnesses swore the event was warning. Two swore it was reflection error. The record was filed anyway, stamped and complete.\n\nNo policy changed that week.\n\nBut no one on that route mocked phase discipline again."}, {"h": "Notes", "t": "Frequently taught as an example of composure under perceptual stress in F610-adjacent training contexts."}], "unresolved": []}, {"id": "story:the-table-vase-warning", "slug": "the-table-vase-warning", "label": "The Table Vase Warning", "category": "story", "status": "unknown", "themes": ["domestic omen", "social care", "subtle alarm", "urban ritual"], "path": "stories/the-table-vase-warning.md", "region": "Velorian Basin", "parent_region": "", "meta": {"region": "Velorian Basin", "story_type": "social rumor fragment"}, "assets": [], "summary": "A Basin rumor says that when a bright flower pot is brought indoors and the petals begin falling before dawn, the household is not cursed; it is being warned that someone inside is carrying unspoken strain.", "words": 190, "sections": [{"h": "Premise", "t": "A Basin rumor says that when a bright flower pot is brought indoors and the petals begin falling before dawn, the household is not cursed; it is being warned that someone inside is carrying unspoken strain."}, {"h": "Story", "t": "In one commonly repeated version, a market family set a patterned street vase on the table after a successful week. By evening the flowers bowed. By midnight, three petals were on the wood. No storm came, no theft, no omen-light in the sky.\n\nAt dawn, an elder asked no prophecy questions at all. Instead she asked who had stopped sleeping, who had stopped eating with the others, and who had started saying \"fine\" too quickly. Before midday the house had shifted duties, reduced pressure, and reopened a conversation that should have happened sooner.\n\nAfter that, neighbors began treating the table vase less as decoration and more as a social check: if blooms fail too fast, ask who is carrying too much."}, {"h": "Notes", "t": "The story is usually told as practical Basin wisdom rather than supernatural doctrine. It aligns with F432 traditions that convert everyday objects into civic care signals."}], "unresolved": []}, {"id": "story:the-third-chair-breakfast", "slug": "the-third-chair-breakfast", "label": "The Third-Chair Breakfast", "category": "story", "status": "unknown", "themes": ["reconciliation", "table ritual", "community continuity"], "path": "stories/the-third-chair-breakfast.md", "region": "Verdant Reach", "parent_region": "", "meta": {"region": "Verdant Reach", "story_type": "domestic custom fragment"}, "assets": [], "summary": "A Verdant Reach custom says morning tables should be set with one more chair than confirmed guests.", "words": 153, "sections": [{"h": "Premise", "t": "A Verdant Reach custom says morning tables should be set with one more chair than confirmed guests."}, {"h": "Story", "t": "One old telling begins after a season of boundary disputes. Two families who had stopped speaking still traded irrigation duty through intermediaries, each claiming they were done with the other forever. An elder kept setting three chairs for a two-person breakfast anyway.\n\nFor nine days the third chair stayed empty. On the tenth, the missing cousin arrived before sunrise, silent and exhausted, and sat without announcement. No speeches were made. Bread was passed. Work lists were updated. By noon the feud had not vanished, but it had changed shape from rupture to repair.\n\nSince then, \"leave the third chair\" in Verdant Reach means: hold practical room for return before pride hardens into permanent loss."}, {"h": "Notes", "t": "Often paired with **Breakfast 1** as a visual shorthand for reconciliation-by-routine rather than dramatic apology scenes."}], "unresolved": []}, {"id": "story:the-whisper-field-at-bloomline", "slug": "the-whisper-field-at-bloomline", "label": "The Whisper Field at Bloomline", "category": "story", "status": "canonical", "themes": ["social weather", "rumor pressure", "pre-decision tension"], "path": "stories/the-whisper-field-at-bloomline.md", "region": "The Bloomline Estuary", "parent_region": "", "meta": {"region": "The Bloomline Estuary", "story_type": "civic confluence vignette"}, "assets": [], "summary": "A mediation team arrives at a holding cove to settle a trade dispute, but the ground itself answers with a field of talking heads before any formal words are spoken.", "words": 222, "sections": [{"h": "Premise", "t": "A mediation team arrives at a holding cove to settle a trade dispute, but the ground itself answers with a field of talking heads before any formal words are spoken."}, {"h": "Story", "t": "By the time the delegates reached the cove, the air was already thick with voices.\n\nAt first they thought the sound came from the crowd. Then necks began to rise from the soft ground in pale arcs, each ending in a face mid-sentence. One laughed too loudly. One repeated a rumor no one had said aloud. One leaned over another and whispered a private fear into open space.\n\nThe Tideheart lead lifted her palm and asked everyone to stand still.\n\n\"Not yet,\" she said. \"The field is speaking faster than we are.\"\n\nFor twelve minutes no contract was touched. Teams listened as the Converse Heads cycled through accusation, apology, mockery, and relief in restless succession. When the voices finally thinned, the delegates sat, rewrote two terms, and removed one penalty clause both sides had pretended to accept.\n\nAt sunset the cove quieted. The last neck lowered into the mud as if no one had ever been there.\n\nThe agreement held for three seasons."}, {"h": "Notes", "t": "Used in Bloomline governance training as a case where social-tone stabilization prevented a fragile treaty from failing in its first week."}], "unresolved": []}, {"id": "story:whispers-before-signing", "slug": "whispers-before-signing", "label": "Whispers Before Signing", "category": "story", "status": "rumor", "themes": ["rumor pressure", "contract integrity", "social tone governance"], "path": "stories/whispers-before-signing.md", "region": "The Bloomline Estuary", "parent_region": "", "meta": {"region": "The Bloomline Estuary", "story_type": "civic rumor fragment"}, "assets": [], "summary": "A recurring Bloomline rumor says no treaty survives when signed while the whisper field is still active.", "words": 137, "sections": [{"h": "Premise", "t": "A recurring Bloomline rumor says no treaty survives when signed while the whisper field is still active."}, {"h": "Story", "t": "Two delegations arrived with terms already drafted and witnesses already chosen.\n\nBy the second hour, the Converse Heads had risen in a ring around the cove, repeating half-finished accusations and private worries neither side admitted in formal session. One envoy insisted on immediate signatures \"before mood gets worse.\" The Tideheart recorder refused, citing hold protocol.\n\nIn the rumor version, they sign anyway.\n\nBy dawn the agreement had split into three competing interpretations, each claiming different intent from the same ink. Since then, people repeat one line whenever voices thicken before a contract:\n\n\"If the field is still whispering, the page is not ready.\""}, {"h": "Notes", "t": "Commonly cited as cautionary oral precedent for enforcing pre-sign stabilization intervals."}], "unresolved": []}, {"id": "symbol:curious-arch", "slug": "curious-arch", "label": "Curious Arch", "category": "symbol", "status": "canonical", "themes": ["sacred orientation", "disciplined inquiry", "crossing commitment"], "path": "symbols/curious-arch.md", "region": "The Returning Span", "parent_region": "", "meta": {"region": "The Returning Span"}, "assets": [], "summary": "Curious Arch is a sacred geometric symbol used in Returning Span crossing rites to mark the transition from indecision to committed movement.", "words": 102, "sections": [{"h": "Overview", "t": "Curious Arch is a sacred geometric symbol used in Returning Span crossing rites to mark the transition from indecision to committed movement."}, {"h": "Meaning", "t": "The rising pillar signifies focused ascent, the angled crown marks chosen direction, and the hooked line with sphere represents curiosity held within discipline rather than allowed to scatter."}, {"h": "Usage", "t": "Displayed at lane-entry points and invoked before major crossings. Travelers are taught to \"pass under the question, then choose.\""}, {"h": "Lore Connection", "t": "The symbol is visually codified in the artwork *Curious 1* and commonly taught alongside lane-discipline doctrine."}, {"h": "Notes", "t": "Used as a stabilizing emblem in high-drift decision environments."}], "unresolved": []}, {"id": "world:dias", "slug": "dias", "label": "Dias", "category": "world", "status": "canonical", "themes": ["frequency", "layered reality", "resonance", "origin", "lost history"], "path": "world/dias.md", "region": "", "parent_region": "", "meta": {}, "assets": [], "summary": "Dias is the world in which all known existence unfolds.", "words": 478, "sections": [{"h": "Overview", "t": "Dias is the world in which all known existence unfolds."}, {"h": "Core Premise", "t": "In this universe, reality is shaped not only by matter and time but also by **frequency**. Different layers of reality resonate at different frequencies, forming what are commonly called **frequency realms**. These realms coexist within the same cosmic space but normally remain separate from one another.\n\nThe exact number of frequencies that exist in Dias is unknown. Scholars, travelers, and explorers have only encountered a small portion of them. Each frequency may host its own landscapes, inhabitants, and laws of reality. Because of this structure, movement between realms is not necessarily a matter of distance but may involve changes in resonance or frequency."}, {"h": "The Prime Realm and the Fracture", "t": "Before the Frequencies, there was only **The Prime Realm**\u2014a single unified reality. At some unknown point in the distant past, an event now known as **The Fracture** shattered that unity, separating reality into vibrational states of itself. These states became the Frequencies.\n\nNo living being witnessed the Prime Realm, and no surviving record fully explains why the Fracture happened. The separation is treated as historical fact; the cause remains unknown.\n\nThe time before the Fracture is referred to as **The Prime Age**. The era after is commonly called **The Present Age**."}, {"h": "Global Lore", "t": "Known frequency realms documented so far include **F432** (material-like stability), **F200** (high-luminosity harmonic light), **F500** (the abyssal null band), and **F960** (iterative emergence and nonfinal form). Additional partially indexed bands now circulating in records include **F120** (echo), **F380** (hearttide), **F610** (reveal intervals), and **F840** (ember recovery); many others may exist uncharted. Awareness of neighboring bands within F432 remains **uneven and incomplete**: names and omens can travel on leaked resonance, rumor, and partial records long before any frequency becomes fully legible to another.\n\nAcross the Frequencies, scattered ruins and **Prime Relics** hint that parts of reality once belonged to a single world. One of the most discussed remnants is **The Prime Bridge**, a fragmented structure believed to persist as partial echoes across multiple Frequencies.\n\nAlongside weightier tales, F432 in particular also carries **small, happy patterns**\u2014shared sunlight myths, market laughter, and road gratitude\u2014treated as part of the **same** Dias, not a separate \u201csoft AU.\u201d\n\nAcross different cultures and realms, many myths attempt to explain the Fracture. Some claim it was a natural cosmic event; others blame a forgotten civilization, betrayal, war, or a resonance threshold the Prime Realm could not contain. Other tales widen the frame further\u2014**The Census Echoes of the Prime Mark** imagines a pre-Fracture **tally of resonance and category** (in those tellings, about **reality\u2019s harmonics**, not the counting of people as chattel), and even stable, trade-heavy F432 sometimes records strange **road-scale pauses** (see **Brindle March stillness**) that feel, to some, like an echo of that older order reasserting a rhythm."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "world:the-fracture", "slug": "the-fracture", "label": "The Fracture", "category": "world", "status": "canonical", "themes": ["shattering", "resonance", "mystery", "layered reality"], "path": "world/the-fracture.md", "region": "", "parent_region": "", "meta": {}, "assets": [], "summary": "The Fracture is the ancient event in which the Prime Realm shattered into the Frequencies.", "words": 152, "sections": [{"h": "Overview", "t": "The Fracture is the ancient event in which the Prime Realm shattered into the Frequencies."}, {"h": "Description", "t": "During the Fracture, reality did not end\u2014it separated into vibrational states of itself. Each resulting Frequency represents a different resonance of the original Prime Realm, and the laws of reality are not identical across all Frequencies as a result.\n\nBecause each fragment vibrates differently, different Frequencies may exhibit:\n\n- different physical laws\n- different gravity and energy behaviors\n- different environments\n- different lifeforms and inhabitants"}, {"h": "Lore", "t": "The time before the Fracture is commonly called **The Prime Age**, and the era after is commonly called **The Present Age**.\n\nThe cause of the Fracture remains unknown. Across the Frequencies, myths and theories diverge\u2014some describing a natural cosmic limit, others a forgotten civilization, a betrayal, or a war that ruptured reality."}, {"h": "Notes", "t": "The Fracture is treated as historical fact; its cause is not."}], "unresolved": []}, {"id": "world:the-present-age", "slug": "the-present-age", "label": "The Present Age", "category": "world", "status": "canonical", "themes": ["exploration", "unanswered questions", "frequency"], "path": "world/the-present-age.md", "region": "", "parent_region": "", "meta": {}, "assets": [], "summary": "The Present Age is the era after the Fracture, in which civilizations live across the Frequencies.", "words": 105, "sections": [{"h": "Overview", "t": "The Present Age is the era after the Fracture, in which civilizations live across the Frequencies."}, {"h": "Description", "t": "Most inhabitants accept the Frequencies as the natural structure of reality, though many still search for answers about the lost Prime Realm and the cause of the Fracture."}, {"h": "Lore", "t": "Ruins, artifacts, myths, and unexplained phenomena continue to hint that reality was once unified. While modern inter-frequency travel exists in some form, it is generally understood to be unstable and incomplete compared to whatever principles governed the Prime Age."}, {"h": "Notes", "t": "The shared scholarly consensus across many Frequencies is simple: the Frequencies were not always separate."}], "unresolved": []}, {"id": "world:the-prime-age", "slug": "the-prime-age", "label": "The Prime Age", "category": "world", "status": "canonical", "themes": ["lost history", "ruins", "transfrequency", "mystery"], "path": "world/the-prime-age.md", "region": "", "parent_region": "", "meta": {}, "assets": [], "summary": "The Prime Age is the name given to the time before the Fracture, when the Prime Realm was whole.", "words": 135, "sections": [{"h": "Overview", "t": "The Prime Age is the name given to the time before the Fracture, when the Prime Realm was whole."}, {"h": "Description", "t": "Very little is known of this era. No complete records survive, and what knowledge exists comes from aligned ruins, repeating symbols, and objects that behave inconsistently with modern reality.\n\nRemnants attributed to this era are commonly called **Prime Relics**."}, {"h": "Lore", "t": "Explorers and scholars have noted that some ruins discovered across different Frequencies appear to align with one another when their locations are compared, suggesting they were once contiguous structures in the single unified Prime Realm.\n\nOne of the most discussed Prime Age remnants is **The Prime Bridge**, which persists as partial echoes across multiple Frequencies."}, {"h": "Notes", "t": "\u201cPrime Age\u201d is a modern label for a period that left incomplete traces."}], "unresolved": []}, {"id": "world:the-prime-realm", "slug": "the-prime-realm", "label": "The Prime Realm", "category": "world", "status": "canonical", "themes": ["origin", "unity", "layered reality", "resonance"], "path": "world/prime-realm.md", "region": "", "parent_region": "", "meta": {}, "assets": [], "summary": "The Prime Realm was the single unified reality that existed before the Frequencies.", "words": 132, "sections": [{"h": "Overview", "t": "The Prime Realm was the single unified reality that existed before the Frequencies."}, {"h": "Description", "t": "In the Prime Realm, the laws of existence were believed to be in complete balance\u2014matter, energy, time, and life functioning as one continuous world rather than as layered vibrational states.\n\nNo living being remembers the Prime Realm, and no surviving record describes it in full. What is known is inferred from scattered remnants that appear to predate the separation of reality into Frequencies."}, {"h": "Lore", "t": "The Prime Realm ended with an event now called **The Fracture**, after which reality persisted but separated into distinct vibrational states. These states became the **Frequencies**, each carrying a different resonance of what the Prime Realm once was."}, {"h": "Notes", "t": "Descriptions of the Prime Realm are reconstructed, not witnessed."}], "unresolved": []}], "edges": [{"source": "artifact:blue-rose-vow", "target": "region:sorel", "kinds": ["region", "related"]}, {"source": "artifact:blue-rose-vow", "target": "artwork:blue-rose", "kinds": ["related"]}, {"source": "artifact:blue-rose-vow", "target": "culture:sorel-exile-compact", "kinds": ["related"]}, {"source": "artifact:bronze-umbrella-seated-figure", "target": "region:the-sketchy-gallery", "kinds": ["region", "related"]}, {"source": "artifact:curious-arch-lane-token", "target": "region:the-returning-span", "kinds": ["region", "related"]}, {"source": "artifact:curious-arch-lane-token", "target": "symbol:curious-arch", "kinds": ["related"]}, {"source": "artifact:curious-arch-lane-token", "target": "artwork:curious-1", "kinds": ["related"]}, {"source": "artifact:curious-arch-lane-token", "target": "rule:returning-span-lane-discipline-rule", "kinds": ["related"]}, {"source": "artifact:early-f432-survey-map", "target": "region:f432-frequency-realm", "kinds": ["region", "related"]}, {"source": "artifact:early-f432-survey-map", "target": "region:nauw", "kinds": ["related"]}, {"source": "artifact:early-f432-survey-map", "target": "region:wabet", "kinds": ["related"]}, {"source": "artifact:early-f432-survey-map", "target": "region:sorel", "kinds": ["related"]}, {"source": "artifact:exile-mask-of-carrow-vale", "targ /* ============ shared data prep ============ */
const nodes = DATA.nodes;
const edges = DATA.edges;
const nodesById = new Map(nodes.map(n => [n.id, n]));

const CAT_COLORS = {
  world: '#7aa2ff', region: '#f48fb1', rule: '#8dd3c7', culture: '#4dd0e1',
  inhabitant: '#ffd180', artifact: '#ce93d8', symbol: '#ffcc80', myth: '#b0bec5',
  story: '#90caf9', artwork: '#ff8a65', phenomenon: '#a5d6a7', unknown: '#90a4ae',
};
const STATUS_COLORS = {
  canonical: '#5dd39e', myth: '#c792ea', rumor: '#f2b86b', unknown: '#8a93a6', unspecified: '#6b7186',
};
function catColor(c) {
  if (CAT_COLORS[c]) return CAT_COLORS[c];
  let hash = 0;
  for (let i = 0; i < c.length; i++) hash = (hash * 31 + c.charCodeAt(i)) | 0;
  return `hsl(${Math.abs(hash) % 360} 65% 70%)`;
}
function statusColor(s) { return STATUS_COLORS[s] || '#8a93a6'; }

const categories = [...new Set(nodes.map(n => n.category))].sort();
const statuses = [...new Set(nodes.map(n => n.status))].sort();
const catCounts = new Map();
for (const n of nodes) catCounts.set(n.category, (catCounts.get(n.category) || 0) + 1);

// adjacency with direction + kinds
const adj = new Map();
function addAdj(a, b, kinds, dir) {
  if (!adj.has(a)) adj.set(a, []);
  adj.get(a).push({ id: b, kinds, dir });
}
for (const e of edges) {
  addAdj(e.source, e.target, e.kinds, 'out');
  addAdj(e.target, e.source, e.kinds, 'in');
}
for (const n of nodes) n.degree = (adj.get(n.id) || []).length;

// label / slug lookups for hierarchy refs
const idByLabel = new Map();
const idBySlug = new Map();
function slugifyJs(t) {
  return (t || '').toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}
for (const n of nodes) {
  idByLabel.set(n.label.toLowerCase().trim(), n.id);
  if (n.slug) idBySlug.set(n.slug, n.id);
}
function resolveRef(ref) {
  const raw = (ref || '').trim();
  if (!raw) return null;
  return idByLabel.get(raw.toLowerCase()) || idBySlug.get(slugifyJs(raw)) || null;
}

// themes
const themeMap = new Map();
for (const n of nodes) {
  for (const t of n.themes) {
    if (!themeMap.has(t)) themeMap.set(t, []);
    themeMap.get(t).push(n.id);
  }
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function assetUrl(p) { return '../' + p; }
function fmtKey(k) { return k.replace(/_/g, ' '); }

/* ============ tiny markdown renderer ============ */
function inlineMd(s) {
  let out = esc(s);
  out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
  out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  return out;
}
function mdToHtml(text) {
  const lines = (text || '').split('\n');
  let html = '';
  let para = [];
  let list = null;
  const flushPara = () => {
    if (para.length) { html += '<p>' + inlineMd(para.join(' ')) + '</p>'; para = []; }
  };
  const flushList = () => {
    if (list) { html += '<ul>' + list.map(li => '<li>' + inlineMd(li) + '</li>').join('') + '</ul>'; list = null; }
  };
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) { flushPara(); flushList(); continue; }
    if (/^[-*]\s+/.test(line)) {
      flushPara();
      if (!list) list = [];
      list.push(line.replace(/^[-*]\s+/, ''));
      continue;
    }
    if (/^#{3,6}\s+/.test(line)) {
      flushPara(); flushList();
      html += '<p><strong>' + inlineMd(line.replace(/^#+\s+/, '')) + '</strong></p>';
      continue;
    }
    flushList();
    para.push(line);
  }
  flushPara(); flushList();
  return html;
}

function metaItemHtml(key, value) {
  const refId = resolveRef(value);
  const cls = refId ? 'mv link' : 'mv';
  const attr = refId ? ` data-open="${esc(refId)}"` : '';
  return `<div class="meta-item"><span class="mk">${esc(fmtKey(key))}</span><span class="${cls}"${attr}>${esc(value)}</span></div>`;
}

function connectionsHtml(id) {
  const links = adj.get(id) || [];
  if (!links.length) return '<div class="empty-note">No links to other entries.</div>';
  const out = links.filter(l => l.dir === 'out');
  const inc = links.filter(l => l.dir === 'in');
  const renderGroup = (items, label) => {
    if (!items.length) return '';
    const byCat = new Map();
    for (const l of items) {
      const n = nodesById.get(l.id);
      if (!n) continue;
      if (!byCat.has(n.category)) byCat.set(n.category, []);
      byCat.get(n.category).push(l);
    }
    let html = `<div class="conn-group"><div class="cg-head">${label} (${items.length})</div>`;
    for (const cat of [...byCat.keys()].sort()) {
      for (const l of byCat.get(cat).sort((a, b) => nodesById.get(a.id).label.localeCompare(nodesById.get(b.id).label))) {
        const n = nodesById.get(l.id);
        html += `<div class="conn-item" data-open="${esc(n.id)}">` +
          `<span class="dot" style="background:${catColor(n.category)}"></span>` +
          `<span>${esc(n.label)}</span>` +
          `<span class="kind">${esc(n.category)} &middot; ${esc(l.kinds.join(', '))}</span></div>`;
      }
    }
    return html + '</div>';
  };
  return renderGroup(out, 'Links out') + renderGroup(inc, 'Referenced by');
}

function openEntry(id, opts = {}) {

  currentEntryId = id;
  let html = '';

  if (n.assets.length) {

  }
  html += '<div class="drawer-body">';
  html += `<div class="chips" style="display:flex;gap:6px;flex-wrap:wrap;">` +
    `<span class="chip cat" style="--c:${catColor(n.category)}">${esc(n.category)}</span>` +
    `<span class="chip status" style="color:${statusColor(n.status)};border-color:color-mix(in srgb,${statusColor(n.status)} 40%,transparent)">${esc(n.status)}</span>` +
    `</div>`;
  html += `<h2>${esc(n.label)}</h2>`;
  if (n.summary) html += `<p class="drawer-summary">${esc(n.summary)}</p>`;

  html += `<div class="drawer-stats">` +
    `<span><b>${n.degree}</b> links</span>` +
    `<span><b>${n.words}</b> words</span>` +
    `<span><b>${n.sections.length}</b> sections</span>` +
    `</div>`;

  html += `<div class="drawer-actions">` +
    `<button class="ghost-btn" data-locate="${esc(n.id)}">Locate in graph</button>` +
    `</div>`;

  const metaKeys = Object.keys(n.meta);
  if (metaKeys.length) {
    html += '<div class="meta-grid">';
    for (const k of metaKeys) html += metaItemHtml(k, n.meta[k]);
    html += '</div>';
  }

  if (n.themes.length) {
    html += '<div class="drawer-section-title">Themes</div>';
    html += '<div style="display:flex;gap:6px;flex-wrap:wrap;">';
    for (const t of n.themes) html += `<span class="chip theme" data-theme="${esc(t)}">${esc(t)}</span>`;
    html += '</div>';
  }

  if (n.assets.length > 1) {
    html += '<div class="drawer-section-title">Assets</div><div class="asset-strip">';
    for (const a of n.assets) html += `<img src="${esc(assetUrl(a))}" data-lightbox="${esc(assetUrl(a))}" loading="lazy" alt="" />`;
    html += '</div>';
  }

  html += '<div class="drawer-section-title">Connections</div>';
  html += connectionsHtml(n.id);

  if (n.unresolved.length) {
    html += '<div class="drawer-section-title">Unresolved references</div><div class="unresolved-box">';
    for (const u of n.unresolved) html += `<div class="u-item">${esc(u)}</div>`;
    html += '</div>';
  }

  if (n.sections.length) {
    html += '<div class="drawer-section-title">Document</div><div class="doc-section">';
    for (const sec of n.sections) {
      if (sec.h) html += `<h3>${esc(sec.h)}</h3>`;
      html += mdToHtml(sec.t);
    }
    html += '</div>';
  }

  html += `<div class="path-line">${esc(n.path)}</div>`;
  html += '</div>';

  drawerScroll.innerHTML = html;
  drawerScroll.scrollTop = 0;
  drawer.classList.add('open');

  if (!opts.skipGraphSelect) graphSelect(id, { center: false });
}

const searchInput = document.getElementById('global-search');
const searchResults = document.getElementById('search-results');
function runSearch(q) {
  const query = q.trim().toLowerCase();
  if (!query) { searchResults.classList.remove('open'); return; }
  const scored = [];
  for (const n of nodes) {
    const name = n.label.toLowerCase();
    let score = -1;
    if (name === query) score = 0;
    else if (name.startsWith(query)) score = 1;
    else if (name.includes(query)) score = 2;
    else if (n.themes.some(t => t.toLowerCase().includes(query))) score = 3;
    else if (n.category.includes(query) || n.status.includes(query)) score = 4;
    else if (n.summary.toLowerCase().includes(query)) score = 5;
    if (score >= 0) scored.push([score, n]);
  }
  scored.sort((a, b) => a[0] - b[0] || a[1].label.localeCompare(b[1].label));
  const top = scored.slice(0, 14);
  if (!top.length) { searchResults.classList.remove('open'); return; }
  searchResults.innerHTML = top.map(([, n]) =>
    `<div class="search-item" data-open="${esc(n.id)}">` +
    `<span class="dot" style="background:${catColor(n.category)}"></span>` +
    `<span>${esc(n.label)}</span><span class="cat-mini">${esc(n.category)}</span></div>`
  ).join('');
  searchResults.classList.add('open');
}
searchInput.addEventListener('input', () => runSearch(searchInput.value));
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const first = searchResults.querySelector('[data-open]');
    if (first) { openEntry(first.dataset.open); searchResults.classList.remove('open'); searchInput.blur(); }
  }
  if (e.key === 'Escape') searchResults.classList.remove('open');
});
searchResults.addEventListener('click', (e) => {
  const item = e.target.closest('[data-open]');
  if (item) { openEntry(item.dataset.open); searchResults.classList.remove('open'); searchInput.value = ''; }
});

});

/* ============ graph tab ============ */
const svg = document.getElementById('graph');
const GW = 2400, GH = 1700;
const graphRoot = document.createElementNS('http://www.w3.org/2000/svg', 'g');
const edgeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
const nodeGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
const labelGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
graphRoot.append(edgeGroup, nodeGroup, labelGroup);
svg.appendChild(graphRoot);

const tooltip = document.getElementById('tooltip');
const hud = document.getElementById('graph-hud');
const selectedCats = new Set(categories);
let focusMode = false;
let showLabels = true;
let spacing = 150;
let selectedId = null;
let view = { scale: 1, x: 0, y: 0 };
let energy = 1.0;
const MIN_ENERGY = 0.012;
let settled = 0;

function seedPositions() {
  const catIdx = new Map(categories.map((c, i) => [c, i]));
  for (const n of nodes) {
    const baseAngle = (catIdx.get(n.category) / categories.length) * Math.PI * 2;
    const r = 540 + Math.random() * 260;
    const jitter = (Math.random() - 0.5) * 0.9;
    n.x = GW / 2 + Math.cos(baseAngle + jitter) * r;
    n.y = GH / 2 + Math.sin(baseAngle + jitter) * r;
    n.vx = 0; n.vy = 0;
  }
}
for (const n of nodes) {
  n.r = (n.category === 'world' ? 11 : 4.5) + Math.min(7, Math.sqrt(n.degree) * 1.25);
  n.color = catColor(n.category);
}
seedPositions();

const edgeEls = edges.map((e) => {
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('class', 'gedge');
  edgeGroup.appendChild(line);
  return [e, line];
});
const nodeEls = nodes.map((n) => {
  const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('class', 'gnode');
  c.setAttribute('r', n.r);
  c.setAttribute('fill', n.color);
  c.dataset.id = n.id;
  nodeGroup.appendChild(c);
  return [n, c];
});
const labelEls = nodes.map((n) => {
  const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('class', 'glabel');
  t.textContent = n.label;
  labelGroup.appendChild(t);
  return [n, t];
});

function graphVisibleSet() {
  let vis = new Set(nodes.filter(n => selectedCats.has(n.category)).map(n => n.id));
  if (focusMode && selectedId) {
    const hood = new Set([selectedId]);
    for (const l of adj.get(selectedId) || []) hood.add(l.id);
    vis = new Set([...vis].filter(id => hood.has(id)));
    if (nodesById.has(selectedId)) vis.add(selectedId);
  }
  return vis;
}

function applyGraphFilters() {
  const vis = graphVisibleSet();
  const hood = selectedId ? new Set([selectedId, ...(adj.get(selectedId) || []).map(l => l.id)]) : null;
  for (const [n, el] of nodeEls) {
    const v = vis.has(n.id);
    el.style.display = v ? '' : 'none';
    el.classList.toggle('dim', v && hood ? !hood.has(n.id) : false);
    el.classList.toggle('sel', n.id === selectedId);
  }
  for (const [n, el] of labelEls) {
    const v = vis.has(n.id) && showLabels;
    el.style.display = v ? '' : 'none';
    el.classList.toggle('dim', v && hood ? !hood.has(n.id) : false);
  }
  let visEdges = 0;
  for (const [e, el] of edgeEls) {
    const v = vis.has(e.source) && vis.has(e.target);
    if (v) visEdges++;
    el.style.display = v ? '' : 'none';
    const hot = !!(selectedId && v && (e.source === selectedId || e.target === selectedId));
    el.classList.toggle('hot', hot);
    el.classList.toggle('dim', v && selectedId ? !hot : false);
  }
  hud.textContent = `${vis.size} nodes \u00b7 ${visEdges} links`;
}

function graphSelect(id, opts = {}) {
  selectedId = id;
  applyGraphFilters();
  if (id && opts.center) centerOn(id);
}

function centerOn(id) {
  const n = nodesById.get(id);
  if (!n) return;
  view.scale = Math.max(view.scale, 1.35);
  view.x = GW / 2 - n.x * view.scale;
  view.y = GH / 2 - n.y * view.scale;
  applyView();
}

function locateInGraph(id) {
  switchTab('graph');
  graphSelect(id, { center: true });
}

function applyView() {
  graphRoot.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.scale})`);
}
function fitView() {
  const vis = graphVisibleSet();
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of nodes) {
    if (!vis.has(n.id)) continue;
    if (n.x < minX) minX = n.x;
    if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.y > maxY) maxY = n.y;
  }
  if (!isFinite(minX)) { view.scale = 1; view.x = 0; view.y = 0; applyView(); return; }
  const pad = 130;
  const bw = Math.max(240, maxX - minX + pad * 2);
  const bh = Math.max(240, maxY - minY + pad * 2);
  view.scale = Math.min(3.0, Math.max(0.3, Math.min(GW / bw, GH / bh)));
  view.x = GW / 2 - ((minX + maxX) / 2) * view.scale;
  view.y = GH / 2 - ((minY + maxY) / 2) * view.scale;
  applyView();
}
let userInteracted = false;
let fitStamp = 0;
function scheduleFit(delay = 1700) {
  fitView();
  const stamp = ++fitStamp;
  setTimeout(() => { if (!userInteracted && stamp === fitStamp) fitView(); }, delay);
}

function tick() {
  if (energy <= MIN_ENERGY) return;
  for (const e of edges) {
    const a = nodesById.get(e.source), b = nodesById.get(e.target);
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const force = (dist - spacing) * 0.0028 * energy;
    const fx = (dx / dist) * force, fy = (dy / dist) * force;
    a.vx += fx; a.vy += fy; b.vx -= fx; b.vy -= fy;
  }
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.max(1, Math.hypot(dx, dy));
      const minDist = a.r + b.r + spacing * 0.5;
      if (dist < minDist) {
        const push = (minDist - dist) * 0.06 * energy;
        const px = (dx / dist) * push, py = (dy / dist) * push;
        a.vx -= px; a.vy -= py; b.vx += px; b.vy += py;
      }
    }
  }
  let motion = 0;
  for (const n of nodes) {
    n.vx += (GW / 2 - n.x) * 0.00012 * energy;
    n.vy += (GH / 2 - n.y) * 0.00012 * energy;
    n.vx *= 0.82; n.vy *= 0.82;
    n.x = Math.min(GW - 20, Math.max(20, n.x + n.vx));
    n.y = Math.min(GH - 20, Math.max(20, n.y + n.vy));
    motion += Math.abs(n.vx) + Math.abs(n.vy);
  }
  energy *= 0.992;
  if (motion < nodes.length * 0.01) settled++; else settled = 0;
  if (settled > 24) { energy = MIN_ENERGY; for (const n of nodes) { n.vx = 0; n.vy = 0; } }
  if (energy < MIN_ENERGY) energy = MIN_ENERGY;
}
function render() {
  for (const [e, line] of edgeEls) {
    const a = nodesById.get(e.source), b = nodesById.get(e.target);
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
  }
  for (const [n, c] of nodeEls) { c.setAttribute('cx', n.x); c.setAttribute('cy', n.y); }
  for (const [n, t] of labelEls) { t.setAttribute('x', n.x + n.r + 3); t.setAttribute('y', n.y + 3); }
}
(function frame() { tick(); render(); requestAnimationFrame(frame); })();

// pointer interactions
let pan = null;
let dragNode = null;
let downPos = null;
let downId = null;
let moved = false;

function svgPoint(evt) {
  const rect = svg.getBoundingClientRect();
  const sx = GW / rect.width, sy = GH / rect.height;
  const px = (evt.clientX - rect.left) * sx;
  const py = (evt.clientY - rect.top) * sy;
  return { x: (px - view.x) / view.scale, y: (py - view.y) / view.scale, rawX: px, rawY: py };
}

svg.addEventListener('pointerdown', (evt) => {
  if (evt.button !== 0 && evt.button !== 1) return;
  userInteracted = true;
  downPos = { x: evt.clientX, y: evt.clientY };
  moved = false;
  downId = (evt.target.dataset && evt.target.dataset.id) || null;
  if (downId) {
    dragNode = nodesById.get(downId);
  } else {
    pan = { x: evt.clientX, y: evt.clientY };
    svg.classList.add('panning');
  }
  svg.setPointerCapture(evt.pointerId);
});
svg.addEventListener('pointermove', (evt) => {
  if (downPos && Math.hypot(evt.clientX - downPos.x, evt.clientY - downPos.y) > 4) moved = true;
  if (dragNode && moved) {
    const p = svgPoint(evt);
    dragNode.x = p.x; dragNode.y = p.y;
    dragNode.vx = 0; dragNode.vy = 0;
    energy = Math.max(energy, 0.28);
    settled = 0;
  } else if (pan) {
    const rect = svg.getBoundingClientRect();
    view.x += (evt.clientX - pan.x) * (GW / rect.width);
    view.y += (evt.clientY - pan.y) * (GH / rect.height);
    pan = { x: evt.clientX, y: evt.clientY };
    applyView();
  }
  // hover tooltip
  const id = evt.target.dataset && evt.target.dataset.id;
  if (id && !pan && !(dragNode && moved)) {
    const n = nodesById.get(id);
    tooltip.innerHTML = `<div class="t-name">${esc(n.label)}</div>` +
      `<div class="t-sub">${esc(n.category)} \u00b7 ${esc(n.status)} \u00b7 ${n.degree} links</div>` +
      (n.summary ? `<div class="t-sub" style="margin-top:4px">${esc(n.summary.slice(0, 110))}${n.summary.length > 110 ? '...' : ''}</div>` : '');
    tooltip.style.display = 'block';
    tooltip.style.left = Math.min(window.innerWidth - 300, evt.clientX + 14) + 'px';
    tooltip.style.top = (evt.clientY + 14) + 'px';
  } else {
    tooltip.style.display = 'none';
  }
});
svg.addEventListener('pointerup', (evt) => {
  if (!moved) {
    if (downId) openEntry(downId);
    else closeDrawer();
  }
  dragNode = null; pan = null; downPos = null; downId = null;
  svg.classList.remove('panning');
  try { svg.releasePointerCapture(evt.pointerId); } catch (_e) {}
});
svg.addEventListener('pointerleave', () => { tooltip.style.display = 'none'; });
svg.addEventListener('wheel', (evt) => {
  evt.preventDefault();
  userInteracted = true;
  const rect = svg.getBoundingClientRect();
  const sx = GW / rect.width, sy = GH / rect.height;
  const cx = (evt.clientX - rect.left) * sx, cy = (evt.clientY - rect.top) * sy;
  const factor = evt.deltaY < 0 ? 1.12 : 0.89;
  const next = Math.min(3.4, Math.max(0.3, view.scale * factor));
  if (next === view.scale) return;
  const wx = (cx - view.x) / view.scale, wy = (cy - view.y) / view.scale;
  view.scale = next;
  view.x = cx - wx * next;
  view.y = cy - wy * next;
  applyView();
}, { passive: false });

const expSearch = document.getElementById('exp-search');

function cardHtml(n) {
  const themes = n.themes.slice(0, 3).map(t => `<span class="chip theme" data-theme="${esc(t)}">${esc(t)}</span>`).join('');
  return `<div class="card" data-open="${esc(n.id)}" style="--c:${catColor(n.category)}">` +
    `<div class="chips"><span class="chip cat" style="--c:${catColor(n.category)}">${esc(n.category)}</span>` +
    `<span class="chip status" style="color:${statusColor(n.status)}">${esc(n.status)}</span></div>` +
    `<h4>${esc(n.label)}</h4>` +
    (n.summary ? `<p>${esc(n.summary)}</p>` : '') +
    (themes ? `<div class="chips">${themes}</div>` : '') +
    `<div class="foot"><span>${n.degree} links</span><span>${n.words} words</span>` +
    (n.assets.length ? `<span>${n.assets.length} image${n.assets.length > 1 ? 's' : ''}</span>` : '') +
    `</div></div>`;
}

function renderExplorer() {
  const q = expSearch.value.trim().toLowerCase();
  let list = nodes.filter(n => expCats.has(n.category));
  if (q) {
    list = list.filter(n =>
      n.label.toLowerCase().includes(q) ||
      n.summary.toLowerCase().includes(q) ||
      n.themes.some(t => t.toLowerCase().includes(q)) ||
      (n.meta.region || '').toLowerCase().includes(q)
    );
  }
  const sort = expSort.value;
  if (sort === 'name') list.sort((a, b) => a.label.localeCompare(b.label));
  else if (sort === 'connections') list.sort((a, b) => b.degree - a.degree);
  else if (sort === 'words') list.sort((a, b) => b.words - a.words);
  else if (sort === 'category') list.sort((a, b) => a.category.localeCompare(b.category) || a.label.localeCompare(b.label));
  expCount.textContent = `${list.length} of ${nodes.length} entries`;
  expGrid.innerHTML = list.map(cardHtml).join('');
}
expSearch.addEventListener('input', renderExplorer);
expSort.addEventListener('change', renderExplorer);
expGrid.addEventListener('click', (e) => {

const themeListEl = document.getElementById('theme-list');
const themeSearchEl = document.getElementById('theme-search');
const themeTitleEl = document.getElementById('theme-title');
const themeSubEl = document.getElementById('theme-sub');
const themeGridEl = document.getElementById('theme-grid');
let activeTheme = null;
const sortedThemes = [...themeMap.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));

function renderThemeList() {
  const q = themeSearchEl.value.trim().toLowerCase();
  themeListEl.innerHTML = sortedThemes
    .filter(([t]) => !q || t.toLowerCase().includes(q))
    .map(([t, ids]) =>
      `<div class="theme-row${t === activeTheme ? ' sel' : ''}" data-t="${esc(t)}">` +
      `<span>${esc(t)}</span><span class="count">${ids.length}</span></div>`
    ).join('');
