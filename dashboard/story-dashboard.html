<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dias - World Atlas</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07070b;
    --bg-soft: #0d0e14;
    --panel: #12141c;
    --panel-2: #181b25;
    --line: #262a38;
    --line-soft: #1d2030;
    --ink: #e9ebf2;
    --muted: #9aa1b4;
    --faint: #6b7186;
    --accent: #8fa9ff;
    --radius: 14px;
    --header-h: 58px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(1200px 600px at 75% -10%, rgba(70, 90, 160, 0.16), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(120, 80, 160, 0.10), transparent 60%),
      var(--bg);
    color: var(--ink);
    overflow: hidden;
  }
  button { font-family: inherit; }

  /* ---------- header ---------- */
  header {
    height: var(--header-h);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line-soft);
    background: rgba(10, 11, 16, 0.82);
    backdrop-filter: blur(10px);
    position: relative;
    z-index: 30;
  }
  .brand { display: flex; flex-direction: column; line-height: 1.15; min-width: 130px; }
  .brand b { font-size: 0.98rem; letter-spacing: 0.04em; }
  .brand span { font-size: 0.68rem; color: var(--faint); letter-spacing: 0.12em; text-transform: uppercase; }
  nav { display: flex; gap: 4px; }
  nav button {
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    padding: 7px 13px;
    border-radius: 9px;
    font-size: 0.84rem;
    cursor: pointer;
    transition: color .15s, background .15s;
  }
  nav button:hover { color: var(--ink); background: rgba(255,255,255,0.05); }
  nav button.active {
    color: var(--ink);
    background: rgba(143, 169, 255, 0.13);
    border-color: rgba(143, 169, 255, 0.32);
  }
  .header-search { margin-left: auto; position: relative; width: min(330px, 30vw); }
  .header-search input {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--ink);
    padding: 8px 12px;
    font-size: 0.85rem;
    outline: none;
  }
  .header-search input:focus { border-color: rgba(143,169,255,0.5); }
  #search-results {
    position: absolute;
    top: calc(100% + 6px);
    left: 0; right: 0;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    max-height: 380px;
    overflow: auto;
    display: none;
    box-shadow: 0 18px 48px rgba(0,0,0,0.55);
  }
  #search-results.open { display: block; }
  .search-item {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 12px;
    cursor: pointer;
    font-size: 0.84rem;
  }
  .search-item:hover { background: rgba(143,169,255,0.10); }
  .search-item .cat-mini { margin-left: auto; color: var(--faint); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }
  .header-stats { display: flex; gap: 14px; color: var(--faint); font-size: 0.74rem; white-space: nowrap; }
  .header-stats b { color: var(--muted); font-weight: 600; }

  /* ---------- layout ---------- */
  #app { height: calc(100vh - var(--header-h)); position: relative; }
  .tab { display: none; height: 100%; }
  .tab.active { display: block; }
  .dot {
    width: 9px; height: 9px; border-radius: 99px; flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,0.35);
  }

  /* ---------- chips ---------- */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.7rem;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .chip.cat { color: var(--c, var(--muted)); border-color: color-mix(in srgb, var(--c, #888) 45%, transparent); background: color-mix(in srgb, var(--c, #888) 10%, transparent); }
  .chip.status { text-transform: capitalize; }
  .chip.theme { cursor: pointer; text-transform: none; letter-spacing: 0; font-size: 0.74rem; }
  .chip.theme:hover { border-color: rgba(143,169,255,0.55); color: var(--ink); }

  /* ---------- graph tab ---------- */
  #tab-graph { display: none; grid-template-columns: 252px 1fr; }
  #tab-graph.active { display: grid; }
  .rail {
    border-right: 1px solid var(--line-soft);
    background: rgba(13, 14, 20, 0.65);
    padding: 14px;
    overflow: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .rail h3 {
    margin: 0;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--faint);
    font-weight: 600;
  }
  .rail-group { display: flex; flex-direction: column; gap: 8px; }
  .cat-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.82rem;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    padding: 3px 6px;
    border-radius: 7px;
  }
  .cat-row:hover { background: rgba(255,255,255,0.04); color: var(--ink); }
  .cat-row input { accent-color: var(--accent); margin: 0; }
  .cat-row .count { margin-left: auto; color: var(--faint); font-size: 0.72rem; }
  .rail label.slider { display: grid; gap: 4px; font-size: 0.78rem; color: var(--muted); }
  .rail input[type="range"] { width: 100%; accent-color: var(--accent); }
  .rail .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .ghost-btn {
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    border-radius: 9px;
    padding: 6px 11px;
    font-size: 0.76rem;
    cursor: pointer;
  }
  .ghost-btn:hover { color: var(--ink); border-color: rgba(143,169,255,0.45); }
  .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle-row input { accent-color: var(--accent); margin: 0; }
  #graph-wrap { position: relative; overflow: hidden; }
  #graph { width: 100%; height: 100%; display: block; cursor: default; }
  #graph.panning { cursor: grabbing; }
  #graph-hud {
    position: absolute; left: 12px; bottom: 10px;
    font-size: 0.72rem; color: var(--faint);
    background: rgba(10,11,16,0.7);
    border: 1px solid var(--line-soft);
    padding: 5px 10px;
    border-radius: 8px;
    pointer-events: none;
  }
  #graph-hint {
    position: absolute; right: 12px; bottom: 10px;
    font-size: 0.7rem; color: var(--faint);
    pointer-events: none;
  }
  .gnode { stroke: rgba(8, 10, 20, 0.9); stroke-width: 1.2; cursor: pointer; transition: opacity .15s; }
  .gnode.dim { opacity: 0.07; }
  .gnode.sel { stroke: #fff; stroke-width: 2.4; }
  .gedge { stroke: #38415f; stroke-opacity: 0.5; stroke-width: 1; transition: opacity .15s; }
  .gedge.dim { opacity: 0.04; }
  .gedge.hot { stroke: var(--accent); stroke-opacity: 0.95; stroke-width: 1.6; }
  .glabel {
    font-size: 10px; fill: #d7ddf0;
    paint-order: stroke; stroke: rgba(5,6,10,0.85); stroke-width: 2.5px;
    pointer-events: none;
    transition: opacity .15s;
  }
  .glabel.dim { opacity: 0.05; }
  #tooltip {
    position: fixed;
    z-index: 60;
    pointer-events: none;
    background: rgba(14, 16, 24, 0.95);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 11px;
    font-size: 0.78rem;
    display: none;
    max-width: 280px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  #tooltip .t-name { font-weight: 600; margin-bottom: 2px; }
  #tooltip .t-sub { color: var(--muted); font-size: 0.72rem; }

  /* ---------- scrollable tab shells ---------- */
  .scroll-tab { overflow: auto; padding: 18px 20px 40px; height: 100%; }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    margin-bottom: 16px;
    position: sticky; top: -18px;
    background: linear-gradient(rgba(7,7,11,0.96), rgba(7,7,11,0.88));
    padding: 12px 0 10px;
    z-index: 5;
  }
  .toolbar input[type="text"], .toolbar select {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    color: var(--ink);
    padding: 7px 11px;
    font-size: 0.82rem;
    outline: none;
  }
  .toolbar input[type="text"]:focus { border-color: rgba(143,169,255,0.5); }
  .pill {
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
    color: var(--muted);
    border-radius: 999px;
    font-size: 0.76rem;
    padding: 5px 12px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .pill.on { border-color: color-mix(in srgb, var(--c, var(--accent)) 60%, transparent); color: var(--ink); background: color-mix(in srgb, var(--c, var(--accent)) 13%, transparent); }
  .result-count { color: var(--faint); font-size: 0.76rem; margin-left: auto; }

  /* ---------- explorer cards ---------- */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
    gap: 12px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 13px 14px 11px;
    cursor: pointer;
    display: flex; flex-direction: column; gap: 8px;
    transition: transform .12s, border-color .12s, background .12s;
    border-top: 2px solid var(--c, var(--line));
    min-height: 130px;
  }
  .card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c, #888) 50%, var(--line)); background: var(--panel-2); }
  .card .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .card h4 { margin: 0; font-size: 0.95rem; font-weight: 600; }
  .card p { margin: 0; font-size: 0.78rem; color: var(--muted); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .foot { margin-top: auto; display: flex; gap: 12px; color: var(--faint); font-size: 0.7rem; padding-top: 4px; }

  /* ---------- gallery ---------- */
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
    gap: 12px;
  }
  .gal-item {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: transform .12s, border-color .12s;
  }
  .gal-item:hover { transform: translateY(-2px); border-color: rgba(143,169,255,0.45); }
  .gal-item img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block; background: #0a0b10; }
  .gal-cap { padding: 9px 11px; }
  .gal-cap b { display: block; font-size: 0.82rem; font-weight: 600; }
  .gal-cap span { display: block; color: var(--faint); font-size: 0.7rem; margin-top: 2px; }

  /* ---------- themes ---------- */
  #tab-themes.active { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
  #theme-list-col {
    border-right: 1px solid var(--line-soft);
    overflow: auto;
    padding: 14px;
    display: flex; flex-direction: column; gap: 4px;
    background: rgba(13,14,20,0.6);
  }
  #theme-list-col input {
    background: var(--panel); border: 1px solid var(--line); border-radius: 9px;
    color: var(--ink); padding: 7px 11px; font-size: 0.82rem; outline: none; margin-bottom: 8px;
  }
  .theme-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 0.82rem;
    color: var(--muted);
    cursor: pointer;
  }
  .theme-row:hover { background: rgba(255,255,255,0.05); color: var(--ink); }
  .theme-row.sel { background: rgba(143,169,255,0.14); color: var(--ink); outline: 1px solid rgba(143,169,255,0.4); }
  .theme-row .count { margin-left: auto; color: var(--faint); font-size: 0.72rem; }
  #theme-entries { overflow: auto; padding: 18px 20px 40px; }
  #theme-entries h2 { margin: 0 0 4px; font-size: 1.1rem; }
  #theme-entries .sub { color: var(--faint); font-size: 0.8rem; margin-bottom: 16px; }

  /* ---------- hierarchy ---------- */
  #tab-hierarchy .scroll-inner { max-width: 860px; }
  .hier-root, .hier-children { list-style: none; margin: 0; padding: 0; }
  .hier-children { padding-left: 20px; border-left: 1px dashed rgba(120, 138, 198, 0.25); margin-left: 9px; }
  .hier-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px;
    border-radius: 8px;
    cursor: pointer;
    user-select: none;
    color: #d6dbee;
    font-size: 0.88rem;
  }
  .hier-row:hover { background: rgba(143,169,255,0.10); }
  .hier-toggle {
    width: 18px; height: 18px;
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 5px;
    background: rgba(255,255,255,0.05);
    color: #cdd5f5;
    font-size: 11px; line-height: 15px; text-align: center;
    padding: 0; cursor: pointer; flex: 0 0 auto;
  }
  .hier-toggle.spacer { border-color: transparent; background: transparent; cursor: default; }
  .hier-meta { margin-left: auto; font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }

  /* ---------- insights ---------- */
  .insight-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 14px;
    align-items: start;
  }
  .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 13px 15px;
  }
  .stat-card b { display: block; font-size: 1.45rem; font-weight: 700; }
  .stat-card span { color: var(--faint); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    padding: 15px 16px;
  }
  .panel h3 { margin: 0 0 12px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--faint); font-weight: 600; }
  .bar-row { display: grid; grid-template-columns: 130px 1fr 36px; align-items: center; gap: 10px; margin-bottom: 7px; font-size: 0.78rem; }
  .bar-row .name { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .bar-row .name:hover { color: var(--ink); }
  .bar-row .track { height: 8px; border-radius: 99px; background: rgba(255,255,255,0.05); overflow: hidden; }
  .bar-row .fill { display: block; height: 100%; border-radius: 99px; }
  .bar-row .num { color: var(--faint); text-align: right; font-size: 0.72rem; }
  .rank-item {
    display: flex; align-items: center; gap: 9px;
    padding: 6px 8px; border-radius: 8px; cursor: pointer;
    font-size: 0.83rem; color: var(--muted);
  }
  .rank-item:hover { background: rgba(255,255,255,0.05); color: var(--ink); }
  .rank-item .num { margin-left: auto; color: var(--faint); font-size: 0.74rem; }
  .issue-item { padding: 7px 9px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 6px; background: rgba(242, 184, 107, 0.06); border: 1px solid rgba(242, 184, 107, 0.18); }
  .issue-item b { cursor: pointer; color: var(--ink); font-weight: 600; }
  .issue-item b:hover { text-decoration: underline; }
  .issue-item span { color: var(--muted); }
  .empty-note { color: var(--faint); font-size: 0.8rem; }

  /* ---------- drawer ---------- */
  #drawer {
    position: fixed;
    top: var(--header-h);
    right: 0;
    bottom: 0;
    width: min(460px, 92vw);
    background: rgba(15, 17, 25, 0.97);
    border-left: 1px solid var(--line);
    transform: translateX(105%);
    transition: transform 0.22s ease;
    z-index: 40;
    display: flex;
    flex-direction: column;
    box-shadow: -24px 0 60px rgba(0,0,0,0.5);
  }
  #drawer.open { transform: translateX(0); }
  #drawer-scroll { overflow: auto; flex: 1; }
  #drawer-close {
    position: absolute; top: 10px; right: 12px;
    z-index: 3;
    width: 30px; height: 30px;
    border-radius: 99px;
    border: 1px solid var(--line);
    background: rgba(10,11,16,0.8);
    color: var(--ink);
    font-size: 15px;
    cursor: pointer;
  }
  .drawer-hero { position: relative; background: #0a0b10; }
  .drawer-hero img { width: 100%; max-height: 290px; object-fit: contain; display: block; cursor: zoom-in; }
  .drawer-body { padding: 16px 18px 30px; }
  .drawer-body h2 { margin: 8px 0 6px; font-size: 1.3rem; line-height: 1.25; }
  .drawer-summary { color: var(--muted); font-size: 0.85rem; line-height: 1.5; margin: 0 0 12px; }
  .meta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px 14px;
    margin: 12px 0;
    padding: 12px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--line-soft);
    border-radius: 12px;
  }
  .meta-item .mk { display: block; color: var(--faint); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.08em; }
  .meta-item .mv { display: block; font-size: 0.82rem; margin-top: 2px; }
  .meta-item .mv.link { color: var(--accent); cursor: pointer; }
  .meta-item .mv.link:hover { text-decoration: underline; }
  .drawer-stats { display: flex; gap: 16px; color: var(--faint); font-size: 0.74rem; margin: 10px 0 4px; }
  .drawer-stats b { color: var(--muted); }
  .drawer-section-title {
    margin: 18px 0 8px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--faint);
    font-weight: 600;
    border-bottom: 1px solid var(--line-soft);
    padding-bottom: 5px;
  }
  .conn-group { margin-bottom: 10px; }
  .conn-group .cg-head { font-size: 0.72rem; color: var(--faint); margin: 8px 0 4px; }
  .conn-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.83rem;
  }
  .conn-item:hover { background: rgba(143,169,255,0.10); }
  .conn-item .kind { margin-left: auto; color: var(--faint); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
  .doc-section h3 { font-size: 0.92rem; margin: 16px 0 6px; color: #dfe4f5; }
  .doc-section p { font-size: 0.83rem; line-height: 1.6; color: var(--muted); margin: 0 0 10px; }
  .doc-section ul { margin: 0 0 10px; padding-left: 20px; }
  .doc-section li { font-size: 0.83rem; line-height: 1.55; color: var(--muted); margin-bottom: 3px; }
  .doc-section code { background: rgba(255,255,255,0.07); border-radius: 5px; padding: 1px 5px; font-size: 0.78rem; }
  .doc-section strong { color: #e6e9f5; }
  .path-line { margin-top: 16px; color: var(--faint); font-size: 0.72rem; word-break: break-all; }
  .drawer-actions { display: flex; gap: 8px; margin: 12px 0 2px; flex-wrap: wrap; }
  .unresolved-box { margin-top: 8px; }
  .unresolved-box .u-item { font-size: 0.78rem; color: #f2b86b; padding: 2px 0; }
  .asset-strip { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .asset-strip img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; }

  /* ---------- lightbox ---------- */
  #lightbox {
    position: fixed; inset: 0;
    background: rgba(4,5,8,0.92);
    display: none;
    align-items: center; justify-content: center;
    z-index: 80;
    cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 90vh; border-radius: 10px; }
</style>
</head>
<body>
<header>
  <div class="brand"><b>Dias</b><span>World Atlas</span></div>
  <nav id="tabs-nav">
    <button data-tab="graph" class="active">Graph</button>
    <button data-tab="explorer">Explorer</button>
    <button data-tab="gallery">Gallery</button>
    <button data-tab="themes">Themes</button>
    <button data-tab="hierarchy">Hierarchy</button>
    <button data-tab="insights">Insights</button>
  </nav>
  <div class="header-search">
    <input id="global-search" placeholder="Search the atlas..." autocomplete="off" />
    <div id="search-results"></div>
  </div>
  <div class="header-stats" id="header-stats"></div>
</header>

<div id="app">
  <section id="tab-graph" class="tab active">
    <div class="rail">
      <div class="rail-group">
        <h3>Categories</h3>
        <div id="cat-filters"></div>
        <div class="btn-row">
          <button class="ghost-btn" id="cats-all">All</button>
          <button class="ghost-btn" id="cats-none">None</button>
        </div>
      </div>
      <div class="rail-group">
        <h3>Layout</h3>
        <label class="slider">Node spacing
          <input id="spacing" type="range" min="60" max="300" step="1" value="150" />
        </label>

2019s informal archives claiming to be part of a **longer index of post-Fracture frequency bands**. The legible section includes the marks **F200** and **F500** alongside brief glosses, enough to make **naming and numbering** of those bands **sticky in scholarly gossip** even when nothing else in the find can be confirmed."}, {"h": "Description", "t": "When reproduced from memory, the fragment is said to show **column-like rows**: one line associating **F200** with **\u201chigh harmonic / lumen field\u201d** language, and another associating **F500** with **\u201cnull / abyssal inversion.\u201d** Later rumor cycles claim a linked **Supplemental Harmonic Ledger Leaf** expanded the set with **F120, F380, F610, and F840** notes, and a **smaller, disputed** set of transcriptions add an **F960** line (or margin gloss), though provenance for each step remains **disputed** and the copies do not all **agree**. The edges are torn; there is no signature page, no official seal, and no consistent chain of custody. Several copies in Veloria and Nauw **do not perfectly match**\u2014suggesting **copying error**, **deliberate fabrication**, or **unstable text** if the object ever sat near a bleed event.\n\n**Material evidence in F432\u2019s favor:** the fragment (or its story) is **plausible** next to other Prime-era notation habits: humans love **catalogs** even when the cosmos refuses to be complete."}, {"h": "Cultural Meaning", "t": "For many, the fragment is the **\u201cpaper witness\u201d** that made **F200 and F500** more than mariner\u2019s poetry\u2014at least as **labels** in debate. For others, it is **a hoax** that let scholars sound informed while still knowing nothing about **who lives in light** or **what names the void**."}, {"h": "Usage", "t": "Lore use: a **concrete, optional anchor** for how F432 became **notation-aware** of neighboring frequencies while remaining **unaware of their full politics and geography**. Story use: a MacGuffin, a forgery trial, a translation puzzle."}, {"h": "Notes", "t": "**Status: rumor** keeps provenance open. A physical file image may be added later without contradicting the fragment\u2019s ambiguous truth."}], "unresolved": []}, {"id": "artifact:prime-relics", "slug": "prime-relics", "label": "Prime Relics", "category": "artifact", "status": "canonical", "themes": ["transfrequency", "lost technology", "ruins", "mystery"], "path": "artifacts/prime-relics.md", "region": "Dias", "parent_region": "", "meta": {"region": "Dias", "artifact_type": "relic class"}, "assets": [], "summary": "Prime Relics are objects and remnants attributed to the Prime Age that exhibit properties modern civilizations cannot replicate.", "words": 171, "sections": [{"h": "Overview", "t": "Prime Relics are objects and remnants attributed to the Prime Age that exhibit properties modern civilizations cannot replicate."}, {"h": "Description", "t": "Prime Relics are often identified by one or more of the following traits:\n\n- functioning across multiple Frequencies\n- behaving consistently despite differing local laws of reality\n- emitting resonance patterns that do not match known frequency signatures\n- containing symbols repeated in ruins found in distant Frequencies\n\nBecause of these traits, many scholars believe the Prime Realm possessed knowledge or technologies far beyond what exists in the Present Age."}, {"h": "Cultural Meaning", "t": "Prime Relics are simultaneously scholarly obsession, religious proof, and political leverage. To some, they are evidence that the Prime Realm can be understood\u2014or restored. To others, they are warnings that whatever preceded the Fracture should remain buried."}, {"h": "Usage", "t": "Most Prime Relics cannot be reliably activated or controlled. They are typically studied, contained, traded, or hidden, depending on the culture and the risks involved."}, {"h": "Notes", "t": "\u201cPrime Relic\u201d is a classification applied after the Fracture; provenance is rarely certain."}], "unresolved": []}, {"id": "artifact:red-sail-crown-standard", "slug": "red-sail-crown-standard", "label": "Red Sail Crown-Standard", "category": "artifact", "status": "canonical", "themes": ["rulership symbol", "contested origin", "realm identity"], "path": "artifacts/red-sail-crown-standard.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)", "artifact_type": "regalia"}, "assets": [], "summary": "The Red Sail Crown-Standard is the signature regalia associated with Vailor Quentin's authority over F432.", "words": 127, "sections": [{"h": "Overview", "t": "The Red Sail Crown-Standard is the signature regalia associated with Vailor Quentin's authority over F432."}, {"h": "Description", "t": "The object is worn as a head-standard shaped in a sail-like form, rendered in a vivid red profile recognizable across major regions of the realm.\n\nIts symbolic weight exceeds its material description: in public memory, the object stands for command, continuity, and the right to issue realm-scale direction."}, {"h": "Cultural Meaning", "t": "Supporters treat the crown-standard as proof of Vailor's legitimacy and stabilizing role. Critics invoke its disputed origin as evidence that authority in F432 may begin in force before becoming institution."}, {"h": "Usage", "t": "The crown-standard appears in formal addresses, major declarations, and ceremonial representations tied to realm unity."}, {"h": "Notes", "t": "Its historical acquisition remains disputed between gift and seizure traditions."}], "unresolved": []}, {"id": "artifact:second-beginning-slate-fragment", "slug": "second-beginning-slate-fragment", "label": "Second-Beginning Slate fragment", "category": "artifact", "status": "canonical", "themes": ["exile law", "mutual obligation", "reconstruction", "physical evidence", "oaths"], "path": "artifacts/second-beginning-slate-fragment.md", "region": "Hearthvale", "parent_region": "", "meta": {"region": "Hearthvale", "artifact_type": "charter fragment"}, "assets": [], "summary": "Second-Beginning Slate fragment is the name for surviving shards of an early Hearth Compact charter\u2014etched slate, sometimes re-fired ceramic\u2014bearing punched lines and repeated pledge phrases from the first generations who treated west Sorel as a place to re...", "words": 266, "sections": [{"h": "Overview", "t": "**Second-Beginning Slate fragment** is the name for **surviving shards** of an early Hearth Compact charter\u2014etched slate, sometimes re-fired ceramic\u2014bearing **punched lines** and **repeated pledge phrases** from the first generations who treated west Sorel as a place to **rebuild** rather than merely survive."}, {"h": "Description", "t": "Fragments vary in size; common marks include:\n\n- a **row of notches** said to count mutual aid days after arrival  \n- a **hollowed palm symbol** (interpreted as *open hand / no first strike*)  \n- a **short clause** in plain language: *In the same drought, no one shall be **sent away twice** from the same well.*\n\nSome pieces are displayed in **cooperative hallways**; others sit in private lockboxes, treated almost like **relics** of personhood. The **Kiln Fires of Second Beginning** myth is often referenced when people explain why fire-baked versions exist alongside **grey slate**\u2014multiple generations re-making the same promise in materials they could trust."}, {"h": "Cultural Meaning", "t": "The fragments function as **tangible \"second beginning\"**\u2014proof that Hearthvale\u2019s law is not only a sentiment but a **repeated, inscribed practice** of **mutual care**. Nauw scholars sometimes request rubbings, not to govern Sorel, but to study how **plain-language oaths of shelter** are written at a border where **pride and need meet**."}, {"h": "Usage", "t": "Lore use: a portable token of Hearthvale identity; story use: a plot object in disputes over **land**, **kin**, or **who counts** as compact member."}, {"h": "Notes", "t": "Compatible with but not required by **The Long Gate Argument**; the physical fragments anchor **Hearth** stories to **object permanence** while the bridge myth anchors **Nauw\u2013Sorel** relation to **argument-as-infrastructure**."}], "unresolved": []}, {"id": "artifact:sketchy-ape-book-club-collection", "slug": "sketchy-ape-book-club-collection", "label": "Sketchy Ape Book Club Collection", "category": "artifact", "status": "canonical", "themes": ["generative identity", "digital ownership", "physical-digital bridge"], "path": "artifacts/sketchy-ape-book-club-collection.md", "region": "The Sketchy Gallery", "parent_region": "", "meta": {"region": "The Sketchy Gallery", "artifact_type": "digital art collection"}, "assets": [], "summary": "A digital generative art collection presented inside The Sketchy Gallery as illuminated display panels.", "words": 103, "sections": [{"h": "Overview", "t": "A digital generative art collection presented inside The Sketchy Gallery as illuminated display panels."}, {"h": "Description", "t": "Each piece portrays a stylized ape assembled from layered visual traits such as clothing, accessories, and facial expression, creating many unique but related characters. In Veloria, these works appear physically as lit panel displays along segments of the gallery's moving corridor."}, {"h": "Cultural Meaning", "t": "The collection represents a bridge between long-standing physical art practices in Veloria and expanding digital expression within F432."}, {"h": "Usage", "t": "Curated in rotating corridor sequences inside The Sketchy Gallery; externally referenced through blockchain ownership records."}, {"h": "Notes", "t": "Collection reference: [Etherscan contract](https://etherscan.io/address/0xadc28cac9c1d53cc7457b11cc9423903dc09dddc)."}], "unresolved": []}, {"id": "artifact:supplemental-harmonic-ledger-leaf", "slug": "supplemental-harmonic-ledger-leaf", "label": "Supplemental Harmonic Ledger Leaf", "category": "artifact", "status": "unknown", "themes": ["d emergence*, tied in lore to **The Half-Made Atlas**-style **mutable** cartography, not a third full expedition dossier."}, {"h": "Cultural Meaning", "t": "For F432 scholars, the leaf marks the shift from \"two dramatic neighboring bands\" to a broader, richer **background spectrum** that can inform myths and story logic without immediate geopolitical consequence. The optional **F960** add-on is read as: *Dias has more bands than our budgets admit*, and *some of them are still drafting themselves.*"}, {"h": "Usage", "t": "Used as an anchor artifact for background references to the four bands in stories centered on F432."}, {"h": "Notes", "t": "Status remains unresolved pending a verified physical provenance chain."}], "unresolved": []}, {"id": "artifact:the-half-made-atlas", "slug": "the-half-made-atlas", "label": "The Half-Made Atlas", "category": "artifact", "status": "canonical", "themes": ["living map", "memory", "revision", "disputed evidence"], "path": "artifacts/the-half-made-atlas.md", "region": "F960 (frequency realm)", "parent_region": "", "meta": {"region": "F960 (frequency realm)", "culture": "The Open Hand of Making", "artifact_type": "mutable cartographic codex"}, "assets": [], "summary": "The Half-Made Atlas is the most referenced cartographic artifact associated with F960: a codex whose mapped layers appear stable in core regions while margin details revise between readings.", "words": 156, "sections": [{"h": "Overview", "t": "**The Half-Made Atlas** is the most referenced cartographic artifact associated with F960: a codex whose mapped layers appear stable in core regions while margin details revise between readings."}, {"h": "Description", "t": "The atlas is physically ordinary in binding and scale but unusual in behavior. Repeated readers report that anchor sectors (Scaffold Arc, Margin Flats, Ghost Quarter) remain recognizable, while edge geometry and route annotations update in subtle, nonrandom ways.\n\nIt does not replace fieldcraft: users stil story drift\" during unstable visibility."}, {"h": "Cultural Meaning", "t": "In Draftkin teaching circles, the panel symbolizes restraint in testimony: accuracy before interpretation, line before legend."}, {"h": "Usage", "t": "Used in witness training, conflict debriefs, and workshop rites where multi-pass disagreements need a shared baseline."}, {"h": "Notes", "t": "Often referenced with the artwork **And This Is** as a paired visual doctrine: narrowed sight, disciplined report."}], "unresolved": []}, {"id": "artifact:veloria-ring-fair-token", "slug": "veloria-ring-fair-token", "label": "Veloria ring-fair token", "category": "artifact", "status": "canonical", "themes": ["fairgrounds", "outer ring life", "gift", "delight", "tradition"], "path": "artifacts/veloria-ring-fair-token.md", "region": "Veloria City", "parent_region": "", "meta": {"region": "Veloria City", "artifact_type": "festival coin"}, "assets": [], "summary": "Veloria ring-fair tokens are small pressed-metal disks (often brass or tin) issued at outer-ring fairs, harvest games, and guild-family days. They are not stable currency: they are memory coins\u2014keepsakes stamped with a year-mark, a ring symbol, and sometime...", "words": 204, "sections": [{"h": "Overview", "t": "**Veloria ring-fair tokens** are **small pressed-metal disks** (often brass or tin) issued at **outer-ring** fairs, harvest games, and guild-family days. They are **not** stable currency: they are **memory coins**\u2014keepsakes stamped with a year-mark, a ring symbol, and sometimes a **joke motto** you had to be there to understand."}, {"h": "Description", "t": "A typical token fits in a palm. The obverse might show a **simplified map** of the concentric city; the reverse, a fruit, a wheel, a fish, or a **smile-shaped flourish** with no official meaning. Children trade them, adults pin them in kitchens, and travelers carry one as **proof a happy hour happened**.\n\nVendors sometimes give tokens to anyone who **tries a game** and fails cheerfully, which is how the \u201closers' medal\u201d became the **most** prized design of certain years."}, {"h": "Cultural Meaning", "t": "In a city whose inner rings can feel **distant and severe**, the tokens are a **soft boast**: *I belonged to a crowd that was only trying to be happy together.*"}, {"h": "Usage", "t": "Lore: background texture for market scenes, fair chapters, and **uplift** B-plots. Real-world: optional prop for world art or merch continuity."}, {"h": "Notes", "t": "Positive by design: **no debt**, **no weapon**, only **souvenir and belonging**."}], "unresolved": []}, {"id": "artifact:veloria-street-flower-pot", "slug": "veloria-street-flower-pot", "label": "Veloria Street Flower Pot", "category": "artifact", "status": "canonical", "themes": ["urban beauty", "civic care", "street commerce", "ringwide continuity"], "path": "artifacts/veloria-street-flower-pot.md", "region": "Veloria City", "parent_region": "", "meta": {"region": "Veloria City", "artifact_type": "civic floral vessel"}, "assets": [], "summary": "A common floral display vessel used across Veloria City, usually holding vibrant yellow blossoms seen from the outer ring to the inner districts.", "words": 186, "sections": [{"h": "Overview", "t": "A common floral display vessel used across Veloria City, usually holding vibrant yellow blossoms seen from the outer ring to the inner districts."}, {"h": "Description", "t": "These pots appear along streets, market lanes, storefronts, and ring-side walkways throughout Veloria. Though individually simple, they function as a repeated visual marker of care and color in daily city life.\n\nThe most recognized arrangement features bright yellow flowers in dense clusters, widely associated with public warmth and neighborhood pride."}, {"h": "Cultural Meaning", "t": "Residents often read the ringwide presence of these flower pots as a subtle symbol that, despite technological differences between city bands, shared civic identity still exists ac
