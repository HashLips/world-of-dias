. Bell towers have been said to **hold** their peals during some episodes.\n\n**Sky-mirror** observers in **Glasswater** sometimes report a coincident **sharper reflection** on the great dams, as if the air column above the fields had thinned a fraction\u2014though instruments rarely agree on pressure changes."}, {"h": "Conditions", "t": "No reliable predictor. Hot mid-days, drizzly evenings, and pre-dawn have all been logged. The phenomenon does not appear to require holidays or markets to be open."}, {"h": "Cultural Interpretations", "t": "- **Marchbound Wardens** treat it as a **warrant for inspection**: a moment to check aging spans, charm-wards, and toll integrity without competing noise.  \n- **Traders** call it good or ill luck in equal measure\u2014either \u201cthe road listening\u201d or \u201cthe road about to **change its terms** without warning.\u201d  \n- **Scholars** link it, cautiously, to **Prime Bridge** echo-theory and to **Averra**-adjacent \u201cweak charm days,\u201d both unproven."}, {"h": "Notes", "t": "Use **Ledger of the still march** for a narrative snapshot of one catalogued episode. The phenomenon is **F432-stability-flavored**\u2014weird, but not apocalyptic; it **widens the world** by suggesting the great routes have **a rhythm** people do not yet understand."}], "unresolved": []}, {"id": "phenomenon:distant-lumen-abyss-bleed", "slug": "distant-lumen-abyss-bleed", "label": "Distant lumen-abyss bleed", "category": "phenomenon", "status": "canonical", "themes": ["leaked resonance", "imperfect awareness", "sky and sea omens", "threshold sensation"], "path": "phenomena/distant-lumen-abyss-bleed.md", "region": "F432 (frequency realm)", "parent_region": "", "meta": {"region": "F432 (frequency realm)"}, "assets": [], "summary": "Distant lumen-abyss bleed", "words": 347, "sections": [{"h": "Name", "t": "Distant lumen-abyss bleed"}, {"h": "Overview", "t": "**Distant lumen-abyss bleed** is the collective label used in F432 for **low-intensity, inconsistent sensory residue** that people associate\u2014by storytelling, instrument anomaly, and guesswork\u2014with **conflict, proximity, or sheer scale** in neighboring frequency bands, especially the **F200** harmonic light field and the **F500** abyssal null. It is not proof of those realms\u2019 inner life; it is **evidence that F432 sometimes notices something it cannot fully parse**."}, {"h": "Description", "t": "Reported features vary by coast, city, and season, but **repeat just enough** to be named:\n\n- A **\u201csecond dawn\u201d** or **pale-gold stutter** along one strip of sky, as if a sunrise were **duplicated and one copy failed**\n- A **pocket of cold** without wind shift, often described as **\u201cabsence with teeth\u201d** (a folk phrase that traveled from harbor taverns to university halls unchanged)\n- Brief **static in hearing**: bells damped, gulls late, a **pressure change** in the inner ear\n- Rarely, **double-edged shadows** for a few minutes\u2014objects casting **two almost parallel shims of darkness** at different depths\n\nThe phenomenon does not damage crops or walls on its own. It disturbs people because it feels **imported**\u2014like a bruise on the world\u2019s skin from a fight **elsewhere in Dias\u2019s layering**."}, {"h": "Conditions", "t": "More often reported in **open horizon contexts** (sea, long plains, high observatories) and during periods when **resonance instruments** (where they exist) show **nonsensical \u201cmirror spikes\u201d** not attributable to F432 weather or known Prime Bridge echoes."}, {"h": "Cultural Interpretations", "t": "- **Folk / maritime reading:** a warning that **light and void still argue**, and the sea route you trust is only **one frequency thick**.\n- **Scholarly reading:** a **threshold artifact** of incomplete models\u2014F432 is **not closed**, only **stably forgetful** of what sits beside it.\n- **Skeptical reading:** mass suggestion plus instrument calibration drift, salted by the **Partial Harmonic Index** rumor cycle."}, {"h": "Notes", "t": "Treat bleed events as **story hooks and atmospheric canon**, not as direct invasion mechanics. F432 remains **largely insulated**; the phenomenon keeps **F200 and F500 present in world-feel** without requiring immediate plot impact on Veloria, Wabet, or Sorel."}], "unresolved": []}, {"id": "phenomenon:four-orb-convergence", "slug": "four-orb-convergence", "label": "Four-Orb Convergence", "category": "phenomenon", "status": "unknown", "themes": ["floating observers", "confluence pressure", "pre-decision omen"], "path": "phenomena/four-orb-convergence.md", "region": "The Bloomline Estuary", "parent_region": "", "meta": {"region": "The Bloomline Estuary"}, "assets": [], "summary": "Four-Orb Convergence is a reported Bloomline event where four eye-like floating spheres appear near high-pressure confluence zones shortly before major civic decisions.", "words": 106, "sections": [{"h": "Overview", "t": "Four-Orb Convergence is a reported Bloomline event where four eye-like floating spheres appear near high-pressure confluence zones shortly before major civic decisions."}, {"h": "Description", "t": "Witnesses report coordinated hovering behavior, synchronized orientation shifts, and abrupt disappearance after stabilization intervals. The event has no confirmed species attribution."}, {"h": "Conditions", "t": "Most reports cluster around heavy-current overlap periods, especially when Tideheart-led holding intervals precede contract or mediation outcomes."}, {"h": "Cultural Interpretations", "t": "Some communities read the orbs as neutral witnesses. Others treat them as pressure markers indicating that collective tone has not yet settled."}, {"h": "Notes", "t": "The artwork *Dots of Color* is commonly used as the primary visual reference for this phenomenon."}], "unresolved": []}, {"id": "phenomenon:gate-ring-response-pattern", "slug": "gate-ring-response-pattern", "label": "Gate Ring Response Pattern", "category": "phenomenon", "status": "canonical", "themes": ["threshold defense", "crowd dynamics", "reactive formation"], "path": "phenomena/gate-ring-response-pattern.md", "region": "DEB Gate of Veloria", "parent_region": "", "meta": {"region": "DEB Gate of Veloria"}, "assets": [], "summary": "Gate Ring Response Pattern", "words": 122, "sections": [{"h": "Name", "t": "Gate Ring Response Pattern"}, {"h": "Overview", "t": "Gate Ring Response Pattern is the recurring defensive choreography observed at the DEB Gate when high-risk approach conditions are detected."}, {"h": "Description", "t": "The pattern combines gate staff motion, blade-guard positioning, and entry-lane compression into a circular response geometry associated with Havren Pike's command doctrine.\n\nObservers describe it as a rapid shift from ceremonial threshold behavior to active defensive posture without full closure unless escalation continues."}, {"h": "Conditions", "t": "Commonly triggered by surge arrivals, conflicting procession claims, breach mimicry, and irregular approach timing."}, {"h": "Cultural Interpretations", "t": "Residents view the pattern as protective competence. Critics interpret it as militarized gate theater that can suppress ambiguous entrants."}, {"h": "Notes", "t": "The pattern is taught as procedural memory among gate watch rotations."}], "unresolved": []}, {"id": "phenomenon:golden-tear-event", "slug": "golden-tear-event", "label": "Golden Tear Event", "category": "phenomenon", "status": "canonical", "themes": ["omen event", "memory instability", "esoteric warning"], "path": "phenomena/golden-tear-event.md", "region": "Averra Isle", "parent_region": "", "meta": {"region": "Averra Isle"}, "assets": [], "summary": "Golden Tear Event", "words": 111, "sections": [{"h": "Name", "t": "Golden Tear Event"}, {"h": "Overview", "t": "Golden Tear Event is the reported occurrence in which golden tears appear during or near periods interpreted as memory-fracture risk."}, {"h": "Description", "t": "The event is defined by visible gold-toned tear emission linked to tightly controlled archival response behavior in Averra circles.\n\nAccounts frequently describe immediate shifts in cloister protocol, including restricted access, sealing actions, and message rerouting."}, {"h": "Conditions", "t": "Most reports come from Averra-adjacent witness chains during rumor-heavy periods involving hidden records, disputed artifacts, or legacy-line transmission."}, {"h": "Cultural Interpretations", "t": "Devotional readings treat the event as truth-warning manifestation. Skeptical readings treat it as authority ritual used to justify information control."}, {"h": "Notes", "t": "Verified direct observations remain limited."}], "unresolved": []}, {"id": "phenomenon:green-garden-shift", "slug": "green-garden-shift", "label": "Green Garden Shift", "category": "phenomenon", "status": "canonical", "themes": ["light tracking", "petal color gradient", "synchronized motion", "restorative observation"], "path": "phenomena/green-garden-shift.md", "region": "Green Garden Border Lanes", "parent_region": "", "meta": {"region": "Green Garden Border Lanes"}, "assets": [], "summary": "Green Garden Shift", "words": 174, "sections": [{"h": "Name", "t": "Green Garden Shift"}, {"h": "Overview", "t": "Green Garden Shift is the recurring daily behavior of the potted border blooms whose sunflower-like heads and petals turn with light while shifting from lighter to darker greens."}, {"h": "Description", "t": "As sun angle changes, the flowers gradually reorient in near-synchronized bands. At the same time, observers report a visible tonal migration in the petals: bright green hues under direct angle, then deeper greens as light moves off-axis.\n\nThe effect is most pronounced when viewed from the lane entrances, where thousands of pots create a moving color field."}, {"h": "Conditions", "t": "Occurs consistently in the Green Garden Border Lanes under normal daylight cycles and remains observable through most clear and partly clouded conditions."}, {"h": "Cultural Interpretations", "t": "Many inhabitants interpret the shift as calming and therapeutic. Travelers from Veloria City, especially those moving toward family visits in Glasswater Fields, often treat a walk through the shifting rows as a personal reset before continuing east."}, {"h": "Notes", "t": "The flowers' precise botanical classification is unresolved in public records; current accounts emphasize observed behavior over taxonomy."}], "unresolved": []}, {"id": "phenomenon:mirror-wake-inversion", "slug": "mirror-wake-inversion", "label": "Mirror-Wake Inversion", "category": "phenomenon", "status": "unknown", "themes": ["reflective anomaly", "self-disclosure", "timed cognition shift"], "path": "phenomena/mirror-wake-inversion.md", "region": "F610 (frequency realm)", "parent_region": "", "meta": {"region": "F610 (frequency realm)"}, "assets": [], "summary": "Mirror-Wake Inversion is a reported F610 interval event in which a person's reflected posture and affect diverge from their active body for a brief window.", "words": 120, "sections": [{"h": "Overview", "t": "**Mirror-Wake Inversion** is a reported F610 interval event in which a person's reflected posture and affect diverge from their active body for a brief window."}, {"h": "Description", "t": "During the event, the reflected figure may appear calmer, older, more wounded, or more resolute than the source body. Observers disagree on whether this is predictive signal, memory bleed, or perception error under reveal stress."}, {"h": "Conditions", "t": "Most reports cluster around high-shear reflective zones in **The Glassfold Ledge**, especially after prolonged vigilance shifts and low-rest periods."}, {"h": "Cultural Interpretations", "t": "Veil Scribes treat the event as admissible but low-certainty evidence and require phase-stamped corroboration before policy action."}, {"h": "Notes", "t": "Often discussed with the artwork **Awake 1** as a visual shorthand for the inversion moment."}], "unresolved": []}, {"id": "phenomenon:quartermark-drift", "slug": "quartermark-drift", "label": "Quartermark Drift", "category": "phenomenon", "status": "unknown", "themes": ["timing offset", "recurrence variance", "route risk"], "path": "phenomena/quartermark-drift.md", "region": "F120 (frequency realm)", "parent_region": "", "meta": {"region": "F120 (frequency realm)"}, "assets": [], "summary": "Quartermark Drift is a reported F120 timing effect where repeated events return close to expected schedule but offset by small, accumulating fractions.", "words": 128, "sections": [{"h": "Overview", "t": "**Quartermark Drift** is a reported F120 timing effect where repeated events return close to expected schedule but offset by small, accumulating fractions."}, {"h": "Description", "t": "Walkers describe the drift as \"same bell, different edge\": meetings recur within familiar windows yet arrive a little early, a little late, or with reordered sequence markers. Over long passages, tiny offsets can produce major route divergence."}, {"h": "Conditions", "t": "Most frequently logged on multi-pass corridors in The Returning Span after several days of stable weather, when travelers become overconfident in rhythm."}, {"h": "Cultural Interpretations", "t": "Refrain Walkers treat quartermark drift as a caution against procedural arrogance. The saying \"count the fourth mark twice\" appears in training notes and traveler etiquette."}, {"h": "Notes", "t": "Often visualized with the artwork **Time Splits** when briefing outsiders on F120 timing behavior."}], "unresolved": []}, {"id": "phenomenon:split-tide-double-presence", "slug": "split-tide-double-presence", "label": "Split-Tide Double Presence", "category": "phenomenon", "status": "canonical", "themes": ["dual manifestation", "mirrored encounters", "fracture residue"], "path": "phenomena/split-tide-double-presence.md", "region": "Nauw Outer Rim Seas", "parent_region": "", "meta": {"region": "Nauw Outer Rim Seas"}, "assets": [], "summary": "Split-Tide Double Presence", "words": 112, "sections": [{"h": "Name", "t": "Split-Tide Double Presence"}, {"h": "Overview", "t": "Split-Tide Double Presence is the observed condition in which Marek Solon appears as two synchronized presences in separate positions at once."}, {"h": "Description", "t": "Witnesses report mirrored posture, staggered echo motion, and brief uncertainty about which presence is primary. The effect is most often observed during route decisions, ritual song intervals, and high-shift maritime conditions."}, {"h": "Conditions", "t": "Most frequently reported in Nauw Outer Rim Seas under active tide movement, migration pressure, and ceremonial watch contexts."}, {"h": "Cultural Interpretations", "t": "Some communities treat the phenomenon as inherited fracture evidence. Others interpret it as unknown biological anomaly, ritual amplification, or intentional performance."}, {"h": "Notes", "t": "No accepted technical model currently explains the condition."}], "unresolved": []}, {"id": "phenomenon:unfinished-edge-drift", "slug": "unfinished-edge-drift", "label": "Unfinished edge drift", "category": "phenomenon", "status": "canonical", "themes": ["boundary motion", "cartographic instability", "soft terrain shift", "navigational skill"], "path": "phenomena/unfinished-edge-drift.md", "region": "The Unfinished", "parent_region": "", "meta": {"region": "The Unfinished", "culture": "The Open Hand of Making"}, "assets": [], "summary": "Unfinished edge drift", "words": 150, "sections": [{"h": "Name", "t": "Unfinished edge drift"}, {"h": "Overview", "t": "Unfinished edge drift is the recurring condition in which local boundaries, edges, and route contours in The Unfinished shift by small but meaningful increments without catastrophic terrain collapse."}, {"h": "Description", "t": "The drift typically manifests as contour bleed, alignment marker migration, and minor relocation of path-ready surfaces. Structural cores usually persist; margins are what move. Because drift is incremental rather than violent, experienced travelers can compensate using multi-pass charts."}, {"h": "Conditions", "t": "Most common near the Erasure Verge and after high activity periods in the Revision Delta. Reports suggest reduced drift where maintenance teams refresh guide marks on short cadence cycles."}, {"h": "Cultural Interpretations", "t": "- F960 locals read drift as normal realm respiration, not disaster.\n- Outsiders often misread it as corruption or map failure.\n- Technical practitioners frame it as a maintenance problem: update often, travel intelligently."}, {"h": "Notes", "t": "Drift creates plot pressure without needing apocalypse stakes."}], "unresolved": []}, {"id": "phenomenon:velorian-basin-gilding-hour", "slug": "velorian-basin-gilding-hour", "label": "Velorian Basin gilding hour", "category": "phenomenon", "status": "canonical", "themes": ["beauty", "golden light", "calm", "hope", "natural wonder"], "path": "phenomena/velorian-basin-gilding-hour.md", "region": "Velorian Basin", "parent_region": "", "meta": {"region": "Velorian Basin"}, "assets": [], "summary": "Velorian Basin gilding hour", "words": 215, "sections": [{"h": "Name", "t": "Velorian Basin gilding hour"}, {"h": "Overview", "t": "**Velorian Basin gilding hour** is the local name for a common **late-day lighting condition** in the **Velorian low country**: when the sun lowers across river mist and tilled land, the whole basin can look **gilded**\u2014soft gold on water, long gentle shadows, and a brief sense that the air itself is **on your side**, even if the day was hard."}, {"h": "Description", "t": "The phenomenon is **meteorological and optical**, not magical in established canon. It is nevertheless **culturally charged**: lovers wait for it, painters race for it, and **outer-ring** workers sometimes stop mid-task just to let it pass through, like a small **permission** to be glad.\n\nSongs reference it. Children are told it is **\u201cthe basin saying good job.\u201d** Adults roll eyes and then stand still anyway."}, {"h": "Conditions", "t": "Most frequent on **clearing days** after light rain, when mist lifts but does not leave entirely. Less common in **high-smoke** or storm seasons."}, {"h": "Cultural Interpretations", "t": "- **Practical:** good light for **safe** travel, easy faces, and warm stones.  \n- **Romantic / hopeful:** a daily proof that the realm can be **soft** without being weak."}, {"h": "Notes", "t": "Paired intentionally with **The Sun-Sweet Afternoon** myth\u2014**seasonal warmth** vs **evening gilding**\u2014as two \u201chappy time\u201d anchors for the same region."}], "unresolved": []}, {"id": "phenomenon:vent-sprout-spread", "slug": "vent-sprout-spread", "label": "Vent-sprout spread", "category": "phenomenon", "status": "canonical", "themes": ["contagious venting", "ground-plate shift", "omen geology", "daughter vents"], "path": "phenomena/vent-sprout-spread.md", "region": "Driftfall", "parent_region": "", "meta": {"region": "Driftfall"}, "assets": [], "summary": "Vent-sprout spread is the rare, feared behavior linked to eruptions from Sprout Vent: magma landing or overspilling in a place can, under certain conditions, trigger a new tiny vent at that site.", "words": 312, "sections": [{"h": "Overview", "t": "**Vent-sprout spread** is the rare, feared behavior linked to eruptions from **Sprout Vent**: magma landing or overspilling in a place can, under certain conditions, trigger a new tiny vent at that site."}, {"h": "Description", "t": "The phenomenon does not happen on every drop of lava. Most overflow cools, scars rock, and stops.\n\nWhen spread does occur, witnesses report a short sequence:\n\n1. Magma from Sprout Vent lands or pools on open ground.\n2. Local strata **shift**\u2014not as a full quake, but as a pressured slide along thin ground plates.\n3. Heat concentrates under the landing site.\n4. A **daughter vent** forms: a small new sprout, sometimes only knee-high, still warm long after the parent eruption ends.\n\nOver many cycles this explains Sprout Vent's strange profile and the scattered mini-vents across southeastern Driftfall."}, {"h": "Conditions", "t": "Spread is inconsistent. Recorded factors that increase likelihood (none guaranteed):\n\n- Fresh magma still moving when it settles, not only cooled splash\n- Landing on fracture-prone strata rather than packed sand or old stone\n- Parent eruption strong enough to throw material beyond the main cone\n\nSpread is **not** observed from ordinary campfires, forge slag, or unrelated hot springs."}, {"h": "Cultural Interpretations", "t": "Driftfall readers treat a new sprout as an omen, not a weather report.\n\nCommon interpretations include:\n\n- **A place has been marked** \u2014 whoever owns, camps, or crosses that ground should expect attention from fate, rivals, or the vent itself\n- **A story is about to fork** \u2014 locals say \"the ground chose a second mouth\" when politics or trade routes are already tense\n- **A warning to move** \u2014 daughter vents near settlements usually trigger relocation faster than argument\n\nHearthvale accounts often call the behavior superstition. Driftfall accounts treat it as practical geology with a moral shadow."}, {"h": "Notes", "t": "Use vent-sprout spread sparingly in narrative; its power comes from rarity and consequence, not constant eruption."}], "unresolved": []}, {"id": "phenomenon:wall-eye-drift", "slug": "wall-eye-drift", "label": "Wall-Eye Drift", "category": "phenomenon", "status": "unknown", "themes": ["moving scrutiny", "reflective instability", "witness discomfort"], "path": "phenomena/wall-eye-drift.md", "region": "The Glassfold Ledge", "parent_region": "", "meta": {"region": "The Glassfold Ledge"}, "assets": [], "summary": "Wall-Eye Drift is a reported Glassfold interval event in which repeated eye-like forms appear across broad wall surfaces and seem to track nearby movement.", "words": 110, "sections": [{"h": "Overview", "t": "Wall-Eye Drift is a reported Glassfold interval event in which repeated eye-like forms appear across broad wall surfaces and seem to track nearby movement."}, {"h": "Description", "t": "Witnesses report synchronized gaze shifts without visible speech, signal, or mechanical source. The effect is strongest during medium-duration reveal windows and often produces route hesitation."}, {"h": "Conditions", "t": "Most accounts occur near reflective wall planes under unstable light geometry, especially when travelers move in staggered single-file lines."}, {"h": "Cultural Interpretations", "t": "Some interpret the event as neutral environmental feedback. Others read it as a warning that social intent and route discipline are being silently judged."}, {"h": "Notes", "t": "Institutional use of Wall-Eye Drift claims remains cautious unless phase-stamped."}], "unresolved": []}, {"id": "region:aelwyn-canopy", "slug": "aelwyn-canopy", "label": "Aelwyn Canopy", "category": "region", "status": "canonical", "themes": ["jungle forests", "elevated living", "ecological restraint", "roaming harvest culture"], "path": "regions/aelwyn-canopy.md", "region": "F432 (frequency realm)", "parent_region": "Wabet", "meta": {"region": "F432 (frequency realm)", "parent_region": "Wabet", "place_type": "region"}, "assets": [], "summary": "Aelwyn Canopy is a vast jungle-forest region across northern Wabet, covering most of the top of the region and extending somewhat southward.", "words": 184, "sections": [{"h": "Overview", "t": "Aelwyn Canopy is a vast jungle-forest region across northern Wabet, covering most of the top of the region and extending somewhat southward."}, {"h": "Description", "t": "The region is dominated by towering canopies that filter sunlight into shifting bands across the forest floor. Rivers and tributaries run through dense growth zones, supporting rich biodiversity and stable wildlife corridors.\n\nSmall resident tribes live quietly among the trees, constructing elevated walkways and wooden dwellings designed to merge with surrounding vegetation rather than replace it.\n\nIts footprint stretches across the northern edge of Wabet, with smaller reaches running down into the northwest and north-central interior."}, {"h": "Lore", "t": "The guiding law of Aelwyn Canopy is: \"Take only what is needed, and return what can be returned.\"\n\nAlongside resident tribal lifeways, the region is known for roaming Lucky Farmer camps that survey canopy routes for rare perfect-form Lucky Fruits and intermittently feed rumor-driven trade.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Tribal | 3 | Canopy Kin | Oryn Pell, Canopy Elder of Aelwyn Canopy |"}, {"h": "Stories or Depictions", "t": ""}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:aurel-meridian", "slug": "aurel-meridian", "label": "Aurel Meridian", "category": "region", "status": "canonical", "themes": ["corridor", "habitation", "harmonic order", "golden light"], "path": "regions/aurel-meridian.md", "region": "F200 (frequency realm)", "parent_region": "F200 (frequency realm)", "meta": {"region": "F200 (frequency realm)", "parent_region": "F200 (frequency realm)", "place_type": "region"}, "assets": [], "summary": "Aurel Meridian is the primary inhabited and navigable sub-region of F200: a long rectangular band of intensified, stable radiance that readers of charts treat as the realm\u2019s \u201cbright spine\u201d\u2014the place where energy-beings and coherent structures are most often...", "words": 401, "sections": [{"h": "Overview", "t": "Aurel Meridian is the primary **inhabited and navigable** sub-region of F200: a **long rectangular band** of intensified, stable radiance that readers of charts treat as the realm\u2019s \u201cbright spine\u201d\u2014the place where **energy-beings and coherent structures** are most often encountered."}, {"h": "Description", "t": "**Cartographic / map portrayal (for visualization)**  \nOn a map, Aurel Meridian appears as a **stretched rectangle**\u2014often drawn **inside** the larger F200 rectangle, aligned with the realm\u2019s long axis. Its border is not a hard cliff or river edge but a **luminance step**: a crisp increase in **gold-white saturation** and **fine line-grid texture** (like brushed silk in light) that separates the meridian from the slightly dimmer, smoother fields to either side. The long sides of the rectangle are nearly parallel; corners are **exact** in symbolic charts, as if the region were defined by **geometry of resonance** rather than erosion.\n\n**What it looks like on approach**  \nThe meridian reads as a **procession of light**: brighter ribs of radiance (vertical or diagonal depending on the observer\u2019s \u201ccompass\u201d in F200) that pulse slowly with **the rhythm of a resting breath**. There is no topsoil, no treeline\u2014only **luminous strata**, **filament tangles** that function as path or boundary, and **haloed volumes** that suggest architecture without casting shadows in a familiar way. Microscopic flicker at the \u201cground plane\u201d is sometimes described as **shimmering dust made of time-sliced photons**\u2014a poetic observation, not a lab claim.\n\n**Inhabitants**  \nAurel Meridian is the region most associated with the **Aurel-kind**\u2014beings of coherent energy and stable identity in F200. They are not described as a single empire so much as a **community of pattern**: gatherings along the meridian that resemble **festival rows of light** or **standing choirs of harmonics** when seen from outside."}, {"h": "Lore", "t": "Scholars from calmer frequencies sometimes call Aurel Meridian a **safety of shape**: a place where the overwhelming purity of F200 becomes **legible, habitable, and social** because the long rectangle compresses the realm\u2019s field into a navigable, repeatable form."}, {"h": "Stories or Depictions", "t": "Cartographers sometimes nickname the meridian **\u201cthe long peace\u201d** because its chart outline\u2014a rectangle inside a rectangle\u2014resembles a **frame inside a frame**, as if the realm chose to make room for life by **drawing a hall of light** down its own length."}, {"h": "Notes", "t": "Use the **outer F200 map rectangle** for realm scale; use **Aurel Meridian** for the inner **high-population, high-clarity** band when generating close-up or narrative-local imagery."}], "unresolved": []}, {"id": "region:averra-isle", "slug": "averra-isle", "label": "Averra Isle", "category": "region", "status": "canonical", "themes": ["small isle", "maritime mystery", "obscured present", "rumored magic teachers", "hidden council rumor"], "path": "regions/averra-isle.md", "region": "F432 (frequency realm)", "parent_region": "Nauw", "meta": {"region": "F432 (frequency realm)", "parent_region": "Nauw", "place_type": "island"}, "assets": [], "summary": "Averra Isle is a small island off the south-west coast of Nauw. Mainland accounts agree on little beyond its size and location; what occurs on the isle at present is largely unknown.", "words": 772, "sections": [{"h": "Overview", "t": "Averra Isle is a small island off the south-west coast of Nauw. Mainland accounts agree on little beyond its size and location; what occurs on the isle at present is largely unknown."}, {"h": "Description", "t": "From the Nauw mainland, Averra appears as a compact patch of land and cliff\u2014large enough to hide settlements from casual sight, yet too small to dominate sea charts the way a true archipelago might. Ferry traffic and harbor records are sparse and contradictory.\n\nTravelers' tales mention smoke, lights, or silence where they expected harbors; merchants sometimes cancel contracts rather than land. No authoritative survey has mapped the interior in recent years for public record.\n\n### What mainland observers *can* document (without landing)\n\nAverra remains **obscure on purpose**, but a present-day file still needs **repeating facts** a novelist can rest weight on. Off-isle watchers agree on a few **stable names for visible anchors**\u2014not explanations, only *bearings*:\n\n- **The Gray Post** \u2014 A **single, narrow pier** sometimes visible in calm seas, sometimes \u201cabsent\u201d in the same tide week. Harbormasters in Veloria file it as **unreliable infrastructure**, as if the isle inhales and exhales permission.\n- **Crown Ash** \u2014 A **cliff-edge ruin of pale stone** that catches the last light. No banner flies; the shape alone is enough to fix position for ships waiting out squalls.\n- **Hearthline** \u2014 A line of **low, aligned smoke** or heat-shimmer in cool months, as if a row of field kilns or hearths were tuned to a single draught. Whether it is agriculture, art-firing, or something else, **no one off-isle confirms**.\n\nThese three names circulate in **pilot\u2019s chalk**, not official charts\u2014exactly the kind of half-public texture that makes Averra feel *alive* even when its interior is unknown.\n\n### Seasonal patterns (as seen from a distance)\n\n- **Feather months (late spring):** flocks lift off the isle in unusual density; Nauw bird-market poets write songs about *Averra\u2019s borrowed wings*.\n- **Blue weeks (midsummer):** some years the sea at the isle\u2019s edge reads a **stained turquoise**; chemists in Veloria bicker, lovers claim romance, captains add an extra day\u2019s water \u201cjust in case.\u201d\n- **Hush of smoke (autumn):** the **Hearthline** tightens or widens; mainland mothers tell children the isle is \u201c**sorting embers**,\u201d which helps nothing and comforts everything.\n- **Glass winter:** fewer lights, more rumor; the **Sketchy** crowd claims \u201cgood buyers always leave room for Averra in a budget,\u201d meaning **mystery as luxury**.\n\n### Recurring rite: The Offshore Pass (not a party\u2014an etiquette)\n\nYou do not need a ticket to *participate* in this one from the mainland. On the **new moon** nearest winter solstice, a thin chain of **hand-lamps** appears along the Crown Ash ridge, each moving **one slot** along the line through the night\u2014too orderly for accident, too quiet for a festival. Veloria\u2019s basins and Nauw quays have taken to a gentle habit: at that hour, some households set **one lamp in a window** facing seaward, not bright enough to reach Averra, but enough to **answer politeness with politeness**. No doctrine owns it. It is a **public ritual of alignment**, not proof of conspiracy."}, {"h": "Lore", "t": "Veloria hears rumors\u2014smuggling coves, closed communes, old art colonies\u2014but none are confirmed. A widespread myth claims the isle once held Old Masters who taught the root arts later seen across Glasswater Fields, Brindle March, and the Velorian Basin (see Old Masters of Averra Isle); no proof links today's silence on Averra to those tales. Some of the earliest works reputedly shown in The Sketchy Gallery are still attributed to artists said to have lived on Averra Isle when passage there was safer or better documented; whether anyone still works in that lineage on the island remains unclear.\n\nAnother active myth names seven cloaked figures as an unseen council on Averra, allegedly tied to unexplained turns of fate in Nauw and, in stronger rumor variants, to Lucky Fruit appearances in Wabet (see The Seven of Averra Isle). No public record verifies these claims.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Cultural + Esoteric | 3 | Quiet Cloister | Sael Corvin, Veil Keeper of Averra Isle |"}, {"h": "Stories or Depictions", "t": "**Sael Corvin** and **The Seven of Averra** threads supply character-scale entry points; the **Offshore Pass** supplies a **recurring, shared calendar event** for novels that never need to set foot onshore. **Ascension Day** and **The Two Pillars Witness** add a public-ritual lens where authority is staged, witnessed, and argued over rather than cleanly explained. **Blind Eyes** and **The Blind Eyes Vigil** add a parallel witness-discipline strand focused on verification under rumor pressure."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:brindle-march", "slug": "brindle-march", "label": "Brindle March", "category": "region", "status": "canonical", "themes": ["overland travel", "road networks", "transit culture", "folklore of magic"], "path": "regions/brindle-march.md", "region": "F432 (frequency realm)", "parent_region": "Nauw", "meta": {"region": "F432 (frequency realm)", "parent_region": "Nauw", "place_type": "region"}, "assets": [], "summary": "Brindle March is Nauw's central belt of roads and bridges, running between the Velorian Basin (north-west, around Veloria City) and the Glasswater Fields to the east. It also links Nauw to neighboring realms.", "words": 314, "sections": [{"h": "Overview", "t": "Brindle March is Nauw's central belt of roads and bridges, running between the Velorian Basin (north-west, around Veloria City) and the Glasswater Fields to the east. It also links Nauw to neighboring realms."}, {"h": "Description", "t": "Geographically, the march sits in the middle of Nauw: westward and north-westward connections feed the basin and the capital; eastward lanes open onto the great agricultural spread of Glasswater Fields. The network is composed of interconnected roads, bridge systems, and traveling settlements that support constant movement.\n\nIt remains the primary terrestrial path from central Nauw to Wabet and, along its southern reach, toward Sorel. The southern reach feeds the great span that crosses from southern Nauw into Hearthvale on Sorel's northern side, making Brindle March the usual overland approach for that crossing.\n\nMany distant travelers first encounter Nauw through Brindle March before moving toward Veloria City and the basin markets."}, {"h": "Lore", "t": "The guiding law of Brindle March is: \"Every traveler has a road.\"\n\nTravelers repeat a rumor that the resilient charms on certain old spans and toll-wards along the march trace back to students of the Old Masters on Averra Isle. The tale is widely told and weakly documented; see Old Masters of Averra Isle.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Structured + Transit | 2 | Marchbound Wardens | Bren Holloway, Road Marshal of Brindle March |"}, {"h": "Stories or Depictions", "t": "**Brindle March stillness** and **Ledger of the still march** name a rare, route-wide hush and the disputed archive of its episodes. **The Long Gate Argument** and **The Census Echoes of the Prime Mark** appear in travel sermon and scholar tavern talk as *big* explanations for why a road can feel like more than wood and stone. In civic halls, **Balance 1** and **The Load-Balance Trial** are often paired as visual-and-legal shorthand for burden-sharing disputes."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:deb-gate-of-veloria", "slug": "deb-gate-of-veloria", "label": "DEB Gate of Veloria", "category": "region", "status": "canonical", "themes": ["city threshold", "protection", "monumental architecture", "symbolic form"], "path": "regions/deb-gate-of-veloria.md", "region": "Nauw", "parent_region": "Veloria City", "meta": {"region": "Nauw", "parent_region": "Veloria City", "place_type": "landmark"}, "assets": [], "summary": "The DEB Gate of Veloria is the principal entrance landmark to Veloria City: a massive dual-gate structure whose silhouette echoes an upside-down D and E form, based on the DEB logo shape.", "words": 254, "sections": [{"h": "Overview", "t": "The DEB Gate of Veloria is the principal entrance landmark to Veloria City: a massive dual-gate structure whose silhouette echoes an upside-down D and E form, based on the DEB logo shape."}, {"h": "Description", "t": "The entrance complex rises to the height of the highest fourth-layer towers and stands within the fortified boundary of the city. Veloria is enclosed by an enormous sandstone wall, and this gate system is built into that defensive perimeter.\n\nThe gateway consists of two monumental gate leaves, normally kept shut and opened only when visitors are permitted to enter the city. This controlled opening is intended to safeguard Veloria's residents and maintain order at the city's threshold.\n\nMaterially, the structure combines stone, gold, silver, and wood: major framing and wall integration in stone; gateworks in gold and silver; and large wooden doors reinforced with silver ornamentation. Engraved across the doors are floating figures representing the Sky Drifters."}, {"h": "Lore", "t": "In local interpretation, the gate serves both as a defense mechanism and as a statement of identity: Veloria's boundary is physically sealed, but visually tied to symbolic forms and skyborne mysteries.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Structured | 4 | Gate Ward | Havren Pike, Gate Lord of the DEB Gate of Veloria |"}, {"h": "Stories or Depictions", "t": "Design reference for canonical silhouette: `assets/deb-logo.svg`.\n\nGate-culture depictions include **Before I Kneel** and the training myth **The Before-I-Kneel Oath**, both emphasizing lawful restraint over brute display."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:driftfall", "slug": "driftfall", "label": "Driftfall", "category": "region", "status": "canonical", "themes": ["improvised settlements", "personal autonomy", "constant movement", "wild frontier", "rogues and outlaws", "rebellion", "relaxed fatalism", "hanging-about culture", "baltic coastal influence", "volcanic omen geology"], "path": "regions/driftfall.md", "region": "F432 (frequency realm)", "parent_region": "Sorel", "meta": {"region": "F432 (frequency realm)", "parent_region": "Sorel", "place_type": "territory"}, "assets": [], "summary": "Driftfall is the eastern territory of Sorel, a rugged band of shifting settlements and strongly independent inhabitants separated from Hearthvale by a rough north\u2013south partition through Sorel's interior. Next to Hearthvale's slower rebuilding ethos, Driftf...", "words": 391, "sections": [{"h": "Overview", "t": "Driftfall is the eastern territory of Sorel, a rugged band of shifting settlements and strongly independent inhabitants separated from Hearthvale by a rough north\u2013south partition through Sorel's interior. Next to Hearthvale's slower rebuilding ethos, Driftfall reads as the realm's roughest frontier: edgy, rogue-minded, and quick to shrug off anyone else's rules."}, {"h": "Description", "t": "Driftfall occupies the eastern side of Sorel, running roughly north\u2013south so that, together with Hearthvale, the two territories split most of Sorel down the middle\u2014Hearthvale to the west, Driftfall to the east.\n\nSettlements in Driftfall are often provisional and frequently reconfigured as groups arrive, merge, separate, or move onward. Social organization remains fluid, and local norms vary sharply between enclaves.\n\nThe territory attracts people who prioritize autonomy over institutional structure.\n\nDaily life leans wilder than in western Sorel. Mainlanders compare it to a Wild West in miniature: half outlaw country, half improvised nation, where sharp dealers, true believers, artists, and drifters cross paths in the same yards, stalls, and staging grounds. People here skew more rebellious and rogue in manner, quicker to risk reputation and safety on a whim\u2014which is why some of the most interesting figures in F432 are said to turn up in Driftfall before anywhere else.\n\nAlong the eastern shores, a Baltic-leaning coastal culture tempers that edge with a distinct laid-back rhythm. People gather, lounge, play, and \"hang about\" with no urgency to force a day into productivity, even while an underlying sense of danger never fully leaves the atmosphere.\n\nOn the southeastern flank, inland from those beaches, **Sprout Vent** rises: a modest active volcano that still dominates local ground. Its cluster of sprouting points and rare **vent-sprout spread** (daughter vents where magma lands) make the southeastern approach one of Driftfall's most watched\u2014and most argued-about\u2014landmarks."}, {"h": "Lore", "t": "The guiding law of Driftfall is: \"Freedom belongs to those who claim it.\"\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Frontier | 3 | Drift Crews | Vexra Coil, Free-Captain of Driftfall |"}, {"h": "Stories or Depictions", "t": "**The Drift Hour with No Captain** is the common mythic account of the territory\u2019s *first* law emerging from a captainless hour\u2014motion as constitution.\n\n**Sprout Vent** and **vent-sprout spread** supply Driftfall's main geological omen thread: infrequent parent eruptions, contagious ground sprouting, and the scattered mini-vents that reshape how crews read southeastern routes."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:f120-frequency-realm", "slug": "f120-frequency-realm", "label": "F120 (frequency realm)", "category": "region", "status": "canonical", "themes": ["echo", "variation", "memory", "recurrence", "gentle unease"], "path": "regions/f120-frequency-realm.md", "region": "Dias", "parent_region": "Dias", "meta": {"region": "Dias", "parent_region": "Dias", "place_type": "realm"}, "assets": ["assets/f120-map.png"], "summary": "F120 is commonly described as the echo band: a frequency where events recur in recognizable patterns, but never repeat exactly.", "words": 235, "sections": [{"h": "Overview", "t": "**F120** is commonly described as the **echo band**: a frequency where events recur in recognizable patterns, but never repeat exactly."}, {"h": "Description", "t": "F120 does not trap people in loops. Instead, it produces **near-return**: similar scenes, phrases, routes, and meetings with altered timing, tone, or outcome. Witnesses describe the realm as if memory and future were standing slightly out of sync.\n\nIn visual terms, F120 is represented through interrupted concentric structures, offset reflections, and trail marks that appear to have been walked more than once by different feet."}, {"h": "Lore", "t": "The most cited internal region is **The Returning Span**, where recurrence patterns become cartographically legible enough for route planning.\n\n### Awareness in F432\n\nIn F432, F120 is usually discussed in story circles and road folklore: \"the same road, not the same day.\" Formal institutions treat it as plausible but low-confidence compared to F200/F500 documentation."}, {"h": "Stories or Depictions", "t": "F120 often appears as ring motifs with slight breaks, doubled landmarks, and paired notes in ledgers.\n\nThe **F120 Map** artwork is the current visual reference for **The Returning Span** and lane-based echo geography; see `assets/f120-map.png`.\n\nLater motif work such as **Time Splits** is often used with **Quartermark Drift** briefings to explain why matching clock reads can still produce diverging outcomes in recurring passes."}, {"h": "Notes", "t": "Use F120 as thematic support for legacy arcs, repeated choices, and \"history with drift,\" not as a hard time-loop mechanic."}], "unresolved": []}, {"id": "region:f200-frequency-realm", "slug": "f200-frequency-realm", "label": "F200 (frequency realm)", "category": "region", "status": "canonical", "themes": ["light", "serenity", "resonance", "energy life", "geometric clarity"], "path": "regions/f200-frequency-realm.md", "region": "Dias", "parent_region": "Dias", "meta": {"region": "Dias", "parent_region": "Dias", "place_type": "realm"}, "assets": ["assets/f200-map.png"], "summary": "F200 is a high-resonance frequency realm within Dias, commonly described as pure luminosity: an atmosphere of calm, golden light where matter reads less like soil and water and more like held radiance and stable harmonic fields.", "words": 514, "sections": [{"h": "Overview", "t": "F200 is a high-resonance frequency realm within Dias, commonly described as **pure luminosity**: an atmosphere of calm, golden light where matter reads less like soil and water and more like **held radiance** and stable harmonic fields."}, {"h": "Description", "t": "**Cartographic / map portrayal (for visualization)**  \nWhen F200 is drawn as a map, the realm is most often shown as a **very long, narrow rectangle**\u2014width modest relative to length, edges ruler-clean\u2014oriented as if it were a **single luminous band** cut from a spectrum. The fill is not terrain in the usual sense: there is **no greenery, no blue hydrology, no weathered rock**. Instead, the \u201cground\u201d and \u201csky\u201d read as a continuous field of **warm gold-to-champagne light**, with subtle shifts in **brightness, grain, and striation** where older charts imply stable harmonic zones. Fine geometric seams\u2014hairline parallax lines, barely visible as lighter filaments\u2014occasionally suggest fold-planes, like light folded on itself.\n\n**Atmosphere and scale**  \nThe air, if the word applies, feels **serene, weightless, and intensely alive without aggression**. Sound tends to be soft, bell-like, or absent; color temperature skews **late-afternoon sun through pale amber glass**. Distant \u201cdepth\u201d is often represented as a gentle falloff from brighter foreground panels to a slightly dimmer, more diffuse distance\u2014never storm, never night.\n\n**Life**  \nF200 supports **energy-native beings** and structures that look like **architecture made of filaments, lenses, and standing waves** rather than cut stone. Carbon-style ecosystems as known from F432 do not map cleanly here: ecologies are **light-flow ecologies**\u2014communities and phenomena organized around current, coherence, and pattern preservation."}, {"h": "Lore", "t": "The best-documented **inhabited structure** within F200 is **Aurel Meridian**, a sub-region that appears on charts as a **second long rectangle** nested inside the realm\u2019s overall rectangle\u2014an energetic corridor or \u201cbright spine\u201d where energy-kind populations and stable phenomena are most often reported.\n\nF200 stands in **sharp contrast** to the low-resonance **F500** abyss: where F200 reads as **clarity, saturation, and composed peace**, F500 reads as **absence, inversion, and unbounded dark**.\n\n### Awareness in F432\n\nF432 does not \u201csee\u201d F200 the way it sees a coastline. Knowledge arrives as **partial harmonics**: **leaked glow in the sky**, instrument jokes, and **disputed index fragments**\u2014enough to **name** the band and guess at **serene energy life**, not enough for most ring-cities to treat it as a **trade partner** or **mapped ally**. Encounters matter for **story and omen**, rarely for **day-to-day governance** in Nauw, Wabet, or Sorel."}, {"h": "Stories or Depictions", "t": "Travelers\u2019 tales from other frequencies often flatten F200 into a **single geometric icon** (triangle, circle, or line) in marginal diagrams\u2014simplified emblems of **high purity and order**\u2014while actual realm maps return to the **elongated rectangle** as the more faithful large-scale frame.\n\nThe **F200 Map** artwork is the current **visual reference** for that large-scale frame, **Aurel Meridian** as the bright spine, and **Dias**-level context panels; see `assets/f200-map.png` and the artwork entry **F200 Map**."}, {"h": "Notes", "t": "F200 and F432 are both frequency realms, but F200\u2019s **physics-of-appearance** is less material and more **luminous-harmonic**; do not assume F432 cartographic conventions (forests, seas, frontiers) transfer without translation."}], "unresolved": []}, {"id": "region:f380-frequency-realm", "slug": "f380-frequency-realm", "label": "F380 (frequency realm)", "category": "region", "status": "canonical", "themes": ["emotional climate", "bloom states", "vulnerability", "expression", "warmth"], "path": "regions/f380-frequency-realm.md", "region": "Dias", "parent_region": "Dias", "meta": {"region": "Dias", "parent_region": "Dias", "place_type": "realm"}, "assets": ["assets/f380-map.png"], "summary": "F380 is known as the Hearttide band: a frequency where emotional tone and environmental manifestation are closely coupled.", "words": 178, "sections": [{"h": "Overview", "t": "**F380** is known as the **Hearttide band**: a frequency where emotional tone and environmental manifestation are closely coupled."}, {"h": "Description", "t": "In F380, mood behaves like weather. Relief can widen color fields; fear can narrow spatial feel; grief can mute texture and sound. These effects are usually gradual and communal rather than sudden magical shock events.\n\nMaps depict F380 with gradient bands, pulse-like currents, and estuary-style branching transitions between emotional states."}, {"h": "Lore", "t": "The internal map anchor is **The Bloomline Estuary**, where flow boundaries between states are trackable enough to chart.\n\n### Awareness in F432\n\nF432 references F380 when trying to explain why some gatherings \"change a place\" without obvious physical cause. Most mentions remain in poet logs, healer notes, and performance communities."}, {"h": "Stories or Depictions", "t": "Depictions emphasize color drifts and atmospheric transitions rather than fixed walls or nation-style borders.\n\nThe **F380 Map** artwork is the current visual reference for **The Bloomline Estuary** and the five mood-currents layout; see `assets/f380-map.png`."}, {"h": "Notes", "t": "Use F380 to enrich character-centered arcs and communal healing/reconciliation beats in broader Dias stories."}], "unresolved": []}, {"id": "region:f432-frequency-realm", "slug": "f432-frequency-realm", "label": "F432 (frequency realm)", "category": "region", "status": "canonical", "themes": ["stability", "trade", "exploration"], "path": "regions/f432-frequency-realm.md", "region": "Dias", "parent_region": "Dias", "meta": {"region": "Dias", "parent_region": "Dias", "place_type": "realm"}, "assets": [], "summary": "F432 is one of the known frequency realms within Dias.", "words": 452, "sections": [{"h": "Overview", "t": "F432 is one of the known frequency realms within Dias."}, {"h": "Description", "t": "Like all frequencies, it represents a layer of reality defined by its unique resonance. The landscapes and inhabitants of F432 appear relatively stable compared to some other recorded frequencies, allowing settlements, travel routes, and trade networks to develop across its regions. Many different forms of life can be found here, including humans, animals, and other beings whose origins may lie in distant parts of Dias.\n\nWhile F432 is well explored compared to many other frequencies, **its everyday institutions only partly understand** how it sits beside other bands. **F200**, **F500**, and **F960** are now accompanied in records by quieter background bands (**F120**, **F380**, **F610**, **F840**) mostly via supplemental ledgers and story circulation. In all cases, neighboring frequencies are treated as partial intelligence and narrative context rather than stable policy terrain."}, {"h": "Lore", "t": "Documented regions within F432 include Nauw, Wabet, and Sorel.\n\nCurrent geographic framing places Wabet along the full western side of the F432 map, Nauw in the north-east, and Sorel in the south-east (south of Nauw and east of Wabet).\n\nMost F432 trade uses the **VEL Mark** standard for practical inter-regional pricing and settlement. Local tender forms still exist, but VEL is the dominant shared physical currency across Nauw, Wabet, and Sorel.\n\nThis does **not** mean Dias has a single currency model. Other frequencies may use non-note exchange systems, including value anchored to strategic minerals, rare resources, or non-physical settlement methods.\n\n### Major Races in F432\n\nF432 is a high-contact realm with many visiting and minority races, but seven are currently documented as the most widely present across civic and frontier records:\n\n- **Humans** (broadly distributed social baseline across cities and routes)\n- **Axiomorphs** (non-humanoid geometric and field-structured persons)\n- **Veyrin** (humanoid people with one innate signature trait per individual)\n- **Lineborn** (near-2D planar-bodied persons with stable civic participation)\n- **Kharad** (dense-bodied material specialists with strong infrastructure traditions)\n- **Choirglass** (resonant faceted people using sound-light communication modes)\n- **Palewind Swarms** (distributed colony-intelligence persons with coherent identity)\n\nOther frequencies are known or suspected to host additional races not yet fully indexed in this repository.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Structured | 1 | Resonant Houses | Vailor Quentin, High Resonant of F432 |"}, {"h": "Stories or Depictions", "t": "The **Early F432 Survey Map** is treated as a canonical early-era depiction of the realm's broad layout (Wabet west, Nauw north-east, Sorel south-east), while remaining intentionally incomplete for future charting updates.\n\n*Map of Nauw*, *Map of Wabet*, and *Map of Sorel* are treated as close-up regional representations derived from established F432 geography."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:f500-frequency-realm", "slug": "f500-frequency-realm", "label": "F500 (frequency realm)", "category": "region", "status": "canonical", "themes": ["abyss", "nothingness", "negation", "antimatter (folk metaphor)", "dread", "uncertainty"], "path": "regions/f500-frequency-realm.md", "region": "Dias", "parent_region": "Dias", "meta": {"region": "Dias", "parent_region": "Dias", "place_type": "realm"}, "assets": ["assets/f500-map.png"], "summary": "F500 is a low- / inverse-resonance frequency realm in Dias, widely called the abyss frequency or the null band. It is the conceptual and experiential counterweight to F200\u2019s pure light: a domain associated with absence, inversion, and the feeling of \u201cnothin...", "words": 604, "sections": [{"h": "Overview", "t": "F500 is a **low- / inverse-resonance** frequency realm in Dias, widely called **the abyss frequency** or **the null band**. It is the conceptual and experiential **counterweight** to F200\u2019s pure light: a domain associated with **absence, inversion, and the feeling of \u201cnothing that still weighs on you.\u201d**"}, {"h": "Description", "t": "**Cartographic / map portrayal (for visualization)**  \nF500 is **not usually mapped as a country with towns and borders**. If it is placed on a chart at all, the honest depiction is an **indefinite field** or **void panel**: a region where the map stops being a picture of place and becomes a **warning shape**. Visually, artists often use **true black to charcoal fog**, with **no horizon line** or with a **horizon that appears to recede the longer you look**. Some charts show **only a dark oblong, circle, or torn hole** in the margin\u2014an anti-map\u2014sometimes labeled only with a number and a void symbol.\n\n**Matter, light, and metaphor**  \nCommon speech compares F500 to **dark matter or antimatter** in tone: not always literal science, but a shared attempt to name **substance that annihilates normal contrast**. Light does not behave here as in F200; highlights feel **stolen**, colors **suck in**, and the eye finds **no rest points**. The environment reads as **anti-scenery**\u2014a place where the mind reaches for a landmark and finds **a texture like forgetting**.\n\n**Stability**  \nThere is said to be **no single \u201cthere\u201d in F500** in the way other realms have a fixed there: distance is **unmoored**, and the sense of a named locale may be **a temporary coherence** in a body\u2019s perception rather than a durable coordinate. Expeditions that return (rare) describe **pockets** or **falsely stable** intervals\u2014brief intervals where a floor seems to exist\u2014before the pocket **dissolves without transition**.\n\n**Inhabitants (reputation only)**  \nStories acknowledge **whispers of inhabitants in the deep absence**, but **no culture agrees on proof**. These rumors are often grouped under the epithet **The Unraveled**\u2014a name used in fear more than in taxonomy."}, {"h": "Lore", "t": "F500 is the frequency most often used in moral cosmology as **\u201cthe opposite of Aurel\u2019s peace\u201d**\u2014not a mirror image with tidy symmetry, but a **hungry null**: the idea that *something might still watch from nowhere*.\n\nDiplomatic and scholarly records across F432 rarely treat F500 as a place to **visit**; it is a place to **name carefully**, map minimally, and avoid conflating with ordinary night or ordinary shadow.\n\n### Awareness in F432\n\nF432\u2019s hold on F500 is **almost entirely indirect**: **tavern myths**, **sealed-ledger gossip**, **bleed-cold weather** that refuses a clean forecast, and **rumors of the Unraveled** that **no court will verify**. That leaves F500 **present in mood and language** while **absent from treaty tables**\u2014a frequency you can **fear and name** without being able to **negotiate with it** the way you negotiate a neighbor region."}, {"h": "Stories or Depictions", "t": "Frontier tavern lore claims that staring too long at an **empty corner** can \u201c**tune**\u201d a person toward F500, as if attention were a dial\u2014another folk explanation for bad dreams and sudden cold rooms.\n\nThe **F500 Map** artwork is the current **visual reference** for void-field presentation, **F200** contrast, and **Unraveled** marginalia as **rumor**; see `assets/f500-map.png` and the artwork entry **F500 Map**. It is framed as **warning cartography**, not a guarantee of safe routes."}, {"h": "Notes", "t": "For image generation, prefer **void-forward** compositions: **negative space, subtle grain, edge-darkening, lens-like distortion at the boundary, no friendly focal objects**. F500 should never read as a cozy gothic night; it should read as **erasure with teeth**."}], "unresolved": []}, {"id": "region:f610-frequency-realm", "slug": "f610-frequency-realm", "label": "F610 (frequency realm)", "category": "region", "status": "canonical", "themes": ["revelation", "hidden structure", "brief clarity", "truth windows", "precision"], "path": "regions/f610-frequency-realm.md", "region": "Dias", "parent_region": "Dias", "meta": {"region": "Dias", "parent_region": "Dias", "place_type": "realm"}, "assets": ["assets/f610-map.png"], "summary": "F610 is called the Reveal Veil: a frequency characterized by short-lived windows where concealed structure becomes visible.", "words": 191, "sections": [{"h": "Overview", "t": "**F610** is called the **Reveal Veil**: a frequency characterized by short-lived windows where concealed structure becomes visible."}, {"h": "Description", "t": "F610 is neither a lie-detector world nor omniscient space. Its defining behavior is interval-based disclosure: pattern, relation, and underlying form become legible briefly, then return behind ordinary opacity.\n\nCartographic depictions favor crystalline folds, mirrored ledges, and thin transparency bands with timed annotation marks."}, {"h": "Lore", "t": "The key internal region is **The Glassfold Ledge**, where reveal intervals are most reliable and studied.\n\n### Awareness in F432\n\nIn F432, F610 is mostly referenced in investigative circles and cautionary myths: \"you may see truly, but not for long.\""}, {"h": "Stories or Depictions", "t": "Art and diagrams represent F610 with layered panes, split reflections, and brief alignment notches rather than broad territorial borders.\n\nThe **F610 Map** artwork is the current visual reference for **The Glassfold Ledge** and foldline / window-shelf navigation; see `assets/f610-map.png`.\n\nAdditional motif work includes **Awake 1** and the reported **Mirror-Wake Inversion** event, both used by investigators to discuss self-reflection anomalies under reveal strain."}, {"h": "Notes", "t": "Use F610 to support mystery and revelation pacing, especially in stories where truth arrives in limited windows."}], "unresolved": []}, {"id": "region:f840-frequency-realm", "slug": "f840-frequency-realm", "label": "F840 (frequency realm)", "category": "region", "status": "canonical", "themes": ["recovery", "aftermath", "resilience", "continuity", "quiet hope"], "path": "regions/f840-frequency-realm.md", "region": "Dias", "parent_region": "Dias", "meta": {"region": "Dias", "parent_region": "Dias", "place_type": "realm"}, "assets": ["assets/f840-map.png"], "summary": "F840 is known as the Ember Quiet: a recovery frequency where the dominant condition is not catastrophe, but what remains and what can be rebuilt.", "words": 176, "sections": [{"h": "Overview", "t": "**F840** is known as the **Ember Quiet**: a recovery frequency where the dominant condition is not catastrophe, but what remains and what can be rebuilt."}, {"h": "Description", "t": "F840 reads as post-event continuity. Surfaces hold trace heat, skies stay muted, and ecosystems favor hardy regrowth over dramatic bloom. The realm feels contemplative without being dead.\n\nMaps use ash-ember gradients, hearthline markers, and low-intensity flow paths indicating where warmth and livability persist."}, {"h": "Lore", "t": "The principal internal region is **The Ashen Hearthline**, a mapped corridor of stable warmth, shelter craft, and long-term restoration practice.\n\n### Awareness in F432\n\nF432 storytellers invoke F840 as proof that endings and injuries are not the final phase of a worldline. Official institutions mention it rarely but respectfully."}, {"h": "Stories or Depictions", "t": "F840 depictions emphasize sheltered routes, durable materials, and quiet communal continuity rather than conflict fronts.\n\nThe **F840 Map** artwork is the current visual reference for **The Ashen Hearthline** and ember/relay routing; see `assets/f840-map.png`."}, {"h": "Notes", "t": "Use F840 to enrich healing arcs and post-crisis chapters without collapsing tone into despair."}], "unresolved": []}, {"id": "region:f960-frequency-realm", "slug": "f960-frequency-realm", "label": "F960 (frequency realm)", "category": "region", "status": "canonical", "themes": ["becoming", "incompletion", "creative pressure", "renewal", "soft instability"], "path": "regions/f960-frequency-realm.md", "region": "Dias", "parent_region": "Dias", "meta": {"region": "Dias", "parent_region": "Dias", "place_type": "realm", "culture": "The Open Hand of Making"}, "assets": ["assets/f960-map.png"], "summary": "F960 is a high-variance frequency realm in Dias associated with becoming rather than finished form. People across other frequencies call it the unfinished band: not broken, not ruined, but persistently in-progress.", "words": 344, "sections": [{"h": "Overview", "t": "**F960** is a high-variance frequency realm in Dias associated with **becoming rather than finished form**. People across other frequencies call it *the unfinished band*: not broken, not ruined, but persistently in-progress."}, {"h": "Description", "t": "Unlike F200 (stable light) and F500 (void negation), F960 is defined by **partial manifestation**. Structures appear in successive passes: outline, volume, detail, then revision. Edges can sharpen and soften in the same hour. Surfaces often show under-sketch geometry as faint linework beneath their current form.\n\nColor language in witness accounts tends toward graphite gray, chalk white, and muted mineral tones, with occasional sudden accents (copper, cobalt, ember orange) where a form is \"trying itself out.\" Sound behaves similarly: hammer-like taps, distant scraping, and low harmonic hums with no obvious singular source."}, {"h": "Lore", "t": "The best-charted region inside F960 is **The Unfinished**, a mappable place where the realm's incomplete logic is most legible to outsiders.\n\nIn comparative lore, F960 is treated as a conceptual counterpoint to both F200 and F500:\n- F200 emphasizes coherent completion through light.\n- F500 emphasizes erasure and non-hold.\n- F960 emphasizes **iterative emergence**: form that is present, revisable, and alive.\n\n### Awareness in F432\n\nF432 does not treat F960 as a practical trade neighbor. Awareness arrives through sketchbook anomalies, recurring \"almost-identical\" diagrams, and a few disputed records (notably **The Half-Made Atlas**) that seem to redraw themselves between readings."}, {"h": "Stories or Depictions", "t": "Frontier and artist circles in Nauw and Veloria describe F960 with workshop metaphors: \"a world with wet paint that never fully dries.\" Scholars caution that this is a useful image, not a full model.\n\nThe **F960 Map** artwork is the current visual reference for realm-scale representation of iterative form and for the internal map logic of **The Unfinished**; see `assets/f960-map.png`.\n\nAdditional F960 visual doctrine appears in **And This Is** and the training artifact **The Witness-Line Panel**, both emphasizing line-accurate witness over narrative embellishment."}, {"h": "Notes", "t": "For visual interpretation, avoid polished finality. F960 should read as **intentional incompletion**: layered drafts, guide marks, ghost lines, and form mid-decision."}], "unresolved": []}, {"id": "region:glasswater-fields", "slug": "glasswater-fields", "label": "Glasswater Fields", "category": "region", "status": "canonical", "themes": ["agriculture", "river-fed plains", "food stability", "folklore of magic", "sky vigilance", "communal duty"], "path": "regions/glasswater-fields.md", "region": "F432 (frequency realm)", "parent_region": "Nauw", "meta": {"region": "F432 (frequency realm)", "parent_region": "Nauw", "place_type": "region"}, "assets": [], "summary": "Glasswater Fields is Nauw's eastern agricultural heartland\u2014open country of reflective rivers, farms, and windmill landscapes that occupies most of the region's eastern half.", "words": 322, "sections": [{"h": "Overview", "t": "Glasswater Fields is Nauw's eastern agricultural heartland\u2014open country of reflective rivers, farms, and windmill landscapes that occupies most of the region's eastern half."}, {"h": "Description", "t": "The territory lies almost entirely to the east of central Nauw, with Brindle March and the Velorian Basin to the west carrying its harvests toward Veloria City and wider trade. The waters are known for mirror-like clarity, often reflecting the sky with near-glass precision. Across these fields, farm communities and windmill clusters maintain grain and livestock production at scales that sustain urban demand.\n\nGlasswater Fields underpins food reliability for Veloria and surrounding basin towns.\n\nIn the southern stretches of the region, large engineered freshwater dams form calm mirror basins used for overnight sky-watch routines. These dams are socially and strategically important, not only for water management but for protective vigilance customs."}, {"h": "Lore", "t": "The guiding law of Glasswater Fields is: \"Stability feeds the many.\"\n\nFolk tradition\u2014not treated as fact by scholars\u2014holds that much of the useful magic still worked in these fields (blessings on storage, water-warding, calm weather for harvest) descends from teachings first given on Averra Isle by the so-called Old Masters. See Old Masters of Averra Isle.\n\nA respected inhabitant role in the region is the Glasswater Field Drifters: night watchers who float on tubes across southern dams and maintain continuous sky observation through evening and deep night hours. Communities treat this as a protective public duty rooted in long memory.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Stewardship | 2 | Field Circles | Leora Finn, Harvest Warden of Glasswater Fields |"}, {"h": "Stories or Depictions", "t": "*The Sky-Raid Memory of Glasswater Fields* remains a major narrative of vigilance. **The Glasswater Mirror Lull** widens the tone\u2014mythic still nights tied to the mirror dams and **Nauw**-wide lull. **Brindle March stillness** is sometimes reported the same evening, linking east fields to the central road network."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:green-garden-border-lanes", "slug": "green-garden-border-lanes", "label": "Green Garden Border Lanes", "category": "region", "status": "canonical", "themes": ["border landmark", "curated nature", "holiday pilgrimage", "therapeutic walking"], "path": "regions/green-garden-border-lanes.md", "region": "Nauw", "parent_region": "Brindle March", "meta": {"region": "Nauw", "parent_region": "Brindle March", "place_type": "landmark"}, "assets": [], "summary": "Green Garden Border Lanes is a flower-walk landmark at the north-eastern Brindle March edge near the border with Glasswater Fields, known for thousands of potted green sunflower-like blooms.", "words": 239, "sections": [{"h": "Overview", "t": "Green Garden Border Lanes is a flower-walk landmark at the north-eastern Brindle March edge near the border with Glasswater Fields, known for thousands of potted green sunflower-like blooms."}, {"h": "Description", "t": "From a distance, the site appears like a natural field of green flowers spreading across the borderland. Up close, visitors can see that every plant is individually potted and individually maintained.\n\nThe flowers are arranged in long walkable rows with narrow paths between them, allowing inhabitants to move through the display on foot. Many travelers heading east from Veloria City toward Glasswater Fields plan a stop here during holidays or off-time."}, {"h": "Lore", "t": "The display is maintained year-round rather than wild-grown. This distinction is important in local identity: the lanes are treated as a deliberate civic-garden work rather than spontaneous nature.\n\nVisitors often describe walking between the rows as a mental reset before entering a new annual cycle, and families returning to Glasswater Fields commonly treat the stop as part of the journey ritual.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Cultural + Civic | 4 | Garden Lanes Circle | Neris Hale, Bloom Warden of Green Garden Border Lanes |"}, {"h": "Stories or Depictions", "t": "Commonly associated with the artwork *Green Garden*."}, {"h": "Notes", "t": "Although the landmark sits within Brindle March jurisdiction, its daily visitor flow is strongly shaped by traffic between Veloria City and Glasswater Fields."}], "unresolved": []}, {"id": "region:hearthvale", "slug": "hearthvale", "label": "Hearthvale", "category": "region", "status": "canonical", "themes": ["reconstruction", "cooperative survival", "second chances"], "path": "regions/hearthvale.md", "region": "F432 (frequency realm)", "parent_region": "Sorel", "meta": {"region": "F432 (frequency realm)", "parent_region": "Sorel", "place_type": "territory"}, "assets": [], "summary": "Hearthvale is the western territory of Sorel, centered on rebuilding stable life after exile. It receives many who leave Nauw under pressure of shame, law, or custom.", "words": 199, "sections": [{"h": "Overview", "t": "Hearthvale is the western territory of Sorel, centered on rebuilding stable life after exile. It receives many who leave Nauw under pressure of shame, law, or custom."}, {"h": "Description", "t": "Hearthvale covers the western half of Sorel. The territory is characterized by small towns, cooperative farms, and shared workshops designed for long-term continuity rather than temporary encampment. Communities emphasize mutual support and practical restoration.\n\nResidents often frame Hearthvale as proof that displacement does not end a person's social future.\n\nA major bridge runs from southern Nauw to Sorel's northern frontier within Hearthvale, making it the principal crossing for people and goods from Nauw into northern Sorel."}, {"h": "Lore", "t": "The guiding law of Hearthvale is: \"Every person deserves a second beginning.\"\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Stewardship | 3 | Hearth Compact | Alwen Rusk, Second-Beginning Keeper of Hearthvale |"}, {"h": "Stories or Depictions", "t": "**The Long Gate Argument** (shared with Nauw and Sorel lore) frames the main bridge to Hearthvale as a negotiated gate for exile and return. **Second-Beginning Slate fragment** and **The Kiln Fires of Second Beginning** anchor the territory\u2019s *second chance* identity in object and oral tradition."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:isle-of-calareth", "slug": "isle-of-calareth", "label": "Isle of Calareth", "category": "region", "status": "canonical", "themes": ["pristine coasts", "cliffs and forests", "uncertain resonance"], "path": "regions/isle-of-calareth.md", "region": "F432 (frequency realm)", "parent_region": "Wabet", "meta": {"region": "F432 (frequency realm)", "parent_region": "Wabet", "place_type": "island"}, "assets": [], "summary": "The Isle of Calareth is the major island off Wabet's eastern side, surrounded by clear waters and smaller island chains.", "words": 571, "sections": [{"h": "Overview", "t": "The Isle of Calareth is the major island off Wabet's eastern side, surrounded by clear waters and smaller island chains."}, {"h": "Description", "t": "Calareth is recognized for pristine beaches, steep cliffs, and dense interior forests with minimal built intrusion. The island is widely regarded as one of the purest natural environments in F432.\n\nSome travelers report that Calareth carries a slightly different resonance signature from the Wabet mainland, though no confirmed explanation has been established.\n\n### Named anchor places\n\n- **Hallow Bay** \u2014 The island\u2019s main **sheltered cove** and the usual arrival point. A low **Watch House** and a single **clapboard guest hall** (limited beds, strict rules) sit above the high-tide line. Dories are painted **moss green** so the bay looks \u201chollowed by habit,\u201d as visitors say, not by industry.\n- **Elder Shelf** \u2014 A **clifftop band** of wind-scoured trees ringed in **gray stone**; no building is allowed inside the ring. The Watch issues **day passes** for meditation or naming ceremonies; the mood is *quiet*, not *secret*\u2014a novelist can set conflict here without inventing a cult.\n- **Coral Strand** \u2014 The southern **reef-ledge** beach: shallow, loud with water over shell, the best place for **tide-pool** teaching, children\u2019s first swims, and the island\u2019s one concession to *boisterous* joy. Coris is said to smile there more than anywhere else, though witnesses disagree on *how* much is rumor.\n\nFerries from Wabet (when permitted) are infrequent; most traffic is still **intentional**\u2014healers, students of restraint, and families seeking a week without a clock.\n\n### Seasonal year\n\n- **Green Months:** forest understory runs **wet and bright**; the Watch opens longer trails, and **Verdant Reach** traders sometimes send gift-crates of mainland herbs \u201cfor the bay kitchens.\u201d\n- **Still Months:** a mid-year stretch of **unusually flat sea**; the strand becomes a mirror, and the island\u2019s small population holds **outdoor work** in the cool hours\u2014mending, teaching, line-knot contests.\n- **Tide-Loud Weeks:** when moon and wind disagree, the reef **speaks**; Coris\u2019s office doubles as a listening post for **safe passage windows**, a practical rhythm every villager knows how to read on a posted slate.\n\n### Recurring public ritual: Ribbon at the Rope Tree\n\nThe **Rope Tree** in Hallow Bay is an old, salt-silvered **mooring bollard grown into legend**: iron rings in bark, lines worn smooth. On the **first landing day** of a traveler granted longer stay, they tie a **blue ribbon** to the lowest ring\u2014**not** a claim of ownership, but a public promise: *I will not move stone, soil, or story here without the Watch and the bay\u2019s assent.* Locals and visitors attend; children sometimes add a second ribbon \u201cfor the sea,\u201d which Coris does not discourage. The rite is **open, gentle, and strict**\u2014exactly the Calareth mean."}, {"h": "Lore", "t": "Calareth functions as Wabet's major eastern offshore island and a recurring destination for those seeking isolation and reflective travel. The present **texture** is: **few beds, many rules, strong seasonal cadence, and a ritual culture that encodes care as ceremony**\u2014enough to draft long scenes without softening the island\u2019s **threshold** character.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Stewardship | 3 | Calareth Watch | Coris Vale, Isle Warden of Calareth |"}, {"h": "Stories or Depictions", "t": "See **The Warden Who Closed the Reefs** and **Coris Vale** for mythic/character contrast with the day-scale **Rope Tree** rite; **Map of Wabet** for offshore placement in regional art."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:lumira-sands", "slug": "lumira-sands", "label": "Lumira Sands", "category": "region", "status": "canonical", "themes": ["desert calm", "hidden water", "silence"], "path": "regions/lumira-sands.md", "region": "F432 (frequency realm)", "parent_region": "Wabet", "meta": {"region": "F432 (frequency realm)", "parent_region": "Wabet", "place_type": "region"}, "assets": [], "summary": "Lumira Sands is the southern desert region of Wabet, known for pale dunes, hidden oases, and an unusual atmosphere of calm.", "words": 147, "sections": [{"h": "Overview", "t": "Lumira Sands is the southern desert region of Wabet, known for
