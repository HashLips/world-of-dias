 pale dunes, hidden oases, and an unusual atmosphere of calm."}, {"h": "Description", "t": "Although outwardly arid, Lumira Sands contains underground water flows that feed concealed oasis pockets and sustain rare plant and animal life. The terrain extends in long dune fields with sparse but resilient ecological nodes.\n\nTravelers across Dias often describe Lumira Sands as unusually quiet and balanced compared to harsher desert zones elsewhere.\n\nIts domain covers the lower portion of Wabet, anchoring the south beneath Verdant Reach."}, {"h": "Lore", "t": "The guiding law of Lumira Sands is: \"The land provides for those who respect its silence.\"\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Tribal + Stewardship | 3 | Silent Dune Keep | Iskar L\u00fcm, Dune Keeper of Lumira Sands |"}, {"h": "Stories or Depictions", "t": ""}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:nauw", "slug": "nauw", "label": "Nauw", "category": "region", "status": "canonical", "themes": ["trade routes", "diversity of peoples", "stylized beings", "regional crossroads", "maritime lifeways", "fruit obsession", "banana primacy"], "path": "regions/nauw.md", "region": "F432 (frequency realm)", "parent_region": "F432 (frequency realm)", "meta": {"region": "F432 (frequency realm)", "parent_region": "F432 (frequency realm)", "place_type": "region", "culture": "Nauw Fruit Reverence"}, "assets": [], "summary": "Nauw lies in the north-eastern portion of the F432 frequency realm and is one of the most populated and active regions within the realm.", "words": 535, "sections": [{"h": "Overview", "t": "Nauw lies in the north-eastern portion of the F432 frequency realm and is one of the most populated and active regions within the realm."}, {"h": "Description", "t": "Nauw sits directly north of Sorel and east of Wabet. The lands of Nauw include fertile valleys, cultivated fields, trade roads, and expanding settlements. Travelers moving through the region encounter a wide variety of inhabitants, some of whom resemble ordinary humans while others possess unusual or simplified forms. Certain individuals appear almost like living drawings, their bodies resembling flat or stylized shapes rather than fully dimensional forms. Despite their appearance, these beings live and interact with others much like any other inhabitants of the region.\n\nNauw has gradually become known as a place where many different peoples and cultures intersect. Trade routes cross the region, and its cities often serve as gathering places for travelers from across the wider frequency realm. Because of its position between the western wilderness of Wabet and the more unpredictable lands of Sorel to the south, Nauw often acts as a bridge between very different ways of life within F432.\n\nA defining regional trait is intense fruit devotion. While many dishes are made from varied ingredients, fruit is widely treated as the highest food class, and bananas are regarded as supreme."}, {"h": "Lore", "t": "Veloria City, the capital, sits in the north-west of Nauw; the Velorian Basin surrounds it and forms the busiest trade core. Brindle March runs through the middle of Nauw as the great road-and-bridge corridor, lying between the basin and Glasswater Fields. Glasswater Fields occupies eastern Nauw almost in full\u2014open farmland and glass-bright rivers that feed Veloria and inland markets. A small isle, Averra Isle, lies off the south-west coast; what happens there now is largely unknown to mainland Nauw, though old stories still link it to Veloria's art trade. A common myth holds that most everyday magic practiced across the Velorian Basin, Brindle March, and Glasswater Fields traces to teaching by Old Masters on that isle (see Old Masters of Averra Isle).\n\nThe top-western to northern outer waters are recognized as the Nauw Outer Rim Seas, where Singing Fishermen communities and human-eyed whale populations are concentrated. Despite this agricultural appetite, Nauw relies heavily on fruit imported from Wabet rather than large-scale local fruit production.\n\nOn southern Nauw, a major bridge crosses the border into northern Sorel (Hearthvale), linking Nauw to the exile frontier at Sorel's northern reach. Many who later live in Sorel are counted as having left Nauw by that road or by wilder southern paths.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Structured | 2 | Nauw Concord | Serik Dovant, High Steward of Nauw |"}, {"h": "Stories or Depictions", "t": "*Map of Nauw* is treated as a canonical close-up representation of Nauw's established geography within F432. Recent expansive lore often clusters around **The Long Gate Argument** (the bridge to Hearthvale as moral infrastructure), **The Glasswater Mirror Lull** (eastern stillness and food-heart ritual), the observed macro-rhythm of **Brindle March stillness**, and, at Dias scale, **The Census Echoes of the Prime Mark** (a folktale linking numbered frequency bands to a mythic **Prime roll-call of resonances**\u2014not of persons as property)."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:nauw-outer-rim-seas", "slug": "nauw-outer-rim-seas", "label": "Nauw Outer Rim Seas", "category": "region", "status": "canonical", "themes": ["coastal survival", "symbiosis", "hunting and friendship", "frontier waters"], "path": "regions/nauw-outer-rim-seas.md", "region": "F432 (frequency realm)", "parent_region": "Nauw", "meta": {"region": "F432 (frequency realm)", "parent_region": "Nauw", "place_type": "region"}, "assets": [], "summary": "The Nauw Outer Rim Seas occupy the top-western to northern oceanic edge of Nauw, where whale populations and singing fishing communities are most concentrated.", "words": 602, "sections": [{"h": "Overview", "t": "The Nauw Outer Rim Seas occupy the top-western to northern oceanic edge of Nauw, where whale populations and singing fishing communities are most concentrated."}, {"h": "Description", "t": "This maritime belt forms a distinct ecological zone at the outer rim of Nauw. Waters are rich with large marine life and interdependent food webs, but conditions can shift quickly with weather, currents, and migratory movement.\n\nThe region is known for the presence of massive whales with human-like eyes and for the Singing Fishermen who live and work along these waters. Their practices combine subsistence, ritualized song, and inherited local knowledge of whale routes and behavior.\n\n### Named anchor places\n\n- **Hollowmere** \u2014 A northern cove town of **stacked net sheds** and open-air mending lofts. Drying lines crisscross the lower slope like a second tide; at night, lantern hooks swing so visitors say the cliff \u201cbreathes in strings.\u201d\n- **Cinder Nook** \u2014 A wind-sheltered pocket where brine, smoke, and charcoal meet: fish **slow-dried** on racks, hearths for tar pots, and a communal **cinder path** to the high tide mark (children learn not to scorch a boot there twice).\n- **Rim-Rest** \u2014 A **raft-and-pier** cluster in a leeward bay, where part of the year families sleep over water as much as on land. Boats are moored in rings; gossip travels along gangplank faster than along road.\n\nNo single \u201ccapital\u201d claims the whole outer rim; these three are **taught to apprentices** as fixed stars on a mental chart.\n\n### Seasonal year (how life reads from the shore)\n\n- **The Bright Inshore (late spring):** the first long runs of fin and spout; markets in Hollowmere and Rim-Rest swell with **salt-sweet** trade, and Nauw\u2019s fruit barges (when they brave the route) are greeted like festivals.\n- **Hush Weeks (midsummer glass):** when the sea **lies too still**, songs drop to hums\u2014part superstition, part acoustic discipline so echo-walls can be heard. Old families say: *never shame the water into speaking back.*\n- **Storm Choir (late summer\u2013autumn):** fronts stack; the rim earns its name. Nets are shortened, **storm glasses** re-hung, and the Singing Nets Compact shifts priority from catch to **being seen**\u2014any boat missing its check-in call becomes the night\u2019s public prayer.\n- **Low Winter (short days):** lines are pulled, stories lengthen. Ferries to Veloria thinned; cinder smoke from Cinder Nook **writes** the weather on the bluffs for those who can read it.\n\n### Recurring public ritual: The First Line Answer\n\nThe first time in a year a **spout** is sighted and agreed upon by two unconnected lookouts, the **First Line Answer** goes out: a single, eight-beat call from a lead singer on the highest net-loft, answered **one line at a time** by every craft within hailing distance\u2014not for magic, but for **coordination and joy**\u2014so no one\u2019s first good catch of the season is taken alone. Outsiders are invited to hoot badly on purpose; locals pretend to judge, then pass the tea."}, {"h": "Lore", "t": "The Nauw Outer Rim Seas are treated as a vital food source and a social boundary zone where necessity, reverence, and risk coexist. Day to day, life is also **loud, salty, and sociable**\u2014a book set here can lean on **weather cadence, song, and the politics of a shared line** as much as on whale wonder.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Cultural + Maritime | 2 | Singing Nets Compact | Marek Solon, Tide Warden of Nauw Outer Rim Seas |"}, {"h": "Stories or Depictions", "t": "See also **Marek Solon**, **The Split Tide Bloodline**, and **Singing Fishermen** inhabitant records for interlocking personality-scale hooks."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:sorel", "slug": "sorel", "label": "Sorel", "category": "region", "status": "canonical", "themes": ["exile", "frontier survival", "improvised settlements", "freedom outside authority"], "path": "regions/sorel.md", "region": "F432 (frequency realm)", "parent_region": "F432 (frequency realm)", "meta": {"region": "F432 (frequency realm)", "parent_region": "F432 (frequency realm)", "place_type": "region"}, "assets": [], "summary": "Sorel occupies the south-eastern lands of the F432 frequency realm, directly south of Nauw and east of Wabet.", "words": 358, "sections": [{"h": "Overview", "t": "Sorel occupies the south-eastern lands of the F432 frequency realm, directly south of Nauw and east of Wabet."}, {"h": "Description", "t": "Among inhabitants of Nauw and neighboring regions, Sorel has a reputation as a place where society's outcasts often end up. Most who arrive from a single origin are turned out of Nauw (exiled, shunned, or rejected) and move south into Sorel to build life away from northern cities and authorities. Others still come from farther afield, but Nauw supplies the largest share of newcomers.\n\nBecause of this history, Sorel developed as a region where traditional rules and authorities hold little power. Many towns and structures are built from salvaged or found materials, producing settlements that appear improvised and constantly changing.\n\nThe landscapes are harsh and unpredictable, and the culture reflects that environment. For some, Sorel is a dangerous frontier shaped by conflict and survival. For others, it is a place of freedom, where individuals can exist outside laws and expectations imposed elsewhere in F432."}, {"h": "Lore", "t": "Sorel forms the southern counterpart to Nauw and the south-eastern counterpart to Wabet, helping define the lived contrasts within F432.\n\nWithin Sorel, two major territories divide the land: Hearthvale lies on the west, and Driftfall on the east, with a rough north\u2013south partition through the middle of the region so the two territories face each other across Sorel's interior. A long bridge spans from southern Nauw into northern Sorel (Hearthvale), tying that northern gate to Nauw without requiring travelers to cross Driftfall first.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Frontier | 2 | Freebands of Sorel | Carrow Vale, First Exile of Sorel |"}, {"h": "Stories or Depictions", "t": "*Map of Sorel* is treated as a canonical close-up representation of Sorel, with clear emphasis on the Hearthvale-Driftfall split. Broad-scale storytelling often invokes **The Long Gate Argument** (the mythic history of the great Nauw crossing into Hearthvale) and **The Drift Hour with No Captain** (Driftfall\u2019s void-hour founding tale).\n\n*3 Opinions* and the traveling trio **The Three Opinions** are recurring social depictions: unaligned gossip-bearers who unsettle towns without openly joining Hearthvale or Driftfall camps."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:sprout-vent", "slug": "sprout-vent", "label": "Sprout Vent", "category": "region", "status": "canonical", "themes": ["active venting", "multiple mouths", "omen geology", "southeastern Driftfall"], "path": "regions/sprout-vent.md", "region": "Sorel", "parent_region": "Driftfall", "meta": {"region": "Sorel", "parent_region": "Driftfall", "place_type": "landmark"}, "assets": [], "summary": "Sprout Vent is a modest but striking active volcano on Driftfall's southeastern flank\u2014small by distant-realm standards, yet dominant against the low frontier ground around it.", "words": 283, "sections": [{"h": "Overview", "t": "**Sprout Vent** is a modest but striking active volcano on Driftfall's southeastern flank\u2014small by distant-realm standards, yet dominant against the low frontier ground around it."}, {"h": "Description", "t": "The vent sits inland from Driftfall's shark-heavy eastern beaches, along the southeastern edge of the territory where broken strata and heat-warped stone already read as unstable.\n\nFrom a distance it does not look like a single cone. Locals describe a **cluster profile**: one central throat with several smaller sprouting points along its shoulders and lower slopes, as if the mountain were trying to grow extra mouths.\n\nEruptions are infrequent. Between events the vent steams, grumbles, and keeps its reputation alive in dock stories without shutting down daily life.\n\nWhen it does erupt, overflow and thrown magma can travel farther than the mountain's size would suggest\u2014and that is when **vent-sprout spread** becomes a serious concern."}, {"h": "Lore", "t": "Driftfall crews treat Sprout Vent as both landmark and warning clock.\n\n- A quiet year means routine travel along southeastern routes.\n- A visible glow or ash thread means recheck camps, reroute salvage lines, and argue about meaning before the magma even arrives.\n\nWhere contagious overflow has landed in past cycles, the landscape now carries **daughter vents**\u2014knee-high to waist-high mounds that still warm at night. Together with the parent cluster, they give the southeastern approach its unsettling \"many sprout\" silhouette."}, {"h": "Stories or Depictions", "t": "No dedicated artwork entry yet. Southeastern Driftfall maps and oral charts usually mark the vent cluster with multiple tick-marks around one core symbol."}, {"h": "Notes", "t": "Not to be confused with ordinary wildfire or tar seeps common elsewhere in Sorel; Sprout Vent is the only known site in Driftfall where eruption behavior includes **vent-sprout spread**."}], "unresolved": []}, {"id": "region:the-ashen-hearthline", "slug": "the-ashen-hearthline", "label": "The Ashen Hearthline", "category": "region", "status": "canonical", "themes": ["shelter corridors", "quiet recovery", "heat mapping"], "path": "regions/the-ashen-hearthline.md", "region": "F840 (frequency realm)", "parent_region": "F840 (frequency realm)", "meta": {"region": "F840 (frequency realm)", "parent_region": "F840 (frequency realm)", "place_type": "region"}, "assets": [], "summary": "The Ashen Hearthline is F840's map core: a long corridor network of stable warmth and viable shelter routes across muted post-event terrain.", "words": 151, "sections": [{"h": "Overview", "t": "The Ashen Hearthline is F840's map core: a long corridor network of stable warmth and viable shelter routes across muted post-event terrain."}, {"h": "Description", "t": "**Map portrayal guidance**  \nMap as a branching hearth-corridor spine running through ash plains and low ember ridges. Include:\n\n- **Core Hearth Spine**: the most reliable warm route; dotted with shelter stations.\n- **Kindle Spurs**: secondary branches with variable heat stability.\n- **Cold Gaps**: traversable intervals requiring timing, gear, or guided passage.\n\nUse dark ashen base tones with subtle ember veins and orange-gold nodes at shelter points. Emphasize survivability networks over dramatic topography."}, {"h": "Lore", "t": "Communities cluster around persistent heat nodes and maintain relay chains for travelers, supplies, and message continuity."}, {"h": "Stories or Depictions", "t": "Hearthline maps are often marked with \"rest viability\" ratings rather than conventional distance-first legends."}, {"h": "Notes", "t": "Render as durable, humane infrastructure in a quiet realm, not as scorched wasteland spectacle."}], "unresolved": []}, {"id": "region:the-bloomline-estuary", "slug": "the-bloomline-estuary", "label": "The Bloomline Estuary", "category": "region", "status": "canonical", "themes": ["emotional confluence", "gradient terrain", "communal regulation"], "path": "regions/the-bloomline-estuary.md", "region": "F380 (frequency realm)", "parent_region": "F380 (frequency realm)", "meta": {"region": "F380 (frequency realm)", "parent_region": "F380 (frequency realm)", "place_type": "region"}, "assets": [], "summary": "The Bloomline Estuary is F380's map anchor: a confluence region where emotional-state currents meet and separate in trackable channels.", "words": 146, "sections": [{"h": "Overview", "t": "The Bloomline Estuary is F380's map anchor: a confluence region where emotional-state currents meet and separate in trackable channels."}, {"h": "Description", "t": "**Map portrayal guidance**  \nRepresent as a fan-shaped estuary with color-gradient tributaries instead of conventional water-only channels. Keep five major \"mood tributaries\" flowing into one shared basin:\n\n- Warm Current (amber-rose)\n- Clear Current (silver-blue)\n- Heavy Current (slate-violet)\n- Bright Current (gold-green)\n- Quiet Current (smoke-teal)\n\nBoundaries should blur at edges and sharpen near convergence nodes. Label major confluence points as \"holding coves\" where groups stabilize local tone for gathering, healing, or negotiation."}, {"h": "Lore", "t": "Skilled guides track not only direction and depth but affective pressure. Settlements form near predictable convergence zones where volatility is manageable."}, {"h": "Stories or Depictions", "t": "Maps often annotate the same path with two recommended timings: \"clear-day\" and \"heavy-day\" transit."}, {"h": "Notes", "t": "Render as living climate cartography, not weather fantasy spectacle."}], "unresolved": []}, {"id": "region:the-glassfold-ledge", "slug": "the-glassfold-ledge", "label": "The Glassfold Ledge", "category": "region", "status": "canonical", "themes": ["reveal intervals", "reflective terrain", "precision routes"], "path": "regions/the-glassfold-ledge.md", "region": "F610 (frequency realm)", "parent_region": "F610 (frequency realm)", "meta": {"region": "F610 (frequency realm)", "parent_region": "F610 (frequency realm)", "place_type": "region"}, "assets": [], "summary": "The Glassfold Ledge is F610's primary mapped zone, where reveal windows occur on predictable enough cadence to support field charting.", "words": 162, "sections": [{"h": "Overview", "t": "The Glassfold Ledge is F610's primary mapped zone, where reveal windows occur on predictable enough cadence to support field charting."}, {"h": "Description", "t": "**Map portrayal guidance**  \nDepict a stepped escarpment system composed of translucent ledges and folded reflective planes. The core map should include:\n\n- **Primary Foldline**: the safest survey route during low reveal.\n- **Three Window Shelves**: elevated sections where hidden under-structure becomes visible at intervals.\n- **Blind Basins**: depressions that look simple until reveal windows expose complex sub-layout.\n\nUse thin mirror contours, timing icons, and \"visibility bands\" marking likely reveal durations (short, medium, rare long). Keep the palette cool: glass gray, steel blue, pale white highlights."}, {"h": "Lore", "t": "Navigation guilds time movement to \"ledge minutes.\" Poor timing means traversing blind and missing structural cues."}, {"h": "Stories or Depictions", "t": "Cartographers often print dual overlays: base-terrain and reveal-phase in separate line weights."}, {"h": "Notes", "t": "Do not map as a puzzle gimmick. The ledge is functional terrain with timed information advantages."}], "unresolved": []}, {"id": "region:the-returning-span", "slug": "the-returning-span", "label": "The Returning Span", "category": "region", "status": "canonical", "themes": ["recurrence geography", "route drift", "memory mapping"], "path": "regions/the-returning-span.md", "region": "F120 (frequency realm)", "parent_region": "F120 (frequency realm)", "meta": {"region": "F120 (frequency realm)", "parent_region": "F120 (frequency realm)", "place_type": "region"}, "assets": [], "summary": "The Returning Span is the primary mappable region of F120, where recurrence patterns become visible enough to chart.", "words": 169, "sections": [{"h": "Overview", "t": "The Returning Span is the primary mappable region of F120, where recurrence patterns become visible enough to chart."}, {"h": "Description", "t": "**Map portrayal guidance**  \nDraw the region as a broad suspended arc-field with repeating route bands that rejoin at offset intervals. The core shape is a stretched crescent crossed by three semi-parallel travel lanes:\n\n- **First Lane (outer)**: stable longest path; least variation.\n- **Second Lane (middle)**: moderate variation; landmarks recur with altered details.\n- **Third Lane (inner)**: highest drift; useful for quick passage but poor for certainty.\n\nUse concentric broken rings, paired milestone symbols, and mirrored-but-shifted waypoint markers. Avoid strict grid realism; emphasize patterned near-repetition."}, {"h": "Lore", "t": "Local charting uses \"pass count\" notation: first pass, second pass, and \"difference marks\" noting what changed between traversals."}, {"h": "Stories or Depictions", "t": "Depictions often include paired bridge forms and twin towers with non-matching windows to signal \"same shape, changed outcome.\""}, {"h": "Notes", "t": "Do not render as temporal prison. The Returning Span is navigable variation, not a closed loop trap."}], "unresolved": []}, {"id": "region:the-sketchy-gallery", "slug": "the-sketchy-gallery", "label": "The Sketchy Gallery", "category": "region", "status": "canonical", "themes": ["evolving exhibition space", "kinetic displays", "physical and digital art bridge", "mystery"], "path": "regions/the-sketchy-gallery.md", "region": "Nauw", "parent_region": "Veloria City", "meta": {"region": "Nauw", "parent_region": "Veloria City", "place_type": "gallery"}, "assets": [], "summary": "The Sketchy Gallery is a known art space in the third ring of Veloria City, located in the technological district just outside the inner core.", "words": 305, "sections": [{"h": "Overview", "t": "The Sketchy Gallery is a known art space in the third ring of Veloria City, located in the technological district just outside the inner core."}, {"h": "Description", "t": "From the street, the gallery appears modest: a narrow, standalone building among shops and market stalls, marked only by a slim entrance in a plain facade. Inside, visitors enter a long interior corridor that extends much deeper than the exterior suggests.\n\nThis hallway is the primary exhibition space. Moving display panels line the corridor, but they are not fixed to walls. Instead, they glide forward and backward through a gravitational balancing and magnetized mechanism embedded in floor and ceiling tracks. As visitors pass through, works shift in subtle relation to their movement, producing a continuously changing viewing experience.\n\nThe gallery displays works from across Nauw and sometimes farther reaches of F432. Some pieces are attributed to travelers claiming contact with other frequencies in Dias, though those claims are difficult to verify. Displayed media include painted canvases, ink drawings, silkscreen works, and experimental techniques of uncertain origin.\n\nA recognizable feature is the Sketchy Ape Book Club collection, shown as illuminated panel displays that contrast with traditional works nearby. At the center of the hall stands a large bronze statue of a seated man holding an umbrella beneath a circular skylight. At the far end, a solid blue door marked \"DO NOT OPEN\" remains permanently closed and publicly unexplained."}, {"h": "Lore", "t": "The Sketchy Gallery is often described as a cultural bridge between Veloria's physical art traditions and newer digital forms emerging in parts of F432.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Cultural | 4 | Gallery Custodians | Zephan Quell, Curator-Lord of The Sketchy Gallery |"}, {"h": "Stories or Depictions", "t": "Public collection reference: [SABC collection on Etherscan](https://etherscan.io/address/0xadc28cac9c1d53cc7457b11cc9423903dc09dddc)."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:the-unfinished", "slug": "the-unfinished", "label": "The Unfinished", "category": "region", "status": "canonical", "themes": ["mapworthy incompletion", "adaptive terrain", "iterative architecture", "craft as survival", "revision without collapse"], "path": "regions/the-unfinished.md", "region": "F960 (frequency realm)", "parent_region": "F960 (frequency realm)", "meta": {"region": "F960 (frequency realm)", "parent_region": "F960 (frequency realm)", "place_type": "region", "culture": "The Open Hand of Making"}, "assets": [], "summary": "The Unfinished is the primary mappable region within F960: a broad, traversable territory where land, structures, and routes hold long enough for charting, while still displaying visible states of incompletion.", "words": 359, "sections": [{"h": "Overview", "t": "**The Unfinished** is the primary mappable region within F960: a broad, traversable territory where land, structures, and routes hold long enough for charting, while still displaying visible states of incompletion."}, {"h": "Description", "t": "**Cartographic portrayal (for map generation)**  \nMap The Unfinished as a **layered draft-map** rather than one polished terrain pass. Use an elongated, asymmetric basin with five recurring sectors:\n\n1. **Scaffold Arc (northwest)**  \n   Step-like ridges and half-terraced ribs. Contours look intentionally interrupted before closure.\n\n2. **Margin Flats (north)**  \n   Pale chalk plains marked by alignment ticks, guide grids, and survey symbols that never fully erase.\n\n3. **Revision Delta (center-east)**  \n   Branching channels that split and rejoin in near-identical but never permanent courses; render like translucent overdrawn river strokes.\n\n4. **Ghost Quarter (south-central)**  \n   Repeating foundations and partial courtyards. Buildings appear 40-90% complete with exposed construction lines.\n\n5. **Erasure Verge (southwest boundary)**  \n   Soft edge where details blur, return, and shift by small increments; depict with gradient dashes, not hard borders.\n\n**Color and texture direction**\n- Base tones: warm graphite, chalk white, dusty slate.\n- Accent marks: cobalt guide lines, copper trace marks, occasional ember corrections.\n- Surface style: layered linework, visible underdrawing, revision ghosts, measured smudging.\n\n**Scale language**\n- Distances are serviceable but elastic: routes are charted in **passes** (first pass, clean pass, holding pass) as much as in miles.\n- Landmarks are named by persistence (how long they hold shape), not by age."}, {"h": "Lore", "t": "The Unfinished represents Dias-level becoming: a place where **incompletion is not failure** but active process. Travelers say it teaches a hard kindness: commit to form, but never worship finality.\n\nCommunities here optimize for adaptation. Architecture is modular, tools are multi-state, and social authority tends to favor maintainers, revisers, and mediators over conquerors."}, {"h": "Stories or Depictions", "t": "The region is often depicted as a map \"caught mid-edit.\" **The Half-Made Atlas** is the primary disputed artifact linked to this region's mutable cartography.\n\nThe **F960 Map** artwork is the primary current visualization of the region's sector layout (Scaffold Arc, Margin Flats, Revision Delta, Ghost Quarter, Erasure Verge) and pass-based scale language."}, {"h": "Notes", "t": "For image generation, avoid ruined aesthetics. The Unfinished should look **deliberate and alive**: active drafting, not collapse."}], "unresolved": []}, {"id": "region:veloria-city", "slug": "veloria-city", "label": "Veloria City", "category": "region", "status": "canonical", "themes": ["capital", "concentric city", "layered technology", "medieval outer ring", "hypertech core", "operators"], "path": "regions/veloria-city.md", "region": "Nauw", "parent_region": "Velorian Basin", "meta": {"region": "Nauw", "parent_region": "Velorian Basin", "place_type": "city"}, "assets": [], "summary": "Veloria City is the capital of the Nauw region within the F432 frequency realm. It lies in the north-west of Nauw, surrounded by the Velorian Basin. It is laid out as a massive circle of four concentric rings around a central core. Technology and daily life...", "words": 448, "sections": [{"h": "Overview", "t": "Veloria City is the capital of the Nauw region within the F432 frequency realm. It lies in the north-west of Nauw, surrounded by the Velorian Basin. It is laid out as a **massive circle** of **four concentric rings** around a **central core**. Technology and daily life change sharply from ring to ring: the outermost band is largely medieval in character, while each band inward grows more modern, then contemporary-industrial, then hyper-advanced at the center\u2014where the city\u2019s power is generated and sustained."}, {"h": "Description", "t": "**Outer ring (first band)**  \nThe outermost ring is where technology has advanced the least. Here you find **medieval-style** districts\u2014stone streets, marketplaces, guild houses, older defensive or civic forms\u2014but this is only **one section** of Veloria, not the whole city.\n\n**Second ring**  \nMoving inward, life becomes **more modern** in the sense of familiar contemporary housing, streets, and routines\u2014closer to \u201cnormal\u201d living as many know it\u2014**without** heavy reliance on advanced technology. It reads as modern, but not tech-saturated.\n\n**Third ring**  \nThe next band matches **present-day technological civilization**: robotics, AI, and the full spectrum of tools and infrastructure comparable to \u201ceverything we have today.\u201d\n\n**Central core (fourth / innermost zone)**  \nAt the heart of the circle lies a **small but extraordinarily powerful** zone of **hyper-advanced** technology\u2014described by many as almost **alien** in sophistication. The devices and systems here draw on knowledge and materials from **other realms** within Dias, not only from F432. This core exists in large part to **generate and regulate power** for Veloria City and, more broadly, for the **current realm\u2019s** energy and stability. The **Valorian Operators** live here; their sole vocation is to **keep the centerpiece running** through whatever daily work that demands.\n\nVeloria remains an important center of trade and exchange, with merchants, travelers, and explorers from across the region still gathering here\u2014now understood against this **layered**, ring-by-ring geography rather than as a uniformly medieval place.\n\nAbove the city, the phenomenon of the **Sky Drifters** still sets Veloria apart from other settlements in Nauw. Floating high in the sky are mysterious, vaguely humanoid shapes that drift in groups or clusters, never landing. Some residents see them as silent watchers; others suspect an overlap between frequencies in Dias. They remain a defining feature of Veloria\u2019s sky."}, {"h": "Lore", "t": "The contrast between the medieval-feeling rim and the realm-powering core is central to how Veloria is experienced and governed.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Structured | 1 | Ring Council | Oriven Tal, Ring Regent of Veloria City |"}, {"h": "Stories or Depictions", "t": "*Poster of Veloria City* is treated as a canonical city-arrival depiction showing inhabitants entering Veloria by cart."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:velorian-basin", "slug": "velorian-basin", "label": "Velorian Basin", "category": "region", "status": "canonical", "themes": ["trade concentration", "river routes", "market exchange", "folklore of magic", "outskirts everyday life"], "path": "regions/velorian-basin.md", "region": "F432 (frequency realm)", "parent_region": "Nauw", "meta": {"region": "F432 (frequency realm)", "parent_region": "Nauw", "place_type": "region"}, "assets": [], "summary": "Velorian Basin is the valley and low country that rings Veloria City in the north-west of Nauw. It is one of the busiest exchange zones in F432.", "words": 300, "sections": [{"h": "Overview", "t": "Velorian Basin is the valley and low country that rings Veloria City in the north-west of Nauw. It is one of the busiest exchange zones in F432."}, {"h": "Description", "t": "The basin encircles the capital rather than sitting at Nauw's geographic center. Caravan roads, river routes, and market towns spread outward from Veloria across the bowl of the land, creating dense movement corridors between the city and its outer basin towns.\n\nThe region functions as a logistical center where goods, labor, and travelers converge continuously. Its activity level makes it one of the most consistently populated and commercially active landscapes in the realm. To the south-east, travel corridors connect toward central Nauw and Brindle March; farther east lie the Glasswater Fields."}, {"h": "Lore", "t": "The guiding law of Velorian Basin is: \"Exchange creates connection.\"\n\nMarket lore and street parables sometimes claim that the first contract-magic and luck-cantrips used in basin trade were carried from Averra Isle by those who studied under the Old Masters. The story remains myth, not institutional history; see Old Masters of Averra Isle.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Structured | 2 | Basin Exchange Ward | Tamsin Vor, Market Steward of Velorian Basin |"}, {"h": "Stories or Depictions", "t": "Lore in this file often leans to **commerce**; a parallel strand celebrates **joy without transaction**: **The Sun-Sweet Afternoon**, the optical **Velorian Basin gilding hour**, the crowd tale **The afternoon the ball kept going**, and the gentle folk pattern **The light after shared laughter**. **The Moon-Market Walk** remains a calmer, night-time peace-myth in the same emotional family. Newer social-coordination lore in **As One** and **The Circle Step Accord** frames basin diplomacy as rhythm practiced in public, not only policy filed in offices."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:verdant-reach", "slug": "verdant-reach", "label": "Verdant Reach", "category": "region", "status": "canonical", "themes": ["fertile landscapes", "orchard cultivation", "food supply", "stewardship boundaries"], "path": "regions/verdant-reach.md", "region": "F432 (frequency realm)", "parent_region": "Wabet", "meta": {"region": "F432 (frequency realm)", "parent_region": "Wabet", "place_type": "region"}, "assets": [], "summary": "Verdant Reach is the central region of Wabet, known for fertile groves, flowering fields, and clear river systems.", "words": 214, "sections": [{"h": "Overview", "t": "Verdant Reach is the central region of Wabet, known for fertile groves, flowering fields, and clear river systems."}, {"h": "Description", "t": "The area produces significant natural food output that moves through trade networks across the F432 frequency realm. Rather than industrialized farming, local communities maintain smaller orchard systems and gentle cultivation patterns that preserve soil and river health.\n\nClear waterways and flowering plains make Verdant Reach one of Wabet's most productive and ecologically stable landscapes.\n\nGeographically, Verdant Reach occupies the middle of Wabet between Aelwyn Canopy to the north and Lumira Sands to the south."}, {"h": "Lore", "t": "The guiding law of Verdant Reach is: \"Growth must remain in harmony with the land.\"\n\nMost large-cycle cultivation and supply stewardship is carried by Verdant Farmers. Local accounts also describe boundary tension with roaming Lucky Farmers from Aelwyn Canopy, who are often treated as outside opportunists and restricted from core managed plots.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Stewardship | 3 | Verdant Stewards | Maes Thorn, Orchard Warden of Verdant Reach |"}, {"h": "Stories or Depictions", "t": "Domestic lore in Verdant Reach often appears through meal-table rituals rather than grand ceremony. **Breakfast 1** and **The Third-Chair Breakfast** are commonly used to frame reconciliation through routine hospitality."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "region:wabet", "slug": "wabet", "label": "Wabet", "category": "region", "status": "canonical", "themes": ["natural purity", "serenity", "wilderness", "minimal human influence", "anomalous fruit forms"], "path": "regions/wabet.md", "region": "F432 (frequency realm)", "parent_region": "F432 (frequency realm)", "meta": {"region": "F432 (frequency realm)", "parent_region": "F432 (frequency realm)", "place_type": "region"}, "assets": [], "summary": "Wabet occupies the western lands of the F432 frequency realm, spanning the full western side of the regional map.", "words": 363, "sections": [{"h": "Overview", "t": "Wabet occupies the western lands of the F432 frequency realm, spanning the full western side of the regional map."}, {"h": "Description", "t": "Wabet stretches along the entire western boundary of F432. It borders Nauw to the east and Sorel to the southeast. Unlike other regions of F432, Wabet is widely known as a place of natural purity and quiet serenity.\n\nIts landscapes include vast forests, untouched jungles, clear rivers, deserts, and scattered chains of small islands along its coasts. The waters are said to be exceptionally pure, and many travelers describe the air itself as unusually clear and calm.\n\nHuman influence in Wabet is minimal. No dominant culture or governing authority controls the region, and settlements are sparse compared to other lands in F432. The few inhabitants who live there are scattered across the wilderness and often live in harmony with the surrounding environment.\n\nBecause of its untouched landscapes and peaceful atmosphere, travelers sometimes refer to Wabet as a place of cleansing or quiet reflection within the frequency realm."}, {"h": "Lore", "t": "Wabet defines the western edge of F432 and stands in contrast to the heavily populated routes of Nauw and the harsh frontier character of Sorel. It is also a major fruit source for Nauw, whose markets and food culture depend on produce routes moving eastward from Wabet.\n\nA recurring produce-side phenomenon is the appearance of near-perfect fruit forms among otherwise organic growth patterns. Traders and households often classify these as Lucky Fruits; while unproven in strict scientific terms, repeated anecdotal outcomes keep the belief active across F432.\n\nRecognized subregions include Aelwyn Canopy across the north (with limited extension southward), Verdant Reach at the center, and Lumira Sands across the south. The major offshore island Isle of Calareth lies off Wabet's eastern side.\n\n### Leadership Structure\n\n| Governance Style | Influence Tier | Governing Group | Leadership Seat |\n|---|---:|---|---|\n| Tribal + Stewardship | 2 | Wabet Keepers | Elyra Mossen, First Keeper of Wabet |"}, {"h": "Stories or Depictions", "t": "*Map of Wabet* is treated as a canonical close-up representation of Wabet's established regional layout. Cosmology-flavored **The West That Chose Calm** offers a mythic *why* for the region\u2019s persistent serenity without replacing ecological description."}, {"h": "Notes", "t": ""}], "unresolved": []}, {"id": "rule:aelwyn-canopy-seven-paths-rule", "slug": "aelwyn-canopy-seven-paths-rule", "label": "Aelwyn Canopy seven-paths rule", "category": "rule", "status": "canonical", "themes": ["route diplomacy", "tribe coexistence", "seasonal balance"], "path": "rules/aelwyn-canopy-seven-paths-rule.md", "region": "Aelwyn Canopy", "parent_region": "", "meta": {"region": "Aelwyn Canopy", "scope": "Aelwyn inter-tribe passage law"}, "assets": [], "summary": "Aelwyn Canopy seven-paths rule", "words": 70, "sections": [{"h": "Name", "t": "Aelwyn Canopy seven-paths rule"}, {"h": "Overview", "t": "No single canopy path may be claimed as exclusive in all seasons."}, {"h": "Description", "t": "Core elevated routes rotate priority by season and pressure. Emergency rights exist, but they cannot convert into permanent ownership claims."}, {"h": "Effect", "t": "- Prevents choke-point monopol
